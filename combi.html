<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Combi Detail</title>
<style>
  :root{
    --thumb-large:120px;
    --pilot-thumb:120px; /* パイロットとユニットを同じサイズに統一 */
    --muted:#666;
    --accent:#2b6cb0;
    --navy:#0b3b66; /* ハイライト用の紺色 */
    --orange:#d97706;
    font-family: system-ui, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Segoe UI", Arial;
  }
  body{margin:16px;color:#111;background:#fff}
  .back{display:inline-block;margin-bottom:12px;color:var(--accent);text-decoration:none}
  .container{display:flex;flex-direction:column;gap:12px}
  .block{display:flex;gap:12px;align-items:flex-start;border:1px solid #eee;padding:10px;border-radius:8px}
  .thumb-wrap{flex:0 0 auto;width:var(--pilot-thumb);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
  .p-thumb{width:var(--pilot-thumb);height:var(--pilot-thumb);object-fit:cover;border-radius:6px;border:1px solid #ddd;display:block}
  .info{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
  .unit-name, .p-name{font-size:20px;font-weight:700;line-height:1.1}
  .p-name{font-weight:800}
  .p-params{display:flex;gap:12px;flex-wrap:wrap}
  .param{background:#fff3e0;padding:6px 8px;border-radius:6px;font-weight:800;color:#d97706}
  .skills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .skill-icon{width:30px;height:30px;border-radius:4px;border:1px solid #ccc;object-fit:cover}
  .series-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .series-tag-icon{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:12px;color:#fff;font-weight:700;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,0.12);gap:6px}
  .series-tag-icon.series{background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #93c5fd 100%); color:#fff;}
  .series-tag-icon.tag{background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 50%, #b45309 100%); color:#fff;}
  .highlight{color:var(--navy);font-weight:800;margin-top:4px}
  .meta-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-weight:700}
  .unit-stats-row{display:flex;gap:12px;align-items:center}
  .feature-line{color:var(--orange);font-weight:800;font-size:15px}
  .diag{font-size:12px;color:#999;margin-top:6px}
  @media (max-width:520px){
    .block{flex-direction:row}
    .info{min-width:0}
    .series-tags{gap:6px}
  }
</style>
</head>
<body>
<a class="back" href="detail.html">← Back</a>
<main class="container">

  <!-- 上段: パイロット（画像・名前・highlight・シリーズ/タグ） -->
  <section id="pilot-area">
    <div class="block pilot-block">
      <div class="thumb-wrap">
        <img id="pilot-thumb" class="p-thumb" src="" alt="pilot" />
      </div>
      <div class="info">
        <div class="p-name" id="pilot-name"></div>
        <div id="pilot-highlight" class="highlight" aria-live="polite"></div>
        <!-- スキルアイコンは不要のため削除 -->
        <div class="series-tags" id="pilot-series-tags" aria-hidden="false"></div>
        <div id="pilot-extra" class="diag"></div>
      </div>
    </div>
  </section>

  <!-- 下段: ユニット（画像・名前・シリーズ/タグ） -->
  <section id="unit-area">
    <div class="block unit-block">
      <div class="thumb-wrap">
        <img id="unit-thumb" class="p-thumb" src="" alt="unit" />
      </div>
      <div class="info">
        <div class="unit-name" id="unit-name"></div>
        <div id="unit-highlight" class="highlight" aria-live="polite"></div>
        <div class="unit-stats-row" id="unit-stats-row"></div>
        <div class="series-tags" id="unit-series-tags" aria-hidden="false"></div>
        <div id="unit-feature" class="feature-line"></div>
      </div>
    </div>
  </section>

</main>

<script>
/* params */
const params = new URLSearchParams(location.search);
const uidParam = params.get("uid");
const pidParam = params.get("pid");

/* json paths */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = JSON_BASE_URL + "/units.json";
const PILOTS_JSON = JSON_BASE_URL + "/pilots.json";
const SERIES_TAG_JSON = JSON_BASE_URL + "/series_tag_options.json";

/* DOM */
const unitThumb = document.getElementById("unit-thumb");
const unitName = document.getElementById("unit-name");
const unitStatsRow = document.getElementById("unit-stats-row");
const unitSeriesTagsEl = document.getElementById("unit-series-tags");
const unitFeature = document.getElementById("unit-feature");
const unitHighlight = document.getElementById("unit-highlight");

const pilotThumb = document.getElementById("pilot-thumb");
const pilotName = document.getElementById("pilot-name");
const pilotSeriesTagsEl = document.getElementById("pilot-series-tags");
const pilotExtra = document.getElementById("pilot-extra");
const pilotHighlight = document.getElementById("pilot-highlight");

/* global series/tag options holder */
let seriesTagOptions = null;

/* helper fetch */
async function fetchJson(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url + " fetch failed: " + r.status);
  return r.json();
}

/* normalize array-like fields */
function normalizeArrayLike(v){
  if(v === undefined || v === null) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim()).filter(Boolean);
  return String(v).split(",").map(s=>s.trim()).filter(Boolean);
}

/* render series/tag into a target element for a given object and series/tag options */
function renderSeriesTags(targetEl, obj, sto){
  if(!targetEl) return;
  targetEl.innerHTML = "";
  if(!sto) return;
  const seriesList = Array.isArray(sto.series_unit) ? sto.series_unit : [];
  const tagList = Array.isArray(sto.tag_unit) ? sto.tag_unit : [];
  const unitSeriesCandidates = ["シリーズ連結","シリーズ","Series","SeriesName","series","SeriesName"];
  const unitTagCandidates = ["タグ連結","タグ","Tag","TagName","tag","TagName"];
  let unitSeries = [], unitTags = [];
  for(const k of unitSeriesCandidates){
    if(obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== ""){
      unitSeries = normalizeArrayLike(obj[k]);
      break;
    }
  }
  for(const k of unitTagCandidates){
    if(obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== ""){
      unitTags = normalizeArrayLike(obj[k]);
      break;
    }
  }
  // simple matching by trimmed equality
  seriesList.forEach(label=>{
    if(unitSeries.some(us => String(us).trim() === String(label).trim())){
      const d = document.createElement("div");
      d.className = "series-tag-icon series";
      d.textContent = label;
      targetEl.appendChild(d);
    }
  });
  tagList.forEach(label=>{
    if(unitTags.some(ut => String(ut).trim() === String(label).trim())){
      const d = document.createElement("div");
      d.className = "series-tag-icon tag";
      d.textContent = label;
      targetEl.appendChild(d);
    }
  });
}

/* render pilot details */
function renderPilotDetails(p){
  pilotThumb.src = p["Pilot.画像リンク"] || "";
  pilotName.textContent = p["Pilot.キャラ"] || "";

  // highlight (Pilot.特徴 / Pilot.条件) shown directly under name in navy
  const feat = p["Pilot.特徴"] || p["Pilot.特徴のタイプ"] || "";
  const cond = p["Pilot.条件"] || "";
  pilotHighlight.innerHTML = "";
  if(feat && String(feat).trim() !== "0"){
    const el = document.createElement("div");
    el.textContent = String(feat);
    pilotHighlight.appendChild(el);
  }
  if(cond && String(cond).trim() !== "0"){
    const el = document.createElement("div");
    el.textContent = String(cond);
    pilotHighlight.appendChild(el);
  }

  // series/tag for pilot (render into pilot-series-tags)
  pilotSeriesTagsEl.innerHTML = "";
  if(seriesTagOptions){
    renderSeriesTags(pilotSeriesTagsEl, p, seriesTagOptions);
  }

  // pilotExtra can show additional debug/info if needed
  pilotExtra.innerHTML = "";
}

/* render unit details */
function renderUnitDetails(u){
  unitThumb.src = u["画像リンク"] || "";
  unitName.textContent = u["ユニット"] || ("ID:" + (u.uid || ""));
  unitStatsRow.innerHTML = "";
  const move = u["移動力"] || "-";
  const range = u["最大射程"] || "-";
  const obtain = u["入手"] || "-";
  const r1 = document.createElement("div"); r1.textContent = `移動: ${move}`; unitStatsRow.appendChild(r1);
  const r2 = document.createElement("div"); r2.textContent = `最大射程: ${range}`; unitStatsRow.appendChild(r2);
  const r3 = document.createElement("div"); r3.textContent = `入手: ${obtain}`; unitStatsRow.appendChild(r3);

  // unit highlight (use unit["特徴"] if present)
  unitHighlight.innerHTML = "";
  const feat = u["特徴"] || u["Feature"] || "";
  if(feat && String(feat).trim() !== ""){
    unitHighlight.textContent = String(feat);
  }

  unitFeature.textContent = u["武装 Power"] !== undefined && u["武装 Power"] !== null && u["武装 Power"] !== "" ? `武装 Power: ${u["武装 Power"]}` : "";

  // render unit series/tags
  unitSeriesTagsEl.innerHTML = "";
  if(seriesTagOptions){
    renderSeriesTags(unitSeriesTagsEl, u, seriesTagOptions);
  }
}

/* init */
async function init(){
  try{
    const units = await fetchJson(UNITS_JSON);
    const pilots = await fetchJson(PILOTS_JSON);
    const sto = await fetchJson(SERIES_TAG_JSON);
    seriesTagOptions = sto || null;

    const uid = Number(uidParam);
    const pid = Number(pidParam);

    const unit = units.find(u=>Number(u.uid)===uid);
    const pilot = pilots.find(p=> {
      const candidates = [p.pid, p["pid"], p["Pilot.キャラ識別"]];
      return candidates.some(c=> Number(c) === pid);
    });

    if(pilot){
      renderPilotDetails(pilot);
    } else {
      pilotName.textContent = "パイロットが見つかりません";
    }

    if(unit){
      renderUnitDetails(unit);
    } else {
      unitName.textContent = "ユニットが見つかりません";
    }

  }catch(e){
    console.error(e);
  }
}

init();
</script>
</body>
</html>
