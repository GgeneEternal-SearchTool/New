<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Unit List</title>
<style>
  :root{
    --gap:6px;           /* smaller gap between cards */
    --thumb:60px;
    --card-w:90px;
    --accent:#2b6cb0;
    --muted:#666;
    --meta-red:#b22222;
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Arial;
  }

  /* Page layout */
  html,body{height:100%;margin:0}
  body{color:#111;background:#fff;padding:16px}
  header{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin:0 0 12px 0;
    padding:8px 0;
    background:#fff;
    border-bottom:1px solid #eee;
    position:static; /* allow full page scroll */
    z-index:10;
  }
  h1{margin:0;font-size:18px}

  /* Filters / Controls */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    width:100%;
  }
  .filters select,.filters input{
    padding:6px;border:1px solid #ddd;border-radius:6px;background:#fff;
  }

  /* Label appearance */
  .filters label{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    font-size:11px;        /* change this number to adjust label font-size */
    margin:0;
    max-width: 180px;       /* minimum label width; change as needed */
  }

  /* Row break element to force new line in flex layout */
  .filters-row-break{
    flex-basis:100%;
    height:0;
  }

  /* Series full row */
  .filters-fullrow{
    flex-basis:100%;
    width:100%;
    margin-top:4px;
  }

  /* Inline container for Tag1/Tag2 */
  .filters-inline{
    display:flex;
    gap:8px;               /* gap between Tag1 and Tag2 */
    align-items:flex-start;
    width:100%;
  }

  /* Each Tag item width (70% as requested) */
  .filters-inline-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    width:70%;             /* change this number to adjust Tag width */
  }

  /* If you prefer Tag1/Tag2 to share space equally, use width:48% above instead */

  .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Pagination controls */
  .pager{display:flex;gap:8px;align-items:center;margin-left:8px}
  .pager .page-info{font-size:13px;color:var(--muted)}

  /* Grid and cards */
  main{min-height:60vh}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:var(--gap)}
  a.card{
    border:1px solid #eee;
    border-radius:6px;
    padding:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:#fff;
    position:relative;
    overflow:visible;
    text-decoration:none;
    color:inherit;
    min-width:var(--card-w);
    max-width:var(--card-w);
    box-sizing:border-box;
  }
  a.card, a.card * { text-decoration: none !important; }

  /* Icon area */
  .icon-area{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;pointer-events:none;margin:0}
  .icon-top{width:100%;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 6px;box-sizing:border-box}
  .icon-circle{min-width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,0.12);padding:0 6px}
  .icon-circle.dim{ opacity:0.45; }

  .rare-row{width:100%;display:flex;justify-content:center}
  .rare-badge{display:inline-block;padding:4px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:11px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,0.12)}

  /* Thumb */
  .thumb-wrap{width:var(--thumb);height:var(--thumb);display:flex;align-items:center;justify-content:center;margin-top:0}
  .thumb{width:var(--thumb);height:var(--thumb);object-fit:cover;border-radius:4px;border:1px solid #ddd;display:block}

  /* Text */
  .name{font-size:12px;text-align:center;line-height:1.2;margin:0}
  .meta{font-size:12px;color:#000;font-weight:800;margin:0;min-height:1.2em}
  .meta-number{color:var(--meta-red);font-weight:900;font-size:14px;line-height:1}

  .count{margin-top:8px;color:var(--muted);font-size:13px}
  .small{font-size:12px;color:#444}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  footer{margin-top:18px;color:var(--muted);font-size:13px}

  /* Rarity classes (kept) */
  .rarity-ur3 { background: linear-gradient(90deg,#e6d9ff 0%,#ffd9e6 18%,#e9dbff 36%,#e8f7d9 56%,#d9f7fb 76%,#cfeaff 100%); color:#1a1a1a; font-weight:450; border-radius:6px; padding:3px 6px; display:inline-block; font-size:11px; }
  .rarity-ur0 { background: linear-gradient(90deg,#f3efff 0%,#fff3f6 18%,#f6efff 36%,#f6fbef 56%,#eefbfd 76%,#eef7ff 100%); color:#000000; font-weight:100; border-radius:6px; padding:3px 6px; display:inline-block; font-size:11px; }
  .rarity-ssr-ssp { background: linear-gradient(90deg,#ff8a33 0%,#ff9f4d 25%,#ffc24f 55%,#ffe27a 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:450; display:inline-block; font-size:11px; }
  .rarity-ssr-sp { background: linear-gradient(90deg,#ffd8b4 0%,#ffe0c2 25%,#ffecb3 55%,#fff7d5 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:100; display:inline-block; font-size:11px; }

  @media (max-width:520px){
    header{flex-direction:column;align-items:stretch}
    .controls{margin-left:0}
    .icon-circle{min-width:16px;height:16px;font-size:10px;padding:0 4px}
    .rare-badge{padding:3px 6px;font-size:10px}
    .filters-inline { flex-direction:column; }
    .filters-inline-item { width:100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Unit List</h1>

  <div class="filters" aria-label="Filters">
    <label><span class="small">Rare</span>
      <select id="filter-rarity" multiple title="Select one or more Rares"><option value="">All</option></select>
    </label>

    <label><span class="small">Type</span>
      <select id="filter-type" multiple title="Select one or more Types"><option value="">All</option></select>
    </label>

    <label><span class="small">Move</span>
      <select id="filter-move" multiple title="Select one or more Move values"><option value="">All</option></select>
    </label>

    <label><span class="small">Range</span>
      <select id="filter-range" multiple title="Select one or more Range values"><option value="">All</option></select>
    </label>

    <label><span class="small">Obtain</span>
      <select id="filter-obtain" multiple title="Select one or more Obtain values"><option value="">All</option></select>
    </label>

    <!-- force new line -->
    <div class="filters-row-break"></div>

    <!-- Series full row -->
    <label class="filters-fullrow"><span class="small">Series</span>
      <select id="filter-series" title="Series"><option value="">All</option></select>
    </label>

    <!-- force new line -->
    <div class="filters-row-break"></div>

    <!-- Tag1 and Tag2 inline -->
    <div class="filters-inline">
      <label class="filters-inline-item"><span class="small">Tag1</span>
        <select id="filter-tag1" title="Tag1"><option value="">All</option></select>
      </label>
      <label class="filters-inline-item"><span class="small">Tag2</span>
        <select id="filter-tag2" title="Tag2"><option value="">All</option></select>
      </label>
    </div>
  </div>

  <div class="controls" aria-hidden="false">
    <label class="small">Sort by</label>
    <select id="sort-by" class="btn" title="Sort by"></select>

    <div class="pager" aria-label="Pagination controls">
      <button id="prev-page" class="btn" title="Previous page">Prev</button>
      <div class="page-info" id="page-info">Page 1</div>
      <button id="next-page" class="btn" title="Next page">Next</button>
    </div>

    <button id="reset" class="btn">Reset</button>
  </div>
</header>

<main>
  <div id="summary" class="count">Loading...</div>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="empty" class="empty" style="display:none">No matching units found.</div>
  <div id="error" style="color:#b33;margin-top:12px;display:none"></div>
</main>

<footer>
  <div>Data: GitHub JSON</div>
</footer>

<script>
/* ===== Settings ===== */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = () => `${JSON_BASE_URL}/units.json`;
const COMBI_FIELD_MAP_JSON = () => `${JSON_BASE_URL}/combi_field_map.json`;
const SERIES_TAG_JSON = () => `${JSON_BASE_URL}/series_tag_options.json`;

const PAGE_SIZE = 100;
const STORAGE_KEY = "unitListFilters_v1";

const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage-full active",
  "CD": "Critical Damage (full active)",
  "HB0": "耐久回数ビーム",
  "HB1": "耐久回数物理",
  "HB2": "耐久回数特殊",
  "HB3": "耐久回数EX",
  "HB0_F": "耐久回数ビーム (full)",
  "HB1_F": "耐久回数物理 (full)",
  "HB2_F": "耐久回数特殊 (full)",
  "HB3_F": "耐久回数EX (full)"
};

let units = [], fieldMap = {}, seriesTagOptions = {};
let currentPage = 1;
let totalPages = 1;
let currentFiltered = [];

const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const emptyEl = document.getElementById("empty");
const errorEl = document.getElementById("error");

const filterRarity = document.getElementById("filter-rarity");
const filterType = document.getElementById("filter-type");
const filterMove = document.getElementById("filter-move");
const filterRange = document.getElementById("filter-range");
const filterObtain = document.getElementById("filter-obtain");
const filterSeries = document.getElementById("filter-series");
const filterTag1 = document.getElementById("filter-tag1");
const filterTag2 = document.getElementById("filter-tag2");

const sortBy = document.getElementById("sort-by");
const prevPageBtn = document.getElementById("prev-page");
const nextPageBtn = document.getElementById("next-page");
const pageInfo = document.getElementById("page-info");
const resetBtn = document.getElementById("reset");

let sortDirAsc = false; // default descending for numeric fields

/* ===== Helpers ===== */
async function fetchJson(url, cacheBust=false){
  const u = cacheBust ? `${url}?v=${Date.now()}` : url;
  const res = await fetch(u);
  if(!res.ok) throw new Error(`Fetch failed: ${u} (${res.status})`);
  return res.json();
}

function uniqueValues(arr, key){
  const s = new Set();
  arr.forEach(x => {
    const v = (x[key] || "").toString().trim();
    if(v !== "") s.add(v);
  });
  return Array.from(s).sort((a,b)=> a.localeCompare(b, 'ja'));
}

function populateMultiSelect(selectEl, values){
  selectEl.innerHTML = '';
  const allOpt = document.createElement("option");
  allOpt.value = "";
  allOpt.textContent = "All";
  selectEl.appendChild(allOpt);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

function populateSelect(selectEl, values){
  selectEl.innerHTML = '';
  const allOpt = document.createElement("option");
  allOpt.value = "";
  allOpt.textContent = "All";
  selectEl.appendChild(allOpt);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

function populateSortOptions(){
  sortBy.innerHTML = "";
  const optName = document.createElement("option");
  optName.value = "name";
  optName.textContent = "Name";
  sortBy.appendChild(optName);
  Object.keys(FIELD_LABELS).forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = FIELD_LABELS[k] + " (" + k + ")";
    sortBy.appendChild(opt);
  });
}

/* numeric check */
function isNumericValue(v){
  if(v === undefined || v === null || v === "") return false;
  const n = Number(v);
  return Number.isFinite(n);
}

/* format display: HB* show 2 decimals, others integer rounded */
function formatValueForDisplay(key, v){
  if(v === undefined || v === null || v === "") return "-";
  const n = Number(v);
  if(!Number.isFinite(n)) return String(v);
  if(/^HB/i.test(key)){
    return n.toFixed(2);
  }
  return Math.round(n).toLocaleString('ja-JP');
}

/* render a single card */
function renderCard(u){
  const a = document.createElement("a");
  a.href = `detail.html?uid=${encodeURIComponent(u.uid)}`;
  a.className = "card";
  a.title = u["ユニット"] || u["ユニット識別"] || "unit";

  const iconArea = document.createElement("div");
  iconArea.className = "icon-area";

  const top = document.createElement("div");
  top.className = "icon-top";

  const moveVal = (u["移動力"] || "").toString();
  const left = document.createElement("div");
  left.className = "icon-circle" + (moveVal ? "" : " dim");
  left.style.background = `rgba(220,20,60,${0.35 + (Math.max(2, Math.min(6, Number(moveVal||2))) - 2) * ((1.0 - 0.35) / (6 - 2))})`;
  left.textContent = "M" + (moveVal || "-");
  top.appendChild(left);

  const right = document.createElement("div");
  const rangeVal = (u["最大射程"] || "").toString();
  right.className = "icon-circle" + (rangeVal ? "" : " dim");
  right.style.background = `rgba(30,144,255,${0.35 + (Math.max(2, Math.min(6, Number(rangeVal||2))) - 2) * ((1.0 - 0.35) / (6 - 2))})`;
  right.textContent = "R" + (rangeVal || "-");
  top.appendChild(right);

  iconArea.appendChild(top);

  const rareRow = document.createElement("div");
  rareRow.className = "rare-row";
  const rareBadge = document.createElement("div");
  const rare = (u["レア"] || "").toString();
  let rc = "";
  const s = String(rare).replace(/\s+/g,"").toUpperCase();
  if(s.indexOf("UR") !== -1 && s.indexOf("3") !== -1) rc = "rarity-ur3";
  else if(s.indexOf("UR") !== -1 && (s.indexOf("0") !== -1 || s.indexOf("０") !== -1)) rc = "rarity-ur0";
  else if(s.indexOf("SSR") !== -1 && s.indexOf("SSP") !== -1) rc = "rarity-ssr-ssp";
  else if(s.indexOf("SSP") !== -1 || s.indexOf("SP") !== -1) rc = "rarity-ssr-sp";
  else if(s.indexOf("SSR") !== -1) rc = "rarity-ssr-ssp";
  rareBadge.className = rc ? rc : "rare-badge";
  rareBadge.textContent = rare || "";
  rareRow.appendChild(rareBadge);
  iconArea.appendChild(rareRow);

  a.appendChild(iconArea);

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";
  const img = document.createElement("img");
  img.className = "thumb";
  img.src = u["画像リンク"] || "";
  img.alt = u["ユニット"] || "";
  img.loading = "lazy";
  wrap.appendChild(img);
  a.appendChild(wrap);

  const nm = document.createElement("div");
  nm.className = "name";
  nm.textContent = u["ユニット"] || ("ID:" + u.uid);
  a.appendChild(nm);

  const meta = document.createElement("div");
  meta.className = "meta";

  const key = sortBy.value || "D0";
  if(key === "name"){
    meta.textContent = u["ユニット"] || "";
  } else {
    const val = u[key];
    if(isNumericValue(val)){
      const formatted = formatValueForDisplay(key, val);
      const span = document.createElement("span");
      span.className = "meta-number";
      span.textContent = formatted;
      meta.innerHTML = "";
      meta.appendChild(span);
    } else if(val === undefined || val === null || val === ""){
      meta.textContent = "-";
    } else {
      meta.textContent = String(val);
    }
  }

  a.appendChild(meta);

  return a;
}

/* populate series/tag selects from series_tag_options.json */
function populateSeriesAndTags(){
  filterSeries.innerHTML = '<option value="">All</option>';
  filterTag1.innerHTML = '<option value="">All</option>';
  filterTag2.innerHTML = '<option value="">All</option>';
  if(seriesTagOptions && Array.isArray(seriesTagOptions.series_unit)){
    seriesTagOptions.series_unit.forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      filterSeries.appendChild(opt);
    });
  }
  if(seriesTagOptions && Array.isArray(seriesTagOptions.tag_unit)){
    seriesTagOptions.tag_unit.forEach(v=>{
      const opt1 = document.createElement("option");
      opt1.value = v;
      opt1.textContent = v;
      filterTag1.appendChild(opt1);
      const opt2 = document.createElement("option");
      opt2.value = v;
      opt2.textContent = v;
      filterTag2.appendChild(opt2);
    });
  }
}

/* get selected values from a multi-select (excluding the "All" empty option) */
function getMultiSelectValues(selectEl){
  const vals = Array.from(selectEl.selectedOptions).map(o => o.value).filter(v => v !== "");
  return vals;
}

/* Save/load UI state to sessionStorage */
function collectUIState() {
  return {
    rarities: getMultiSelectValues(filterRarity),
    types: getMultiSelectValues(filterType),
    moves: getMultiSelectValues(filterMove),
    ranges: getMultiSelectValues(filterRange),
    obtains: getMultiSelectValues(filterObtain),
    series: filterSeries.value || "",
    tag1: filterTag1.value || "",
    tag2: filterTag2.value || "",
    sortBy: sortBy.value || "D0",
    sortDirAsc: !!sortDirAsc,
    page: currentPage || 1
  };
}
function saveUIState() {
  try {
    const st = collectUIState();
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(st));
  } catch (e) {
    console.warn("Could not save UI state:", e);
  }
}
function loadSavedUIState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn("Could not load saved UI state:", e);
    return null;
  }
}
function applyUIState(state) {
  if(!state) return;
  function setMulti(selectEl, values) {
    const vals = Array.isArray(values) ? values : [];
    Array.from(selectEl.options).forEach(opt => {
      if(opt.value === "") {
        opt.selected = vals.length === 0;
      } else {
        opt.selected = vals.includes(opt.value);
      }
    });
  }
  setMulti(filterRarity, state.rarities || []);
  setMulti(filterType, state.types || []);
  setMulti(filterMove, state.moves || []);
  setMulti(filterRange, state.ranges || []);
  setMulti(filterObtain, state.obtains || []);
  if(state.series !== undefined) filterSeries.value = state.series;
  if(state.tag1 !== undefined) filterTag1.value = state.tag1;
  if(state.tag2 !== undefined) filterTag2.value = state.tag2;
  if(state.sortBy) sortBy.value = state.sortBy;
  sortDirAsc = !!state.sortDirAsc;
  currentPage = Math.max(1, Number(state.page || 1));
}

/* apply filters and render (AND across Series, Tag1, Tag2; multi-selects for Rare/Type/Move/Range/Obtain) */
function applyFiltersAndRender(){
  const rarities = getMultiSelectValues(filterRarity);
  const types = getMultiSelectValues(filterType);
  const moves = getMultiSelectValues(filterMove);
  const ranges = getMultiSelectValues(filterRange);
  const obtains = getMultiSelectValues(filterObtain);

  const seriesVal = filterSeries.value;
  const tag1Val = filterTag1.value;
  const tag2Val = filterTag2.value;

  let list = units.slice();

  if(rarities.length){
    list = list.filter(u => rarities.includes((u["レア"]||"").toString()));
  }
  if(types.length){
    list = list.filter(u => types.includes((u["タイプ"]||"").toString()));
  }
  if(moves.length){
    list = list.filter(u => moves.includes((u["移動力"]||"").toString()));
  }
  if(ranges.length){
    list = list.filter(u => ranges.includes((u["最大射程"]||"").toString()));
  }
  if(obtains.length){
    list = list.filter(u => obtains.includes((u["入手"]||"").toString()));
  }

  // Series: exact match against comma-separated "シリーズ連結"
  if(seriesVal){
    list = list.filter(u => {
      const s = (u["シリーズ連結"] || "").toString();
      if(!s) return false;
      return s.split(",").map(x=>x.trim()).some(x => x === seriesVal);
    });
  }

  // Tag1: exact match against "タグ連結"
  if(tag1Val){
    list = list.filter(u => {
      const s = (u["タグ連結"] || "").toString();
      if(!s) return false;
      return s.split(",").map(x=>x.trim()).some(x => x === tag1Val);
    });
  }

  // Tag2: AND with Tag1
  if(tag2Val){
    list = list.filter(u => {
      const s = (u["タグ連結"] || "").toString();
      if(!s) return false;
      return s.split(",").map(x=>x.trim()).some(x => x === tag2Val);
    });
  }

  // Sorting
  const key = sortBy.value;
  list.sort((a,b)=>{
    if(key === "name"){
      const sa = (a["ユニット"]||"").toString();
      const sb = (b["ユニット"]||"").toString();
      return sortDirAsc ? sa.localeCompare(sb, 'ja') : sb.localeCompare(sa, 'ja');
    }
    const va = a[key], vb = b[key];
    const na = (va === undefined || va === null || va === "") ? null : Number(va);
    const nb = (vb === undefined || vb === null || vb === "") ? null : Number(vb);
    if(!isNaN(na) && !isNaN(nb)){
      return sortDirAsc ? na - nb : nb - na;
    }
    const sa = (va||"").toString();
    const sb = (vb||"").toString();
    return sortDirAsc ? sa.localeCompare(sb, 'ja') : sb.localeCompare(sa, 'ja');
  });

  // Save filtered list and compute pagination
  currentFiltered = list;
  totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  // persist UI state
  saveUIState();
  renderPage();
}

/* render current page */
function renderPage(){
  grid.innerHTML = "";
  const total = currentFiltered.length;
  if(total === 0){
    emptyEl.style.display = "block";
    summary.textContent = `Showing 0 / ${units.length} units`;
    pageInfo.textContent = `Page 0 / 0`;
    prevPageBtn.disabled = true;
    nextPageBtn.disabled = true;
    return;
  } else {
    emptyEl.style.display = "none";
  }

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const pageItems = currentFiltered.slice(start, end);

  pageItems.forEach(u => grid.appendChild(renderCard(u)));

  summary.textContent = `Showing ${start + 1}–${end} / ${units.length} units (filtered ${total})`;
  pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;

  prevPageBtn.disabled = (currentPage <= 1);
  nextPageBtn.disabled = (currentPage >= totalPages);
}

/* Initialization */
async function init(cacheBust=false){
  errorEl.style.display = "none";
  try{
    try{ fieldMap = await fetchJson(COMBI_FIELD_MAP_JSON(), cacheBust); }catch(e){ fieldMap = {}; }
    try{ seriesTagOptions = await fetchJson(SERIES_TAG_JSON(), cacheBust); }catch(e){ seriesTagOptions = {}; }

    units = await fetchJson(UNITS_JSON(), cacheBust);

    // populate multi-selects (Rare, Type, Move, Range, Obtain)
    populateMultiSelect(filterRarity, uniqueValues(units, "レア"));
    populateMultiSelect(filterType, uniqueValues(units, "タイプ"));
    populateMultiSelect(filterMove, uniqueValues(units, "移動力"));
    populateMultiSelect(filterRange, uniqueValues(units, "最大射程"));
    populateMultiSelect(filterObtain, uniqueValues(units, "入手"));

    populateSeriesAndTags();
    populateSortOptions();

    // try to restore saved state; if none, do normal initial render
    const saved = loadSavedUIState();
    if(saved){
      applyUIState(saved);
      // ensure sortBy exists in options
      if(!Array.from(sortBy.options).some(o=>o.value===saved.sortBy)) sortBy.value = "D0";
      applyFiltersAndRender();
    } else {
      sortBy.value = "D0";
      sortDirAsc = false;
      applyFiltersAndRender();
    }
  }catch(err){
    errorEl.style.display = "block";
    errorEl.textContent = "Load error: " + err.message;
    summary.textContent = "Load error";
    console.error(err);
  }
}

/* Events */
filterRarity.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterType.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterMove.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterRange.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterObtain.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });

filterSeries.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterTag1.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterTag2.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });

sortBy.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });

prevPageBtn.addEventListener("click", ()=>{
  if(currentPage > 1){ currentPage--; saveUIState(); renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
});
nextPageBtn.addEventListener("click", ()=>{
  if(currentPage < totalPages){ currentPage++; saveUIState(); renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
});

resetBtn.addEventListener("click", ()=>{
  // clear multi-selects
  Array.from(filterRarity.options).forEach(o => o.selected = (o.value === ""));
  Array.from(filterType.options).forEach(o => o.selected = (o.value === ""));
  Array.from(filterMove.options).forEach(o => o.selected = (o.value === ""));
  Array.from(filterRange.options).forEach(o => o.selected = (o.value === ""));
  Array.from(filterObtain.options).forEach(o => o.selected = (o.value === ""));
  // clear single selects
  filterSeries.value = "";
  filterTag1.value = "";
  filterTag2.value = "";
  // reset sort and page
  sortBy.value = "D0";
  sortDirAsc = false;
  currentPage = 1;
  // clear saved state
  try { sessionStorage.removeItem(STORAGE_KEY); } catch(e){}
  applyFiltersAndRender();
});

/* Save state before navigating away via card links */
grid.addEventListener("click", function(e){
  let el = e.target;
  while(el && el !== grid) {
    if(el.tagName && el.tagName.toLowerCase() === "a" && el.classList.contains("card")) {
      saveUIState();
      return;
    }
    el = el.parentElement;
  }
});

/* Save on beforeunload */
window.addEventListener("beforeunload", function(){
  saveUIState();
});

/* initial load */
init();
</script>
</body>
</html>
