<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gジェネ検索 — ユニット一覧</title>
<style>
  :root{
    --gap:10px;
    --thumb:60px;
    --card-w:90px;
    --accent:#2b6cb0;
    --muted:#666;
    --meta-red:#b22222;
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Arial;
  }

  /* ページ全体 */
  html,body{height:100%;margin:0}
  body{color:#111;background:#fff;padding:0 16px 16px}
  header{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin:0;
    padding:12px 0;
    background:#fff;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:20;
  }
  h1{margin:0;font-size:18px}

  /* フィルター / コントロール */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filters select,.filters input{padding:6px;border:1px solid #ddd;border-radius:6px;background:#fff}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* メイン領域をスクロール可能に */
  main{
    max-height: calc(100vh - 88px);
    overflow:auto;
    padding-top:12px;
  }

  /* グリッド */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:var(--gap)}
  a.card{
    border:1px solid #eee;
    border-radius:8px;
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:#fff;
    position:relative;
    overflow:visible;
    text-decoration:none;
    color:inherit;
    min-width:var(--card-w);
    max-width:var(--card-w);
    box-sizing:border-box;
  }
  a.card, a.card * { text-decoration: none !important; }

  /* アイコン領域（画像の外側・上部） */
  .icon-area{
    position:static;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:100%;
    pointer-events:none;
    margin:0;
  }
  .icon-top{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    padding:0 6px;
    box-sizing:border-box;
  }
  .icon-circle{
    min-width:20px;
    height:20px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:700;
    font-size:11px;
    box-shadow:0 1px 2px rgba(0,0,0,0.12);
    padding:0 6px;
  }
  .icon-circle.dim{ opacity:0.45; }

  .rare-row{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .rare-badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:10px;
    color:#fff;
    font-weight:700;
    font-size:11px;
    white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,0.12);
  }

  /* 画像領域 */
  .thumb-wrap{
    width:var(--thumb);
    height:var(--thumb);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:0;
  }
  .thumb{
    width:var(--thumb);
    height:var(--thumb);
    object-fit:cover;
    border-radius:4px;
    border:1px solid #ddd;
    display:block;
  }

  /* テキスト */
  .name{font-size:12px;text-align:center;line-height:1.2;margin:0}
  .meta{font-size:12px;color:#000;font-weight:800;margin:0;min-height:1.2em}
  /* 数字だけを強調するスタイル */
  .meta-number{
    color:var(--meta-red);
    font-weight:900;
    font-size:14px;
    line-height:1;
  }

  .count{margin-top:8px;color:var(--muted);font-size:13px}
  .small{font-size:12px;color:#444}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  footer{margin-top:18px;color:var(--muted);font-size:13px}

  /* --- レアラベル用クラス（一覧用） --- */
  .rarity-ur3 { background: linear-gradient(90deg,#e6d9ff 0%,#ffd9e6 18%,#e9dbff 36%,#e8f7d9 56%,#d9f7fb 76%,#cfeaff 100%); color:#1a1a1a; font-weight:450; border-radius:6px; padding:3px 6px; display:inline-block; font-size:11px; }
  .rarity-ur0 { background: linear-gradient(90deg,#f3efff 0%,#fff3f6 18%,#f6efff 36%,#f6fbef 56%,#eefbfd 76%,#eef7ff 100%); color:#000000; font-weight:100; border-radius:6px; padding:3px 6px; display:inline-block; font-size:11px; }
  .rarity-ssr-ssp { background: linear-gradient(90deg,#ff8a33 0%,#ff9f4d 25%,#ffc24f 55%,#ffe27a 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:450; display:inline-block; font-size:11px; }
  .rarity-ssr-sp { background: linear-gradient(90deg,#ffd8b4 0%,#ffe0c2 25%,#ffecb3 55%,#fff7d5 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:100; display:inline-block; font-size:11px; }

  @media (max-width:520px){
    header{flex-direction:column;align-items:stretch}
    .controls{margin-left:0}
    .icon-circle{min-width:18px;height:18px;font-size:10px;padding:0 4px}
    .rare-badge{padding:3px 6px;font-size:10px}
    main{max-height: calc(100vh - 160px)}
  }
</style>
</head>
<body>
<header>
  <h1>ユニット一覧</h1>

  <div class="filters" aria-label="フィルター">
    <label><span class="small">レア</span><br/><select id="filter-rarity"><option value="">全て</option></select></label>
    <label><span class="small">タイプ</span><br/><select id="filter-type"><option value="">全て</option></select></label>
    <label><span class="small">移動力</span><br/><select id="filter-move"><option value="">全て</option></select></label>
    <label><span class="small">最大射程</span><br/><select id="filter-range"><option value="">全て</option></select></label>
    <label><span class="small">入手</span><br/><select id="filter-obtain"><option value="">全て</option></select></label>

    <!-- 変更: 3つのリスト（Series / Tag1 / Tag2） -->
    <label><span class="small">Series</span><br/><select id="filter-series"><option value="">全て</option></select></label>
    <label><span class="small">Tag1</span><br/><select id="filter-tag1"><option value="">全て</option></select></label>
    <label><span class="small">Tag2</span><br/><select id="filter-tag2"><option value="">全て</option></select></label>
  </div>

  <div class="controls">
    <label class="small">並べ替え</label>
    <select id="sort-by" class="btn"></select>
    <button id="sort-dir" class="btn">昇順</button>
    <button id="reload" class="btn">データ再読み込み</button>
    <button id="reset" class="btn">リセット</button>
  </div>
</header>

<main>
  <div id="summary" class="count">読み込み中...</div>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="empty" class="empty" style="display:none">該当するユニットが見つかりません。</div>
  <div id="error" style="color:#b33;margin-top:12px;display:none"></div>
</main>

<footer>
  <div>データ: GitHub JSON を参照</div>
</footer>

<script>
/* ===== 設定 ===== */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = () => `${JSON_BASE_URL}/units.json`;
const COMBI_FIELD_MAP_JSON = () => `${JSON_BASE_URL}/combi_field_map.json`;
const SERIES_TAG_JSON = () => `${JSON_BASE_URL}/series_tag_options.json`;

/* 並べ替えラベル */
const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage-full active",
  "CD": "Critical Damage (full active)",
  "HB0": "耐久回数ビーム",
  "HB1": "耐久回数物理",
  "HB2": "耐久回数特殊",
  "HB3": "耐久回数EX",
  "HB0_F": "耐久回数ビーム (full)",
  "HB1_F": "耐久回数物理 (full)",
  "HB2_F": "耐久回数特殊 (full)",
  "HB3_F": "耐久回数EX (full)"
};

let units = [], fieldMap = {}, seriesTagOptions = {};
const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const emptyEl = document.getElementById("empty");
const errorEl = document.getElementById("error");
const filterRarity = document.getElementById("filter-rarity");
const filterType = document.getElementById("filter-type");
const filterMove = document.getElementById("filter-move");
const filterRange = document.getElementById("filter-range");
const filterObtain = document.getElementById("filter-obtain");
const filterSeries = document.getElementById("filter-series");
const filterTag1 = document.getElementById("filter-tag1");
const filterTag2 = document.getElementById("filter-tag2");
const sortBy = document.getElementById("sort-by");
const sortDirBtn = document.getElementById("sort-dir");
const reloadBtn = document.getElementById("reload");
const resetBtn = document.getElementById("reset");

let sortDirAsc = true;

/* ===== ヘルパー ===== */
async function fetchJson(url, cacheBust=false){
  const u = cacheBust ? `${url}?v=${Date.now()}` : url;
  const res = await fetch(u);
  if(!res.ok) throw new Error(`Fetch failed: ${u} (${res.status})`);
  return res.json();
}

function uniqueValues(arr, key){
  const s = new Set();
  arr.forEach(x => {
    const v = (x[key] || "").toString().trim();
    if(v !== "") s.add(v);
  });
  return Array.from(s).sort((a,b)=> a.localeCompare(b, 'ja'));
}

function populateFilter(selectEl, values){
  selectEl.innerHTML = '<option value="">全て</option>';
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

function populateSortOptions(){
  sortBy.innerHTML = "";
  const optName = document.createElement("option");
  optName.value = "name";
  optName.textContent = "名前";
  sortBy.appendChild(optName);
  Object.keys(FIELD_LABELS).forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = FIELD_LABELS[k] + " (" + k + ")";
    sortBy.appendChild(opt);
  });
}

/* 数値 2-6 を不透明度に変換（移動力/射程の濃淡） */
function intensityFromValue(v){
  const n = Number(v) || 0;
  const clamped = Math.max(2, Math.min(6, n));
  return 0.35 + (clamped - 2) * ((1.0 - 0.35) / (6 - 2));
}

function rarityClassFromString(rare){
  if(!rare) return "";
  const s = String(rare).replace(/\s+/g,"").toUpperCase();
  if(s.indexOf("UR") !== -1 && s.indexOf("3") !== -1) return "rarity-ur3";
  if(s.indexOf("UR") !== -1 && (s.indexOf("0") !== -1 || s.indexOf("０") !== -1)) return "rarity-ur0";
  if(s.indexOf("SSR") !== -1 && s.indexOf("SSP") !== -1) return "rarity-ssr-ssp";
  if(s.indexOf("SSP") !== -1 || s.indexOf("SP") !== -1) return "rarity-ssr-sp";
  if(s.indexOf("SSR") !== -1) return "rarity-ssr-ssp";
  return "";
}

/* 値が数値か判定 */
function isNumericValue(v){
  if(v === undefined || v === null || v === "") return false;
  const n = Number(v);
  return Number.isFinite(n);
}

/* 数値フォーマット（HB系は小数第2位まで） */
function formatValueForDisplay(key, v){
  if(v === undefined || v === null || v === "") return "-";
  const n = Number(v);
  if(!Number.isFinite(n)) return String(v);
  if(/^HB/i.test(key)){
    return n.toFixed(2);
  }
  // 整数表示（四捨五入）
  return Math.round(n).toLocaleString('ja-JP');
}

/* カード描画（metaは選択項目の値のみを表示） */
function renderCard(u){
  const a = document.createElement("a");
  a.href = `detail.html?uid=${encodeURIComponent(u.uid)}`;
  a.className = "card";
  a.title = u["ユニット"] || u["ユニット識別"] || "unit";

  const iconArea = document.createElement("div");
  iconArea.className = "icon-area";

  const top = document.createElement("div");
  top.className = "icon-top";

  const moveVal = (u["移動力"] || "").toString();
  const left = document.createElement("div");
  left.className = "icon-circle" + (moveVal ? "" : " dim");
  left.style.background = `rgba(220,20,60,${intensityFromValue(moveVal)})`;
  left.textContent = "移" + (moveVal || "-");
  top.appendChild(left);

  const right = document.createElement("div");
  const rangeVal = (u["最大射程"] || "").toString();
  right.className = "icon-circle" + (rangeVal ? "" : " dim");
  right.style.background = `rgba(30,144,255,${intensityFromValue(rangeVal)})`;
  right.textContent = "射" + (rangeVal || "-");
  top.appendChild(right);

  iconArea.appendChild(top);

  const rareRow = document.createElement("div");
  rareRow.className = "rare-row";
  const rareBadge = document.createElement("div");
  const rare = (u["レア"] || "").toString();
  const rc = rarityClassFromString(rare);
  rareBadge.className = rc ? rc : "rare-badge";
  rareBadge.textContent = rare || "";
  rareRow.appendChild(rareBadge);
  iconArea.appendChild(rareRow);

  a.appendChild(iconArea);

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";
  const img = document.createElement("img");
  img.className = "thumb";
  img.src = u["画像リンク"] || "";
  img.alt = u["ユニット"] || "";
  img.loading = "lazy";
  wrap.appendChild(img);
  a.appendChild(wrap);

  const nm = document.createElement("div");
  nm.className = "name";
  nm.textContent = u["ユニット"] || ("ID:" + u.uid);
  a.appendChild(nm);

  const meta = document.createElement("div");
  meta.className = "meta";

  const key = sortBy.value || "D0";
  if(key === "name"){
    // 名前を表示（従来どおり）
    meta.textContent = u["ユニット"] || "";
  } else {
    const val = u[key];
    if(isNumericValue(val)){
      const formatted = formatValueForDisplay(key, val);
      const span = document.createElement("span");
      span.className = "meta-number";
      span.textContent = formatted;
      meta.innerHTML = "";
      meta.appendChild(span);
    } else if(val === undefined || val === null || val === ""){
      meta.textContent = "-";
    } else {
      // 数値でない場合はそのまま表示（ただし強調はしない）
      meta.textContent = String(val);
    }
  }

  a.appendChild(meta);

  return a;
}

/* シリーズ/タグ選択肢をセット */
function populateSeriesAndTags(){
  // series_unit -> Series select
  filterSeries.innerHTML = '<option value="">全て</option>';
  if(seriesTagOptions && Array.isArray(seriesTagOptions.series_unit)){
    seriesTagOptions.series_unit.forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      filterSeries.appendChild(opt);
    });
  }
  // tag_unit -> Tag1 / Tag2
  filterTag1.innerHTML = '<option value="">全て</option>';
  filterTag2.innerHTML = '<option value="">全て</option>';
  if(seriesTagOptions && Array.isArray(seriesTagOptions.tag_unit)){
    seriesTagOptions.tag_unit.forEach(v=>{
      const opt1 = document.createElement("option");
      opt1.value = v;
      opt1.textContent = v;
      filterTag1.appendChild(opt1);
      const opt2 = document.createElement("option");
      opt2.value = v;
      opt2.textContent = v;
      filterTag2.appendChild(opt2);
    });
  }
}

/* フィルタ適用と描画（AND条件: Series AND Tag1 AND Tag2） */
function applyFiltersAndRender(){
  const r = filterRarity.value;
  const t = filterType.value;
  const mv = filterMove.value;
  const rg = filterRange.value;
  const ob = filterObtain.value;
  const seriesVal = filterSeries.value;
  const tag1Val = filterTag1.value;
  const tag2Val = filterTag2.value;

  let list = units.slice();

  if(r) list = list.filter(u => (u["レア"]||"") === r);
  if(t) list = list.filter(u => (u["タイプ"]||"") === t);
  if(mv) list = list.filter(u => (u["移動力"]||"") === mv);
  if(rg) list = list.filter(u => (u["最大射程"]||"") === rg);
  if(ob) list = list.filter(u => (u["入手"]||"") === ob);

  // Series: ユニットの "シリーズ連結" フィールドをカンマで分割して完全一致で判定
  if(seriesVal){
    list = list.filter(u => {
      const s = (u["シリーズ連結"] || "").toString();
      if(!s) return false;
      return s.split(",").map(x=>x.trim()).some(x => x === seriesVal);
    });
  }

  // Tag1: ユニットの "タグ連結" フィールドをカンマで分割して完全一致で判定
  if(tag1Val){
    list = list.filter(u => {
      const s = (u["タグ連結"] || "").toString();
      if(!s) return false;
      return s.split(",").map(x=>x.trim()).some(x => x === tag1Val);
    });
  }

  // Tag2: 同様に AND 条件
  if(tag2Val){
    list = list.filter(u => {
      const s = (u["タグ連結"] || "").toString();
      if(!s) return false;
      return s.split(",").map(x=>x.trim()).some(x => x === tag2Val);
    });
  }

  const key = sortBy.value;
  list.sort((a,b)=>{
    if(key === "name"){
      const sa = (a["ユニット"]||"").toString();
      const sb = (b["ユニット"]||"").toString();
      return sortDirAsc ? sa.localeCompare(sb, 'ja') : sb.localeCompare(sa, 'ja');
    }
    const va = a[key], vb = b[key];
    const na = (va === undefined || va === null || va === "") ? null : Number(va);
    const nb = (vb === undefined || vb === null || vb === "") ? null : Number(vb);
    if(!isNaN(na) && !isNaN(nb)){
      return sortDirAsc ? na - nb : nb - na;
    }
    const sa = (va||"").toString();
    const sb = (vb||"").toString();
    return sortDirAsc ? sa.localeCompare(sb, 'ja') : sb.localeCompare(sa, 'ja');
  });

  grid.innerHTML = "";
  if(list.length === 0){
    emptyEl.style.display = "block";
  } else {
    emptyEl.style.display = "none";
    list.forEach(u => grid.appendChild(renderCard(u)));
  }
  summary.textContent = `表示 ${list.length} / 全 ${units.length} 件`;
}

/* 初期化 */
async function init(cacheBust=false){
  errorEl.style.display = "none";
  try{
    try{ fieldMap = await fetchJson(COMBI_FIELD_MAP_JSON(), cacheBust); }catch(e){ fieldMap = {}; }
    try{ seriesTagOptions = await fetchJson(SERIES_TAG_JSON(), cacheBust); }catch(e){ seriesTagOptions = {}; }

    units = await fetchJson(UNITS_JSON(), cacheBust);

    populateFilter(filterRarity, uniqueValues(units, "レア"));
    populateFilter(filterType, uniqueValues(units, "タイプ"));
    populateFilter(filterMove, uniqueValues(units, "移動力"));
    populateFilter(filterRange, uniqueValues(units, "最大射程"));
    populateFilter(filterObtain, uniqueValues(units, "入手"));

    populateSeriesAndTags();

    populateSortOptions();

    sortBy.value = "D0";
    sortDirAsc = false;
    sortDirBtn.textContent = sortDirAsc ? "昇順" : "降順";

    applyFiltersAndRender();
  }catch(err){
    errorEl.style.display = "block";
    errorEl.textContent = "読み込みエラー: " + err.message;
    summary.textContent = "読み込みエラー";
    console.error(err);
  }
}

/* イベント */
filterRarity.addEventListener("change", applyFiltersAndRender);
filterType.addEventListener("change", applyFiltersAndRender);
filterMove.addEventListener("change", applyFiltersAndRender);
filterRange.addEventListener("change", applyFiltersAndRender);
filterObtain.addEventListener("change", applyFiltersAndRender);
filterSeries.addEventListener("change", applyFiltersAndRender);
filterTag1.addEventListener("change", applyFiltersAndRender);
filterTag2.addEventListener("change", applyFiltersAndRender);
sortBy.addEventListener("change", applyFiltersAndRender);
sortDirBtn.addEventListener("click", ()=>{
  sortDirAsc = !sortDirAsc;
  sortDirBtn.textContent = sortDirAsc ? "昇順" : "降順";
  applyFiltersAndRender();
});
reloadBtn.addEventListener("click", ()=> init(true));
resetBtn.addEventListener("click", ()=>{
  filterRarity.value = ""; filterType.value = ""; filterMove.value = ""; filterRange.value = ""; filterObtain.value = "";
  filterSeries.value = ""; filterTag1.value = ""; filterTag2.value = "";
  sortBy.value = "D0"; sortDirAsc = false; sortDirBtn.textContent = "降順";
  applyFiltersAndRender();
});

/* 初回読み込み */
init();
</script>
</body>
</html>
