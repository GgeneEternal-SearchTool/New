<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Unit List</title>
<style>
  :root{
    --gap:10px;
    --thumb:60px;
    --card-w:90px;
    --accent:#2b6cb0;
    --muted:#666;
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Arial;
  }

  /* Page */
  body{margin:16px;color:#111;background:#fff}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
  h1{margin:0;font-size:18px}

  /* Filters / Controls */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filters select,.filters input{padding:6px;border:1px solid #ddd;border-radius:6px;background:#fff}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:var(--gap)}
  a.card{
    border:1px solid #eee;
    border-radius:8px;
    padding:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:#fff;
    position:relative;
    overflow:visible;
    text-decoration:none;
    color:inherit;
    min-width:var(--card-w);
    max-width:var(--card-w);
    box-sizing:border-box;
  }
  a.card, a.card * { text-decoration: none !important; }

  /* Icon area */
  .icon-area{position:static;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;pointer-events:none;margin:0}
  .icon-top{width:100%;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 6px;box-sizing:border-box}
  .icon-circle{min-width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,0.12);padding:0 6px}
  .icon-circle.dim{ opacity:0.45; }

  .rare-row{width:100%;display:flex;justify-content:center}
  .rare-badge{display:inline-block;padding:4px 8px;border-radius:10px;color:#fff;font-weight:700;font-size:11px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,0.12)}

  /* Image */
  .thumb-wrap{width:var(--thumb);height:var(--thumb);display:flex;align-items:center;justify-content:center;margin-top:0}
  .thumb{width:var(--thumb);height:var(--thumb);object-fit:cover;border-radius:4px;border:1px solid #ddd;display:block}

  /* Text */
  .name{font-size:12px;text-align:center;line-height:1.2;margin:0}
  .meta{font-size:12px;color:#000;font-weight:800;margin:0}

  .count{margin-top:8px;color:var(--muted);font-size:13px}
  .small{font-size:12px;color:#444}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  footer{margin-top:18px;color:var(--muted);font-size:13px}

  /* Pagination controls */
  .pager{
    display:flex;
    gap:8px;
    align-items:center;
    justify-content:center;
    margin:12px 0;
    flex-wrap:wrap;
  }
  .pager .page-input{width:56px;padding:6px;border-radius:6px;border:1px solid #ddd;text-align:center}
  .pager .info{font-size:13px;color:#444}

  /* Rarity classes (same as provided earlier) */
  .rarity-ur3 { background: linear-gradient(90deg,#e6d9ff 0%,#ffd9e6 18%,#e9dbff 36%,#e8f7d9 56%,#d9f7fb 76%,#cfeaff 100%); color:#1a1a1a;font-weight:450;border-radius:6px;padding:3px 6px;display:inline-block;font-size:11px; }
  .rarity-ur0 { background: linear-gradient(90deg,#f3efff 0%,#fff3f6 18%,#f6efff 36%,#f6fbef 56%,#eefbfd 76%,#eef7ff 100%); color:#000;font-weight:100;border-radius:6px;padding:3px 6px;display:inline-block;font-size:11px; }
  .rarity-ssr-ssp { background: linear-gradient(90deg,#ff8a33 0%,#ff9f4d 25%,#ffc24f 55%,#ffe27a 85%); color:#1a1a1a;border-radius:6px;padding:3px 6px;font-weight:450;display:inline-block;font-size:11px; }
  .rarity-ssr-sp { background: linear-gradient(90deg,#ffd8b4 0%,#ffe0c2 25%,#ffecb3 55%,#fff7d5 85%); color:#1a1a1a;border-radius:6px;padding:3px 6px;font-weight:100;display:inline-block;font-size:11px; }

  @media (max-width:520px){
    header{flex-direction:column;align-items:stretch}
    .controls{margin-left:0}
    .icon-circle{min-width:18px;height:18px;font-size:10px;padding:0 4px}
    .rare-badge{padding:3px 6px;font-size:10px}
  }
</style>
</head>
<body>
<header>
  <h1>Unit List</h1>

  <div class="filters" aria-label="filters">
    <label><span class="small">Rare</span><br/><select id="filter-rarity"><option value="">All</option></select></label>
    <label><span class="small">Type</span><br/><select id="filter-type"><option value="">All</option></select></label>
    <label><span class="small">Move</span><br/><select id="filter-move"><option value="">All</option></select></label>
    <label><span class="small">Range</span><br/><select id="filter-range"><option value="">All</option></select></label>
    <label><span class="small">Obtain</span><br/><select id="filter-obtain"><option value="">All</option></select></label>
  </div>

  <div class="controls">
    <label class="small">Sort by</label>
    <select id="sort-by" class="btn"></select>
    <button id="sort-dir" class="btn">Desc</button>
    <button id="reset" class="btn">Reset</button>
  </div>
</header>

<main>
  <div id="summary" class="count">loading...</div>

  <!-- Top pager -->
  <div id="pager-top" class="pager" aria-hidden="false">
    <button id="first-top" class="btn">First</button>
    <button id="prev-top" class="btn">Prev</button>
    <div class="info">Page <input id="page-input-top" class="page-input" type="number" min="1" value="1"> / <span id="page-count-top">1</span></div>
    <button id="next-top" class="btn">Next</button>
    <button id="last-top" class="btn">Last</button>
  </div>

  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="empty" class="empty" style="display:none">No units found.</div>
  <div id="error" style="color:#b33;margin-top:12px;display:none"></div>

  <!-- Bottom pager -->
  <div id="pager-bottom" class="pager" aria-hidden="false">
    <button id="first-bottom" class="btn">First</button>
    <button id="prev-bottom" class="btn">Prev</button>
    <div class="info">Page <input id="page-input-bottom" class="page-input" type="number" min="1" value="1"> / <span id="page-count-bottom">1</span></div>
    <button id="next-bottom" class="btn">Next</button>
    <button id="last-bottom" class="btn">Last</button>
  </div>
</main>

<footer>
  <div>Data: GitHub JSON</div>
</footer>

<script>
/* ===== Settings ===== */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = `${JSON_BASE_URL}/units.json`;
const PAGE_SIZE = 100;

/* ===== DOM ===== */
const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const emptyEl = document.getElementById("empty");
const errorEl = document.getElementById("error");

const filterRarity = document.getElementById("filter-rarity");
const filterType = document.getElementById("filter-type");
const filterMove = document.getElementById("filter-move");
const filterRange = document.getElementById("filter-range");
const filterObtain = document.getElementById("filter-obtain");
const sortBy = document.getElementById("sort-by");
const sortDirBtn = document.getElementById("sort-dir");
const resetBtn = document.getElementById("reset");

/* pager elements */
const firstTop = document.getElementById("first-top");
const prevTop = document.getElementById("prev-top");
const nextTop = document.getElementById("next-top");
const lastTop = document.getElementById("last-top");
const pageInputTop = document.getElementById("page-input-top");
const pageCountTop = document.getElementById("page-count-top");

const firstBottom = document.getElementById("first-bottom");
const prevBottom = document.getElementById("prev-bottom");
const nextBottom = document.getElementById("next-bottom");
const lastBottom = document.getElementById("last-bottom");
const pageInputBottom = document.getElementById("page-input-bottom");
const pageCountBottom = document.getElementById("page-count-bottom");

/* sort labels (same keys as units.json) */
const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage-full active",
  "CD": "Critical Damage (full active)",
  "HB0": "HB Beam",
  "HB1": "HB Physical",
  "HB2": "HB Special",
  "HB3": "HB EX",
  "HB0_F": "HB Beam (full)",
  "HB1_F": "HB Physical (full)",
  "HB2_F": "HB Special (full)",
  "HB3_F": "HB EX (full)"
};

/* state */
let units = [];
let filteredSorted = []; // after filter+sort
let currentPage = 1;
let pageCount = 1;
let sortDirAsc = false;

/* ===== Helpers ===== */
async function fetchJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Fetch failed: ${url} (${res.status})`);
  return res.json();
}
function uniqueValues(arr, key){
  const s = new Set();
  arr.forEach(x => {
    const v = (x[key] || "").toString().trim();
    if(v !== "") s.add(v);
  });
  return Array.from(s).sort((a,b)=> a.localeCompare(b, 'ja'));
}
function rarityClassFromString(rare){
  if(!rare) return "";
  const s = String(rare).replace(/\s+/g,"").toUpperCase();
  if(s.indexOf("UR") !== -1 && s.indexOf("3") !== -1) return "rarity-ur3";
  if(s.indexOf("UR") !== -1 && (s.indexOf("0") !== -1 || s.indexOf("０") !== -1)) return "rarity-ur0";
  if(s.indexOf("SSR") !== -1 && s.indexOf("SSP") !== -1) return "rarity-ssr-ssp";
  if(s.indexOf("SSP") !== -1 || s.indexOf("SP") !== -1) return "rarity-ssr-sp";
  if(s.indexOf("SSR") !== -1) return "rarity-ssr-ssp";
  return "";
}
function fmtNumber(n){
  if(n === undefined || n === null || n === "") return "-";
  const num = Number(n);
  if(isNaN(num)) return "-";
  return Math.round(num).toLocaleString('ja-JP');
}

/* render single card */
function renderCard(u){
  const a = document.createElement("a");
  a.href = `detail.html?uid=${encodeURIComponent(u.uid)}`;
  a.className = "card";
  a.title = u["ユニット"] || u["ユニット識別"] || "unit";

  const iconArea = document.createElement("div");
  iconArea.className = "icon-area";

  const top = document.createElement("div");
  top.className = "icon-top";

  const moveVal = (u["移動力"] || "").toString();
  const left = document.createElement("div");
  left.className = "icon-circle" + (moveVal ? "" : " dim");
  left.style.background = `rgba(220,20,60,${intensityFromValue(moveVal)})`;
  left.textContent = "M" + (moveVal || "-");
  top.appendChild(left);

  const right = document.createElement("div");
  const rangeVal = (u["最大射程"] || "").toString();
  right.className = "icon-circle" + (rangeVal ? "" : " dim");
  right.style.background = `rgba(30,144,255,${intensityFromValue(rangeVal)})`;
  right.textContent = "R" + (rangeVal || "-");
  top.appendChild(right);

  iconArea.appendChild(top);

  const rareRow = document.createElement("div");
  rareRow.className = "rare-row";
  const rareBadge = document.createElement("div");
  const rare = (u["レア"] || "").toString();
  const rc = rarityClassFromString(rare);
  rareBadge.className = rc ? rc : "rare-badge";
  rareBadge.textContent = rare || "";
  rareRow.appendChild(rareBadge);
  iconArea.appendChild(rareRow);

  a.appendChild(iconArea);

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";
  const img = document.createElement("img");
  img.className = "thumb";
  img.src = u["画像リンク"] || "";
  img.alt = u["ユニット"] || "";
  img.loading = "lazy";
  wrap.appendChild(img);
  a.appendChild(wrap);

  const nm = document.createElement("div");
  nm.className = "name";
  nm.textContent = u["ユニット"] || ("ID:" + u.uid);
  a.appendChild(nm);

  const meta = document.createElement("div");
  meta.className = "meta";
  const key = sortBy.value || "D0";
  if(key === "name"){
    meta.textContent = u["ユニット"] || "";
  } else {
    const val = u[key];
    if(val === undefined || val === null || val === ""){
      meta.textContent = (FIELD_LABELS[key] || key) + ": -";
    } else {
      const n = Number(val);
      if(!isNaN(n)){
        meta.textContent = (FIELD_LABELS[key] || key) + ": " + Math.round(n).toLocaleString('ja-JP');
      } else {
        meta.textContent = (FIELD_LABELS[key] || key) + ": " + String(val);
      }
    }
  }
  a.appendChild(meta);

  return a;
}

/* intensity helper for icon opacity */
function intensityFromValue(v){
  const n = Number(v) || 0;
  const clamped = Math.max(2, Math.min(6, n));
  return 0.35 + (clamped - 2) * ((1.0 - 0.35) / (6 - 2));
}

/* apply filters + sort, then paginate */
function applyFiltersAndSort(){
  const r = filterRarity.value;
  const t = filterType.value;
  const mv = filterMove.value;
  const rg = filterRange.value;
  const ob = filterObtain.value;
  let list = units.slice();

  if(r) list = list.filter(u => (u["レア"]||"") === r);
  if(t) list = list.filter(u => (u["タイプ"]||"") === t);
  if(mv) list = list.filter(u => (u["移動力"]||"") === mv);
  if(rg) list = list.filter(u => (u["最大射程"]||"") === rg);
  if(ob) list = list.filter(u => (u["入手"]||"") === ob);

  const key = sortBy.value;
  list.sort((a,b)=>{
    if(key === "name"){
      const sa = (a["ユニット"]||"").toString();
      const sb = (b["ユニット"]||"").toString();
      return sortDirAsc ? sa.localeCompare(sb, 'ja') : sb.localeCompare(sa, 'ja');
    }
    const va = a[key], vb = b[key];
    const na = (va === undefined || va === null || va === "") ? null : Number(va);
    const nb = (vb === undefined || vb === null || vb === "") ? null : Number(vb);
    if(!isNaN(na) && !isNaN(nb)){
      return sortDirAsc ? na - nb : nb - na;
    }
    const sa = (va||"").toString();
    const sb = (vb||"").toString();
    return sortDirAsc ? sa.localeCompare(sb, 'ja') : sb.localeCompare(sa, 'ja');
  });

  filteredSorted = list;
  pageCount = Math.max(1, Math.ceil(filteredSorted.length / PAGE_SIZE));
  if(currentPage > pageCount) currentPage = pageCount;
  updatePagerUI();
  renderCurrentPage();
}

/* render current page */
function renderCurrentPage(){
  grid.innerHTML = "";
  if(filteredSorted.length === 0){
    emptyEl.style.display = "block";
    summary.textContent = `Showing 0 / ${units.length}`;
    return;
  }
  emptyEl.style.display = "none";
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(filteredSorted.length, start + PAGE_SIZE);
  for(let i=start;i<end;i++){
    grid.appendChild(renderCard(filteredSorted[i]));
  }
  summary.textContent = `Showing ${start+1}-${end} / ${filteredSorted.length} (Total ${units.length})`;
}

/* pager UI sync */
function updatePagerUI(){
  pageCountTop.textContent = pageCount;
  pageCountBottom.textContent = pageCount;
  pageInputTop.value = currentPage;
  pageInputBottom.value = currentPage;
  // disable buttons appropriately
  const disablePrev = currentPage <= 1;
  const disableNext = currentPage >= pageCount;
  prevTop.disabled = prevBottom.disabled = disablePrev;
  firstTop.disabled = firstBottom.disabled = disablePrev;
  nextTop.disabled = nextBottom.disabled = disableNext;
  lastTop.disabled = lastBottom.disabled = disableNext;
}

/* pager actions */
function goToPage(n){
  const p = Math.max(1, Math.min(pageCount, Math.floor(n)));
  if(p === currentPage) return;
  currentPage = p;
  updatePagerUI();
  renderCurrentPage();
  // scroll to top of grid for convenience
  window.scrollTo({ top: grid.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
}

/* event wiring for pager (top & bottom) */
firstTop.addEventListener("click", ()=> goToPage(1));
prevTop.addEventListener("click", ()=> goToPage(currentPage - 1));
nextTop.addEventListener("click", ()=> goToPage(currentPage + 1));
lastTop.addEventListener("click", ()=> goToPage(pageCount));
pageInputTop.addEventListener("change", ()=> goToPage(Number(pageInputTop.value) || 1));

firstBottom.addEventListener("click", ()=> goToPage(1));
prevBottom.addEventListener("click", ()=> goToPage(currentPage - 1));
nextBottom.addEventListener("click", ()=> goToPage(currentPage + 1));
lastBottom.addEventListener("click", ()=> goToPage(pageCount));
pageInputBottom.addEventListener("change", ()=> goToPage(Number(pageInputBottom.value) || 1));

/* control events */
filterRarity.addEventListener("change", ()=> { currentPage = 1; applyFiltersAndSort(); });
filterType.addEventListener("change", ()=> { currentPage = 1; applyFiltersAndSort(); });
filterMove.addEventListener("change", ()=> { currentPage = 1; applyFiltersAndSort(); });
filterRange.addEventListener("change", ()=> { currentPage = 1; applyFiltersAndSort(); });
filterObtain.addEventListener("change", ()=> { currentPage = 1; applyFiltersAndSort(); });
sortBy.addEventListener("change", ()=> { currentPage = 1; applyFiltersAndSort(); });
sortDirBtn.addEventListener("click", ()=> { sortDirAsc = !sortDirAsc; sortDirBtn.textContent = sortDirAsc ? "Asc" : "Desc"; applyFiltersAndSort(); });
resetBtn.addEventListener("click", ()=>{
  filterRarity.value = ""; filterType.value = ""; filterMove.value = ""; filterRange.value = ""; filterObtain.value = "";
  sortBy.value = "D0"; sortDirAsc = false; sortDirBtn.textContent = "Desc";
  currentPage = 1;
  applyFiltersAndSort();
});

/* populate sort options */
function populateSortOptions(){
  sortBy.innerHTML = "";
  const optName = document.createElement("option");
  optName.value = "name";
  optName.textContent = "Name";
  sortBy.appendChild(optName);
  Object.keys(FIELD_LABELS).forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = FIELD_LABELS[k] + " (" + k + ")";
    sortBy.appendChild(opt);
  });
  sortBy.value = "D0";
}

/* init: only fetch units.json (no combi parts) */
async function init(){
  try{
    units = await fetchJson(UNITS_JSON);
    if(!Array.isArray(units)) units = [];
    populateFilter(filterRarity, uniqueValues(units, "レア"));
    populateFilter(filterType, uniqueValues(units, "タイプ"));
    populateFilter(filterMove, uniqueValues(units, "移動力"));
    populateFilter(filterRange, uniqueValues(units, "最大射程"));
    populateFilter(filterObtain, uniqueValues(units, "入手"));
    populateSortOptions();
    applyFiltersAndSort();
  }catch(err){
    console.error(err);
    errorEl.style.display = "block";
    errorEl.textContent = "Load error: " + err.message;
    summary.textContent = "Load error";
  }
}

/* initial run */
init();
</script>
</body>
</html>
