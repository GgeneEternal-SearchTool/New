<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Unit Search ユニット検索</title>
<style>
  :root{
    --gap:0;
    --thumb:60px;
    --card-w:80px;
    --accent:#2b6cb0;
    --muted:#666;
    --meta-red:#b22222;
    font-family: system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Arial;
  }

  html,body{height:100%;margin:0}
  body{color:#111;background:#fff;padding:16px}
  header.site-header{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:16px;
    align-items:stretch;
    margin:0 0 16px;
    padding:18px 20px 20px;
    color:#edf1e9;
    background-color:#202a2d;
    background-image:linear-gradient(rgba(220,232,224,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(220,232,224,.035) 1px,transparent 1px);
    background-size:24px 24px;
    border:1px solid #465356;
    border-top:4px solid #d9473f;
    position:static;
    z-index:10;
  }
  .header-masthead{display:flex;align-items:center;gap:12px;min-height:38px;padding-bottom:14px;border-bottom:1px solid #465356}
  .header-mark{position:relative;flex:0 0 34px;width:34px;height:34px;background:#d9473f}
  .header-mark::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.55);border-right:5px solid #e8c34b}
  .site-header h1{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:0;color:#f4f3e9;font-size:21px}
  .site-header h1 span{color:#9bc8c2;font-size:15px;font-weight:600}
  .header-section{display:grid;gap:10px;min-width:0}
  .section-heading{display:flex;align-items:center;gap:10px;margin:0;padding:8px 12px;border-left:5px solid #f0c84b;background:#ad3932;color:#fff;font-size:14px;font-weight:700;min-height:20px}
  .section-index{color:#ffe27a;font-family:monospace;font-size:12px;font-weight:800}
  #ability-heading,#controls-heading{background:#ad3932;border-left-color:#f0c84b}

  .site-header .filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px 12px;
    align-items:center;
    width:100%;
  }
  .site-header .filters select,.site-header .filters input{
    padding:7px 8px;border:1px solid #83908d;border-radius:3px;background:#f1f3ed;color:#172125;
    max-width:100%;
  }

  .site-header .filters label{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    flex:1 1 160px;
    color:#edf1e9;
    font-size:11px;
    margin:0;
    max-width:none;
  }
  .site-header .filters label select,.site-header .filters label input{width:100%}
  .site-header .filters .small,.site-header .controls .small{color:#c5d0ca}
  .filter-control{display:flex;flex:1 1 270px;min-width:220px;flex-direction:column;align-items:flex-start;gap:6px}
  .filter-title{color:#c5d0ca;font-size:13px;font-weight:700}
  .filter-choices{display:flex;flex-wrap:wrap;gap:6px;width:100%}
  .filter-choices .ability-filter{padding:7px 11px;font-size:13px}

  .filters-row-break{flex-basis:100%;height:0}
  .site-header .filters-fullrow{flex-basis:100%;width:100%;max-width:none;margin-top:4px}
  .site-header .filters-fullrow select{width:min(100%,360px)}

  .site-header .filters-inline{
    display:flex;
    gap:8px;
    align-items:flex-start;
    width:100%;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .site-header .filters-inline-item{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    flex:0 0 auto;
    min-width:160px;
    box-sizing:border-box;
  }

  .controls-section{padding-top:14px;border-top:1px solid #465356}
  .site-header .controls{margin-left:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .site-header .btn{padding:8px 12px;border-radius:3px;border:1px solid #83908d;background:#e7ebe4;color:#172125;cursor:pointer;font-weight:650}
  .site-header .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .site-header #sort-by{min-width:150px}
  .site-header .pager{display:flex;gap:6px;align-items:center;margin-left:0;padding:4px;border:1px solid #465356;background:rgba(9,16,18,.28)}
  .site-header .pager .page-info{padding:0 4px;font-size:12px;color:#edf1e9;white-space:nowrap}
  .site-header #reset{border-color:#e06a5d;background:#a93431;color:#fff}
  .ability-buttons{display:flex;flex-wrap:wrap;gap:7px;min-height:32px}
  .ability-filter{padding:6px 10px;border:1px solid #668185;border-radius:3px;background:#263a3e;color:#edf1e9;cursor:pointer;font-size:12px;font-weight:650}
  .ability-filter:hover{background:#34565a}
  .ability-filter[aria-pressed="true"]{border-color:#f0c84b;background:#f0c84b;color:#202a2d}

  main{min-height:60vh}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:var(--gap)}
  a.card{
    border:1px solid #eee;
    border-radius:6px;
    padding:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:#fff;
    position:relative;
    overflow:visible;
    text-decoration:none;
    color:inherit;
    min-width:var(--card-w);
    max-width:var(--card-w);
    box-sizing:border-box;
  }
  a.card, a.card * { text-decoration: none !important; }

  .icon-area{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;pointer-events:none;margin:0}
  .icon-top{width:100%;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 6px;box-sizing:border-box}
  .icon-circle{min-width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,0.12);padding:0 6px}
  .icon-circle.dim{ opacity:0.45; }

  .rare-row{width:100%;display:flex;justify-content:center}
  .rare-badge{display:inline-block;padding:4px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:10px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,0.12)}

  .thumb-wrap{width:var(--thumb);height:var(--thumb);display:flex;align-items:center;justify-content:center;margin-top:0}
  .thumb{width:var(--thumb);height:var(--thumb);object-fit:cover;border-radius:4px;border:1px solid #ddd;display:block}

  .name{font-size:12px;text-align:center;line-height:1.2;margin:0}
  .meta{font-size:12px;color:#000;font-weight:800;margin:0;min-height:1.2em}
  .meta-number{color:var(--meta-red);font-weight:900;font-size:14px;line-height:1}
  .card-abilities{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:100%}
  .ability-icon{display:inline-block;max-width:100%;padding:3px 4px;border:1px solid #79a8d7;border-radius:4px;background:linear-gradient(135deg,#1f4d82,#3678b5);box-shadow:0 1px 3px rgba(8,21,39,.32);color:#f1f5fb;font-size:11px;font-weight:650;line-height:1.2;text-align:center;overflow-wrap:anywhere}

  .count{margin-top:8px;color:var(--muted);font-size:13px}
  .sort-title{margin:3px 0 10px;color:var(--meta-red);font-size:20px;font-weight:900;line-height:1.25}
  .small{font-size:12px;color:#444}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  footer{margin-top:18px;color:var(--muted);font-size:13px}

  .rarity-ur3 { background: linear-gradient(90deg,#e6d9ff 0%,#ffd9e6 18%,#e9dbff 36%,#e8f7d9 56%,#d9f7fb 76%,#cfeaff 100%); color:#1a1a1a; font-weight:450; border-radius:6px; padding:3px 6px; display:inline-block; font-size:10px; }
  .rarity-ur0 { background: linear-gradient(90deg,#f3efff 0%,#fff3f6 18%,#f6efff 36%,#f6fbef 56%,#eefbfd 76%,#eef7ff 100%); color:#000000; font-weight:100; border-radius:6px; padding:3px 6px; display:inline-block; font-size:10px; }
  .rarity-ssr-ssp { background: linear-gradient(90deg,#ff8a33 0%,#ff9f4d 25%,#ffc24f 55%,#ffe27a 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:450; display:inline-block; font-size:10px; }
  .rarity-ssr-sp { background: linear-gradient(90deg,#ffd8b4 0%,#ffe0c2 25%,#ffecb3 55%,#fff7d5 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:100; display:inline-block; font-size:10px; }

  @media (max-width:520px){
    header.site-header{gap:14px;padding:16px 12px}
    .header-masthead{align-items:flex-start}
    .site-header h1{gap:4px 8px;font-size:19px}
    .site-header h1 span{font-size:14px}
    .site-header .controls{align-items:flex-start}
    .site-header .pager{margin-left:0}
    .icon-circle{min-width:16px;height:16px;font-size:10px;padding:0 4px}
    .rare-badge{padding:3px 6px;font-size:10px}
    /* 重要: 小画面でも Tag1/Tag2 を同一行に保つため、折り返し禁止を維持します */
    .filters-inline { flex-wrap: nowrap; overflow-x: auto; }
    .filters-inline-item { flex: 0 0 auto; min-width: 140px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-masthead">
    <span class="header-mark" aria-hidden="true"></span>
    <h1>Unit Search <span lang="ja">ユニット検索</span></h1>
  </div>

  <section class="header-section" aria-labelledby="filter-heading">
    <h2 class="section-heading" id="filter-heading"><span class="section-index" aria-hidden="true">01</span>基本フィルター</h2>
    <div class="filters" aria-label="基本フィルター">
    <div class="filter-control">
      <span class="filter-title">Rare</span>
      <div id="filter-rarity-buttons" class="filter-choices" role="group" aria-label="Rare"></div>
      <select id="filter-rarity" multiple hidden aria-hidden="true" tabindex="-1"><option value="">All</option></select>
    </div>

    <div class="filter-control">
      <span class="filter-title">Type</span>
      <div id="filter-type-buttons" class="filter-choices" role="group" aria-label="Type"></div>
      <select id="filter-type" multiple hidden aria-hidden="true" tabindex="-1"><option value="">All</option></select>
    </div>

    <div class="filter-control">
      <span class="filter-title">Move</span>
      <div id="filter-move-buttons" class="filter-choices" role="group" aria-label="Move"></div>
      <select id="filter-move" multiple hidden aria-hidden="true" tabindex="-1"><option value="">All</option></select>
    </div>

    <div class="filter-control">
      <span class="filter-title">Range</span>
      <div id="filter-range-buttons" class="filter-choices" role="group" aria-label="Range"></div>
      <select id="filter-range" multiple hidden aria-hidden="true" tabindex="-1"><option value="">All</option></select>
    </div>

    <div class="filter-control">
      <span class="filter-title">Obtain</span>
      <div id="filter-obtain-buttons" class="filter-choices" role="group" aria-label="Obtain"></div>
      <select id="filter-obtain" multiple hidden aria-hidden="true" tabindex="-1"><option value="">All</option></select>
    </div>

    <div class="filter-control">
      <span class="filter-title">Map兵器</span>
      <div id="filter-map-buttons" class="filter-choices" role="group" aria-label="Map兵器"></div>
      <select id="filter-map" hidden aria-hidden="true" tabindex="-1" title="Map兵器">
        <option value="">All</option>
        <option value="none">無</option>
        <option value="has">有</option>
        <option value="shape:扇形">扇形</option>
        <option value="shape:菱形">菱形</option>
        <option value="shape:長方形">長方形</option>
        <option value="shape:範囲">範囲</option>
        <option value="shape:移動">移動</option>
      </select>
    </div>


    
    <!-- force new line -->
    <div class="filters-row-break"></div>

    <!-- Series full row -->
    <label class="filters-fullrow"><span class="small">Series</span>
      <select id="filter-series" title="Series"><option value="">All</option></select>
    </label>

    <!-- force new line -->
    <div class="filters-row-break"></div>

    <!-- Tag1 and Tag2 inline -->
    <div class="filters-inline">
      <label class="filters-inline-item"><span class="small">Tag1</span>
        <select id="filter-tag1" title="Tag1"><option value="">All</option></select>
      </label>
      <label class="filters-inline-item"><span class="small">Tag2</span>
        <select id="filter-tag2" title="Tag2"><option value="">All</option></select>
      </label>
    </div>
    </div>
  </section>

  <section class="header-section ability-section" aria-labelledby="ability-heading">
    <h2 class="section-heading" id="ability-heading"><span class="section-index" aria-hidden="true">02</span>Ability アビリティ</h2>
    <div id="ability-filters" class="ability-buttons" role="group" aria-label="Ability"></div>
  </section>

  <section class="header-section controls-section" aria-labelledby="controls-heading">
    <h2 class="section-heading" id="controls-heading"><span class="section-index" aria-hidden="true">03</span>Damage・耐久回数の選択</h2>
    <div class="controls" aria-hidden="false">
      <label class="small">Sort by</label>
      <select id="sort-by" class="btn" title="Sort by"></select>

      <div class="pager" aria-label="Pagination controls">
        <button id="prev-page" class="btn" title="Previous page">Prev</button>
        <div class="page-info" id="page-info">Page 1</div>
        <button id="next-page" class="btn" title="Next page">Next</button>
      </div>

      <button id="reset" class="btn">Reset</button>
    </div>
  </section>
</header>

<main>
  <div id="summary" class="count">Loading...</div>
  <div id="sort-title" class="sort-title" aria-live="polite"></div>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="empty" class="empty" style="display:none">No matching units found.</div>
  <div id="error" style="color:#b33;margin-top:12px;display:none"></div>
</main>

<footer>
  <div>ジージェネエターナル検索ツール</div>
</footer>

<script>
/* ===== Settings ===== */
const JSON_BASE_URL = "./json-file";
const JSON_FALLBACK_BASE_URL = "../json-file";
const UNITS_JSON = () => `${JSON_BASE_URL}/units.json`;
const COMBI_FIELD_MAP_JSON = () => `${JSON_BASE_URL}/combi_field_map.json`;
const SERIES_TAG_JSON = () => `${JSON_BASE_URL}/series_tag_options.json`;

const PAGE_SIZE = 100;
const STORAGE_KEY = "unitListFilters_v1";

const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage-full active",
  "CD": "Critical Damage (full active)",
  "HB0": "耐久回数ビーム",
  "HB1": "耐久回数物理",
  "HB2": "耐久回数特殊",
  "HB3": "耐久回数EX",
  "HB0_F": "耐久回数ビーム (full)",
  "HB1_F": "耐久回数物理 (full)",
  "HB2_F": "耐久回数特殊 (full)",
  "HB3_F": "耐久回数EX (full)"
};

let units = [], fieldMap = {}, seriesTagOptions = {};
let abilityValues = [];
let selectedAbilities = new Set();
let currentPage = 1;
let totalPages = 1;
let currentFiltered = [];

const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const sortTitle = document.getElementById("sort-title");
const emptyEl = document.getElementById("empty");
const errorEl = document.getElementById("error");

const filterRarity = document.getElementById("filter-rarity");
const filterType = document.getElementById("filter-type");
const filterMove = document.getElementById("filter-move");
const filterRange = document.getElementById("filter-range");
const filterObtain = document.getElementById("filter-obtain");
const filterMap = document.getElementById("filter-map");
const filterSeries = document.getElementById("filter-series");
const filterTag1 = document.getElementById("filter-tag1");
const filterTag2 = document.getElementById("filter-tag2");
const abilityFilters = document.getElementById("ability-filters");
const filterButtonGroups = [
  { select: filterRarity, container: document.getElementById("filter-rarity-buttons"), multiple: true },
  { select: filterType, container: document.getElementById("filter-type-buttons"), multiple: true },
  { select: filterMove, container: document.getElementById("filter-move-buttons"), multiple: true },
  { select: filterRange, container: document.getElementById("filter-range-buttons"), multiple: true },
  { select: filterObtain, container: document.getElementById("filter-obtain-buttons"), multiple: true },
  { select: filterMap, container: document.getElementById("filter-map-buttons"), multiple: false }
];

const sortBy = document.getElementById("sort-by");
const prevPageBtn = document.getElementById("prev-page");
const nextPageBtn = document.getElementById("next-page");
const pageInfo = document.getElementById("page-info");
const resetBtn = document.getElementById("reset");

let sortDirAsc = false;

/* ===== Helpers ===== */
async function fetchJson(url, cacheBust=false){
  const fallbackUrl = url.startsWith(`${JSON_BASE_URL}/`)
    ? `${JSON_FALLBACK_BASE_URL}${url.slice(JSON_BASE_URL.length)}`
    : "";
  const urls = fallbackUrl ? [url, fallbackUrl] : [url];
  let lastError;
  for(const candidate of urls){
    const requestUrl = cacheBust ? `${candidate}?v=${Date.now()}` : candidate;
    try{
      const res = await fetch(requestUrl);
      if(!res.ok){
        lastError = new Error(`Fetch failed: ${requestUrl} (${res.status})`);
        continue;
      }
      return res.json();
    }catch(error){
      lastError = error;
    }
  }
  throw lastError;
}

function uniqueValues(arr, key){
  const s = new Set();
  arr.forEach(x => {
    const v = (x[key] || "").toString().trim();
    if(v !== "") s.add(v);
  });
  return Array.from(s).sort((a,b)=> a.localeCompare(b, 'ja'));
}

function getUnitAbilities(unit){
  const raw = (unit["_特徴"] || "").toString();
  return Array.from(new Set(raw.split("_").map(value => value.trim()).filter(Boolean)));
}

function populateMultiSelect(selectEl, values){
  selectEl.innerHTML = '';
  const allOpt = document.createElement("option");
  allOpt.value = "";
  allOpt.textContent = "All";
  selectEl.appendChild(allOpt);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

function updateFilterButtonStates(){
  filterButtonGroups.forEach(({select, container, multiple})=>{
    const selectedValues = new Set(getMultiSelectValues(select));
    Array.from(container.querySelectorAll(".filter-choice")).forEach(button=>{
      const value = button.dataset.value;
      const pressed = multiple ? (value === "" ? selectedValues.size === 0 : selectedValues.has(value)) : select.value === value;
      button.setAttribute("aria-pressed", String(pressed));
    });
  });
}

function populateFilterButtons(){
  filterButtonGroups.forEach(({select, container, multiple})=>{
    container.innerHTML = "";
    Array.from(select.options).forEach(option=>{
      const button = document.createElement("button");
      button.type = "button";
      button.className = "ability-filter filter-choice";
      button.dataset.value = option.value;
      button.textContent = option.textContent;
      button.addEventListener("click", ()=>{
        if(multiple){
          if(option.value === ""){
            Array.from(select.options).forEach(item=>{ item.selected = item.value === ""; });
          } else {
            option.selected = !option.selected;
            const hasSelection = Array.from(select.options).some(item=>item.value !== "" && item.selected);
            const allOption = Array.from(select.options).find(item=>item.value === "");
            if(allOption) allOption.selected = !hasSelection;
          }
        } else {
          select.value = option.value;
        }
        updateFilterButtonStates();
        currentPage = 1;
        applyFiltersAndRender();
      });
      container.appendChild(button);
    });
  });
  updateFilterButtonStates();
}

function populateSelect(selectEl, values){
  selectEl.innerHTML = '';
  const allOpt = document.createElement("option");
  allOpt.value = "";
  allOpt.textContent = "All";
  selectEl.appendChild(allOpt);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

function populateSortOptions(){
  sortBy.innerHTML = "";
  const optName = document.createElement("option");
  optName.value = "name";
  optName.textContent = "Name";
  sortBy.appendChild(optName);
  Object.keys(FIELD_LABELS).forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = FIELD_LABELS[k] + " (" + k + ")";
    sortBy.appendChild(opt);
  });
}

function updateAbilityButtons(){
  Array.from(abilityFilters.querySelectorAll(".ability-filter")).forEach(button => {
    button.setAttribute("aria-pressed", String(selectedAbilities.has(button.dataset.ability)));
  });
}

function populateAbilityButtons(){
  abilityValues = Array.from(new Set(units.flatMap(getUnitAbilities))).sort((a,b)=>a.localeCompare(b, 'ja'));
  abilityFilters.innerHTML = "";
  abilityValues.forEach(ability => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "ability-filter";
    button.dataset.ability = ability;
    button.textContent = ability;
    button.setAttribute("aria-pressed", "false");
    button.addEventListener("click", ()=>{
      if(selectedAbilities.has(ability)) selectedAbilities.delete(ability);
      else selectedAbilities.add(ability);
      updateAbilityButtons();
      currentPage = 1;
      applyFiltersAndRender();
    });
    abilityFilters.appendChild(button);
  });
}

function isNumericValue(v){
  if(v === undefined || v === null || v === "") return false;
  const n = Number(v);
  return Number.isFinite(n);
}

function formatValueForDisplay(key, v){
  if(v === undefined || v === null || v === "") return "-";
  const n = Number(v);
  if(!Number.isFinite(n)) return String(v);
  if(/^HB/i.test(key)){
    return n.toFixed(2);
  }
  return Math.round(n).toLocaleString('ja-JP');
}

function renderCard(u){
  const a = document.createElement("a");
  a.href = `detail.html?uid=${encodeURIComponent(u.uid)}`;
  a.className = "card";
  a.title = u["ユニット"] || u["ユニット識別"] || "unit";

  const iconArea = document.createElement("div");
  iconArea.className = "icon-area";

  const top = document.createElement("div");
  top.className = "icon-top";

  const moveVal = (u["移動力"] || "").toString();
  const left = document.createElement("div");
  left.className = "icon-circle" + (moveVal ? "" : " dim");
  left.style.background = `rgba(220,20,60,${0.35 + (Math.max(2, Math.min(6, Number(moveVal||2))) - 2) * ((1.0 - 0.35) / (6 - 2))})`;
  left.textContent = "M" + (moveVal || "-");
  top.appendChild(left);

  const right = document.createElement("div");
  const rangeVal = (u["最大射程"] || "").toString();
  right.className = "icon-circle" + (rangeVal ? "" : " dim");
  right.style.background = `rgba(30,144,255,${0.35 + (Math.max(2, Math.min(6, Number(rangeVal||2))) - 2) * ((1.0 - 0.35) / (6 - 2))})`;
  right.textContent = "R" + (rangeVal || "-");
  top.appendChild(right);

  iconArea.appendChild(top);

  const rareRow = document.createElement("div");
  rareRow.className = "rare-row";
  const rareBadge = document.createElement("div");
  const rare = (u["レア"] || "").toString();
  let rc = "";
  const s = String(rare).replace(/\s+/g,"").toUpperCase();
  if(s.indexOf("UR") !== -1 && s.indexOf("3") !== -1) rc = "rarity-ur3";
  else if(s.indexOf("UR") !== -1 && (s.indexOf("0") !== -1 || s.indexOf("０") !== -1)) rc = "rarity-ur0";
  else if(s.indexOf("SSR") !== -1 && s.indexOf("SSP") !== -1) rc = "rarity-ssr-ssp";
  else if(s.indexOf("SSP") !== -1 || s.indexOf("SP") !== -1) rc = "rarity-ssr-sp";
  else if(s.indexOf("SSR") !== -1) rc = "rarity-ssr-ssp";
  rareBadge.className = rc ? rc : "rare-badge";
  rareBadge.textContent = rare || "";
  rareRow.appendChild(rareBadge);
  iconArea.appendChild(rareRow);

  a.appendChild(iconArea);

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";
  const img = document.createElement("img");
  img.className = "thumb";
  img.src = u["画像リンク"] || "";
  img.alt = u["ユニット"] || "";
  img.loading = "lazy";
  wrap.appendChild(img);
  a.appendChild(wrap);

  const nm = document.createElement("div");
  nm.className = "name";
  nm.textContent = u["ユニット"] || ("ID:" + u.uid);
  a.appendChild(nm);

  const meta = document.createElement("div");
  meta.className = "meta";

  const key = sortBy.value || "D4";
  if(key === "name"){
    meta.textContent = u["ユニット"] || "";
  } else {
    const val = u[key];
    if(isNumericValue(val)){
      const formatted = formatValueForDisplay(key, val);
      const span = document.createElement("span");
      span.className = "meta-number";
      span.textContent = formatted;
      meta.innerHTML = "";
      meta.appendChild(span);
    } else if(val === undefined || val === null || val === ""){
      meta.textContent = "-";
    } else {
      meta.textContent = String(val);
    }
  }

  a.appendChild(meta);

  const abilities = getUnitAbilities(u);
  if(abilities.length > 0){
    const abilityRow = document.createElement("div");
    abilityRow.className = "card-abilities";
    abilityRow.setAttribute("aria-label", "Abilities");
    abilities.forEach(ability => {
      const badge = document.createElement("span");
      badge.className = "ability-icon";
      badge.textContent = ability;
      badge.title = ability;
      abilityRow.appendChild(badge);
    });
    a.appendChild(abilityRow);
  }

  return a;
}

/* ---------- Normalization helpers to handle half/full-width differences ---------- */
/* Use Unicode NFKC to normalize full-width punctuation to ASCII equivalents,
   convert full-width spaces to normal spaces, collapse whitespace, and trim. */
function normalizeStringForMatch(v){
  if(v === undefined || v === null) return "";
  // NFKC converts full-width punctuation and numbers to ASCII equivalents
  let s = String(v).normalize('NFKC');
  // convert full-width spaces to normal spaces (NFKC already does this, but keep safe)
  s = s.replace(/\u3000/g, ' ');
  // collapse whitespace and trim
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

/* Normalize array-like values (comma separated or array) and return normalized tokens */
function normalizeArrayLikeForMatch(v){
  if(v === undefined || v === null) return [];
  if(Array.isArray(v)) return v.map(x => normalizeStringForMatch(x)).filter(Boolean);
  // split on commas (both half and full width), semicolons, slashes, and vertical bars and Japanese delimiter '、'
  const parts = String(v).split(/[,，;；\/\\|、]/).map(s => normalizeStringForMatch(s)).filter(Boolean);
  return parts;
}

/* populate series/tag selects from series_tag_options.json */
function populateSeriesAndTags(){
  filterSeries.innerHTML = '<option value="">All</option>';
  filterTag1.innerHTML = '<option value="">All</option>';
  filterTag2.innerHTML = '<option value="">All</option>';
  if(seriesTagOptions && Array.isArray(seriesTagOptions.series_unit)){
    seriesTagOptions.series_unit.forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      filterSeries.appendChild(opt);
    });
  }
  if(seriesTagOptions && Array.isArray(seriesTagOptions.tag_unit)){
    seriesTagOptions.tag_unit.forEach(v=>{
      const opt1 = document.createElement("option");
      opt1.value = v;
      opt1.textContent = v;
      filterTag1.appendChild(opt1);
      const opt2 = document.createElement("option");
      opt2.value = v;
      opt2.textContent = v;
      filterTag2.appendChild(opt2);
    });
  }
}

/* get selected values from a multi-select (excluding the "All" empty option) */
function getMultiSelectValues(selectEl){
  const vals = Array.from(selectEl.selectedOptions).map(o => o.value).filter(v => v !== "");
  return vals;
}

/* Save/load UI state to sessionStorage */
function collectUIState() {
  return {
    rarities: getMultiSelectValues(filterRarity),
    types: getMultiSelectValues(filterType),
    moves: getMultiSelectValues(filterMove),
    ranges: getMultiSelectValues(filterRange),
    obtains: getMultiSelectValues(filterObtain),
    map: (filterMap && filterMap.value) ? filterMap.value : "",
    series: filterSeries.value || "",
    tag1: filterTag1.value || "",
    tag2: filterTag2.value || "",
    abilities: Array.from(selectedAbilities),
    sortBy: sortBy.value || "D4",
    sortDirAsc: !!sortDirAsc,
    page: currentPage || 1
  };
}
function saveUIState() {
  try {
    const st = collectUIState();
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(st));
  } catch (e) {
    console.warn("Could not save UI state:", e);
  }
}
function loadUIState(){
  try{
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

/* loadSavedUIState / applyUIState (compat helper names) */
function loadSavedUIState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn("Could not load saved UI state:", e);
    return null;
  }
}
function applyUIState(state) {
  if(!state) return;
  function setMulti(selectEl, values) {
    const vals = Array.isArray(values) ? values : [];
    Array.from(selectEl.options).forEach(opt => {
      if(opt.value === "") {
        opt.selected = vals.length === 0;
      } else {
        opt.selected = vals.includes(opt.value);
      }
    });
  }
  setMulti(filterRarity, state.rarities || []);
  setMulti(filterType, state.types || []);
  setMulti(filterMove, state.moves || []);
  setMulti(filterRange, state.ranges || []);
  setMulti(filterObtain, state.obtains || []);
  if(state.map !== undefined && filterMap) filterMap.value = state.map;
  updateFilterButtonStates();
  selectedAbilities = new Set(Array.isArray(state.abilities) ? state.abilities.filter(value => abilityValues.includes(value)) : []);
  updateAbilityButtons();
  if(state.series !== undefined) filterSeries.value = state.series;
  if(state.tag1 !== undefined) filterTag1.value = state.tag1;
  if(state.tag2 !== undefined) filterTag2.value = state.tag2;
  if(state.sortBy) sortBy.value = state.sortBy;
  sortDirAsc = !!state.sortDirAsc;
  currentPage = Math.max(1, Number(state.page || 1));
}

/* ---------- Filtering / rendering (normalized matching) ---------- */
function applyFiltersAndRender(){
  const rarities = getMultiSelectValues(filterRarity);
  const types = getMultiSelectValues(filterType);
  const moves = getMultiSelectValues(filterMove);
  const ranges = getMultiSelectValues(filterRange);
  const obtains = getMultiSelectValues(filterObtain);
  const seriesSel = filterSeries.value || "";
  const tag1Sel = filterTag1.value || "";
  const tag2Sel = filterTag2.value || "";
  const abilitySelections = Array.from(selectedAbilities);

  // normalized selected values for matching
  const normSeriesSel = normalizeStringForMatch(seriesSel);
  const normTag1Sel = normalizeStringForMatch(tag1Sel);
  const normTag2Sel = normalizeStringForMatch(tag2Sel);

  let list = units.slice();

  list = list.filter(u => {
    // basic filters (exact match on displayed strings)
    if(rarities.length > 0){
      const rv = (u["レア"] || "").toString();
      if(!rarities.includes(rv)) return false;
    }
    if(types.length > 0){
      const tv = (u["タイプ"] || u["機体タイプ"] || "").toString();
      if(!types.includes(tv)) return false;
    }
    if(moves.length > 0){
      const mv = (u["移動力"] || "").toString();
      if(!moves.includes(mv)) return false;
    }
    if(ranges.length > 0){
      const rv = (u["最大射程"] || "").toString();
      if(!ranges.includes(rv)) return false;
    }
    if(obtains.length > 0){
      const ov = (u["入手"] || "").toString();
      if(!obtains.includes(ov)) return false;
    }
    if(abilitySelections.length > 0){
      const unitAbilities = getUnitAbilities(u);
      if(!abilitySelections.some(ability => unitAbilities.includes(ability))) return false;
    }

    // series filter: compare normalized forms
    if(normSeriesSel){
      const seriesCandidates = u["シリーズ連結"] || u["シリーズ"] || u["Series"] || u["SeriesName"] || "";
      const unitSeries = normalizeArrayLikeForMatch(seriesCandidates);
      if(!unitSeries.some(s => s === normSeriesSel)) return false;
    }


    // Map兵器フィルタ: filterMap の値に応じて判定
    if(typeof filterMap !== "undefined" && filterMap){
      const mf = (filterMap.value || "").toString();
      if(mf !== ""){
        // MAP兵器Shape の候補キーを順にチェック（JSONのキー名に合わせて必要なら調整）
        const rawMapShape = (u["MAP兵器Shape"] || u["MAP兵器 Shape"] || u["MAP兵器"] || u["MAP兵器Shape "] || "").toString().trim();
        // normalize for matching (NFKC)
        const mapShapeNorm = normalizeStringForMatch(rawMapShape);

        if(mf === "none"){
          // 無: MAP兵器Shape が "0" または空
          if(!(mapShapeNorm === "" || mapShapeNorm === "0")) return false;
        } else if(mf === "has"){
          // 有: MAP兵器Shape が存在し "0" でない
          if(mapShapeNorm === "" || mapShapeNorm === "0") return false;
        } else if(mf.startsWith("shape:")){
          // 形状指定: 部分一致（正規化して部分一致）
          const key = mf.substring(6); // e.g., "扇形"
          if(!mapShapeNorm.includes(normalizeStringForMatch(key))) return false;
        }
      }
    }



    // tag filters: compare normalized forms and support multiple separators and full/half width
    if(normTag1Sel){
      const tagCandidates = u["タグ連結"] || u["タグ"] || u["Tag"] || u["TagName"] || "";
      const unitTags = normalizeArrayLikeForMatch(tagCandidates);
      if(!unitTags.some(t => t === normTag1Sel)) return false;
    }
    if(normTag2Sel){
      const tagCandidates = u["タグ連結"] || u["タグ"] || u["Tag"] || u["TagName"] || "";
      const unitTags = normalizeArrayLikeForMatch(tagCandidates);
      if(!unitTags.some(t => t === normTag2Sel)) return false;
    }

    return true;
  });

  // sorting
  const key = sortBy.value || "D4";
  if(key === "name"){
    list.sort((a,b)=>{
      const sa = (a["ユニット"] || "").toString();
      const sb = (b["ユニット"] || "").toString();
      return sortDirAsc ? sa.localeCompare(sb,'ja') : sb.localeCompare(sa,'ja');
    });
  } else {
    list.sort((a,b)=>{
      const va = (a[key] !== undefined && a[key] !== null) ? Number(a[key]) : null;
      const vb = (b[key] !== undefined && b[key] !== null) ? Number(b[key]) : null;
      const na = (va === null || isNaN(va)) ? -Infinity : va;
      const nb = (vb === null || isNaN(vb)) ? -Infinity : vb;
      return sortDirAsc ? na - nb : nb - na;
    });
  }

  currentFiltered = list;
  totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  renderPage();
  saveUIState();
}

function renderPage(){
  grid.innerHTML = "";
  const total = currentFiltered.length;
  summary.textContent = `該当 ${total} 件`;
  const selectedSort = sortBy.selectedOptions[0];
  sortTitle.textContent = selectedSort ? selectedSort.textContent : "";
  if(total === 0){
    emptyEl.style.display = "block";
    pageInfo.textContent = `Page 0 / 0`;
    prevPageBtn.disabled = true;
    nextPageBtn.disabled = true;
    return;
  } else {
    emptyEl.style.display = "none";
  }
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const pageItems = currentFiltered.slice(start, end);
  pageItems.forEach(u => {
    grid.appendChild(renderCard(u));
  });
  pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
  prevPageBtn.disabled = (currentPage <= 1);
  nextPageBtn.disabled = (currentPage >= totalPages);
}

/* ---------- Initialization ---------- */
async function init(){
  errorEl.style.display = "none";
  try{
    try{ fieldMap = await fetchJson(COMBI_FIELD_MAP_JSON(), true); }catch(e){ fieldMap = {}; }
    try{ seriesTagOptions = await fetchJson(SERIES_TAG_JSON(), true); }catch(e){ seriesTagOptions = {}; }

    units = await fetchJson(UNITS_JSON(), true);

    // populate basic selects from units (rarity/type/move/range/obtain)
    populateMultiSelect(filterRarity, uniqueValues(units, "レア"));
    populateMultiSelect(filterType, uniqueValues(units, "タイプ"));
    populateMultiSelect(filterMove, uniqueValues(units, "移動力"));
    populateMultiSelect(filterRange, uniqueValues(units, "最大射程"));
    populateMultiSelect(filterObtain, uniqueValues(units, "入手"));
    populateFilterButtons();
    populateAbilityButtons();

    populateSeriesAndTags();
    populateSortOptions();

    // restore UI state if present
    const st = loadSavedUIState();
    if(st){
      applyUIState(st);
      // ensure sortBy exists in options
      if(!Array.from(sortBy.options).some(o=>o.value===st.sortBy)) sortBy.value = "D4";
      applyFiltersAndRender();
    } else {
      sortBy.value = "D4";
      sortDirAsc = false;
      applyFiltersAndRender();
    }
  }catch(e){
    console.error(e);
    errorEl.style.display = "block";
    errorEl.textContent = "読み込みエラー: " + (e && e.message ? e.message : String(e));
  }
}

/* ---------- Events ---------- */
[filterRarity, filterType, filterMove, filterRange, filterObtain, filterMap].forEach(sel=>{
  sel.addEventListener("change", ()=>{
    currentPage = 1;
    applyFiltersAndRender();
  });
});

filterSeries.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterTag1.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
filterTag2.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });

sortBy.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });

prevPageBtn.addEventListener("click", ()=>{
  if(currentPage > 1){ currentPage--; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); saveUIState(); }
});
nextPageBtn.addEventListener("click", ()=>{
  if(currentPage < totalPages){ currentPage++; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); saveUIState(); }
});

resetBtn.addEventListener("click", ()=>{
  // clear multi-selects
  Array.from([filterRarity, filterType, filterMove, filterRange, filterObtain]).forEach(sel=>{
    Array.from(sel.options).forEach(opt => opt.selected = false);
    sel.value = "";
  });
  filterMap.value = "";
  updateFilterButtonStates();
  filterSeries.value = "";
  filterTag1.value = "";
  filterTag2.value = "";
  selectedAbilities.clear();
  updateAbilityButtons();
  sortBy.value = "D4";
  sortDirAsc = false;
  currentPage = 1;
  try { sessionStorage.removeItem(STORAGE_KEY); } catch(e){}
  applyFiltersAndRender();
});

/* keyboard shortcut: toggle sort direction (S) */
window.addEventListener("keydown", (ev)=>{
  if(ev.key === "s" || ev.key === "S"){
    sortDirAsc = !sortDirAsc;
    applyFiltersAndRender();
  }
});

/* Save state before navigating away via card links */
grid.addEventListener("click", function(e){
  let el = e.target;
  while(el && el !== grid) {
    if(el.tagName && el.tagName.toLowerCase() === "a" && el.classList.contains("card")) {
      saveUIState();
      return;
    }
    el = el.parentElement;
  }
});

/* Save on beforeunload */
window.addEventListener("beforeunload", saveUIState);

/* initial load */
init();
</script>
