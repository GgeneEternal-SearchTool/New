<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Detail</title>
<style>
  :root{
    --gap:10px;
    --thumb-large:120px;
    --pilot-thumb:56px;
    --muted:#666;
    --accent:#2b6cb0;
    --accent-strong:#1f6fb8;
    --navy:#0b3b66;
    --orange:#d97706;
    font-family: system-ui, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Segoe UI", Arial;
  }

  body{margin:16px;color:#111;background:#fff}
  .back{display:inline-block;margin-bottom:12px;color:var(--accent);text-decoration:none}

  /* unit-area */
  #unit-area{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
  .unit-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto}
  .unit-top-left{flex:0 0 35%;min-width:160px}
  .unit-top-right{flex:1 1 65%;min-width:220px;display:flex;flex-direction:column;gap:8px}

  .thumb{width:100%;height:auto;max-width:var(--thumb-large);object-fit:cover;border:1px solid #ddd;border-radius:6px}

  .unit-name{font-size:20px;font-weight:700}
  .unit-stats-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .rarity-badge{display:inline-block;padding:6px 10px;border-radius:10px;font-weight:700;font-size:12px;color:#fff}
  .stat-item{font-size:14px;color:#333}

  /* series/tag icons (unit-bottom top) */
  .series-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .series-tag-icon{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:12px;color:#fff;font-weight:700;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,0.12);gap:6px}
  .series-tag-icon.series{background: linear-gradient(90deg, #2563eb 0%, #3b82f6 50%, #93c5fd 100%); color:#fff;}
  .series-tag-icon.tag{
    background: linear-gradient(90deg, #3c5a03 0%, #049b0e 50%, #289b24 100%);
    color: #f4f4f4;
  }
  .feature-line{color:var(--orange);font-weight:800;font-size:15px}

  .unit-bottom{display:flex;flex-direction:column;gap:8px;border-top:1px solid #f0f0f0;padding-top:10px}
  .weapon-line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .weapon-power{font-size:13px;color:#333}
  .weapon-list{margin:0;padding-left:18px}
  .weapon-list li{font-size:13px;margin-bottom:4px}

  .map-row{display:flex;gap:12px;align-items:center;color:var(--navy);font-weight:700;white-space:nowrap;overflow-x:auto}
  .map-row .map-shape{font-size:18px;font-weight:800}

  .filters-area{margin-top:8px;border:1px solid #f0f0f0;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:10px}
  .filters-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .filter-block{display:flex;flex-direction:column;gap:6px}
  .filter-block label{font-size:12px;color:#666;font-weight:700}
  .filter-block select{min-width:120px;max-width:220px;padding:6px;border-radius:6px;border:1px solid #ccc;background:#fff}

  .toggles{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
  .btn.toggle{background:#fff}
  .btn.toggle.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Skill filter icons: 40x40 */
  .skill-icons{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .skill-icon{width:40px;height:40px;border-radius:6px;border:1px solid #ccc;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.9;object-fit:cover}
  .skill-icon.selected{outline:2px solid var(--accent);opacity:1}

  .sort-area{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--accent-strong)}
  .sort-area select{padding:6px;border-radius:6px;border:1px solid #ccc;background:#fff}

  #pilot-grid{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .pilot-card{border:1px solid #eee;padding:10px;border-radius:8px;display:flex;gap:12px;align-items:flex-start;background:#fff}

  /* image wrapper */
  .p-thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:var(--pilot-thumb);box-sizing:border-box}
  .p-thumb{width:100%;height:var(--pilot-thumb);object-fit:cover;border-radius:6px;border:1px solid #ddd;display:block;cursor:pointer}

  .p-info{font-size:13px;flex:1;display:flex;flex-direction:column}
  .p-top{display:grid;grid-template-columns:3fr 0.7fr 2.5fr 3.8fr;gap:8px;align-items:start}
  .col-1{min-width:0}
  .col-2{min-width:0;display:flex;flex-direction:column;align-items:center}
  .col-3{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .col-4{min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right}

  .p-name{font-weight:700;margin-bottom:6px}
  .p-dmg{color:#b33;font-weight:900;font-size:30px}
  .p-hb{color:#1e40af;font-weight:900;font-size:30px}

  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{background:#eee;padding:3px 6px;border-radius:8px;font-size:12px;color:#222;font-weight:700}
  .badge.pa{background:#2b6cb0;color:#fff}

  .two-action-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:6px 4px;
    border-radius:12px;
    background: linear-gradient(90deg,#ffb347,#ff7e00);
    color:#fff;
    font-weight:800;
    font-size:12px;
    box-sizing:border-box;
  }

  .combi-title{font-weight:800;margin-bottom:6px}
  .combi-line{margin:2px 0}
  .combi-percent{font-weight:900;font-size:18px;color:#111;margin-left:6px}

  .diag{font-size:12px;color:#999;margin-top:6px}

  .pager{display:flex;gap:8px;align-items:center;margin-top:10px}
  .page-info{font-size:13px;color:var(--muted)}

  @media (max-width:720px){
    .p-top{grid-template-columns:2.1fr 0.7fr 1.75fr 2.66fr}
    .p-dmg,.p-hb{font-size:18px}
  }
  @media (max-width:520px){
    .p-top{grid-template-columns:2.1fr 0.7fr 1.75fr 2.66fr}
    .p-dmg,.p-hb{font-size:16px}
  }
</style>
</head>
<body>
<a class="back" href="index.html">← Unit List</a>

      <div class="filter-block">
        <label for="filter-pilot-obtain">Obtain</label>
        <select id="filter-pilot-obtain"><option value="">All</option></select>
      </div>

      <div class="filter-block">
        <label for="filter-pilot-series">Pilot Series</label>
        <select id="filter-pilot-series"><option value="">All</option></select>
      </div>

      <div class="filter-block">
        <label for="filter-pilot-tag">Pilot Tag</label>
        <select id="filter-pilot-tag"><option value="">All</option></select>
      </div>
    </div>

    <div class="filters-row">
      <div style="font-weight:700">Ability</div>

      <div class="toggles">
        <!-- 追加: ２回行動ボタンを先頭に配置 -->
        <button id="toggle-twoaction" class="btn toggle">２回行動</button>
        <button id="toggle-pilot-ability" class="btn toggle">Pilot Ability Active</button>
        <button id="toggle-autoheal" class="btn toggle">自動回復</button>
        <button id="toggle-moveup" class="btn toggle">移動力UP</button>
        <button id="toggle-counterdef" class="btn toggle">反撃支援防御</button>
        <button id="toggle-forcecs" class="btn toggle">強制CS</button>
      </div>
    </div>

    <div class="filters-row">
      <div style="font-weight:700">Skill Filters</div>
      <div id="skill-filter-row" class="skill-icons" aria-hidden="false"></div>
    </div>

    <div class="filters-row">
      <div class="sort-area">
        <div style="font-weight:900;color:var(--accent-strong);margin-right:6px">並べ替え</div>
        <select id="pilot-sort" class="select"></select>
      </div>
      <button id="sort-dir" class="btn">降順</button>
    </div>
  </div>

  <div id="combi-summary" class="diag" aria-live="polite" style="margin-top:10px"></div>

  <div id="pilot-list-area">
    <div id="pilot-grid"></div>

    <div class="pager">
      <button id="prev-page" class="btn">Prev</button>
      <div class="page-info" id="page-info">Page 1</div>
      <button id="next-page" class="btn">Next</button>
    </div>

</main>

<script>
/* ===== Settings ===== */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = JSON_BASE_URL + "/units.json";
const PILOTS_JSON = JSON_BASE_URL + "/pilots.json";
const COMBI_PART_PREFIX = JSON_BASE_URL + "/combi_part_";
const COMBI_INDEX_JSON = JSON_BASE_URL + "/combi_index.json";
const SERIES_TAG_JSON = JSON_BASE_URL + "/series_tag_options.json";
const MAX_COMBI_PARTS_TO_CHECK = 200;
const MAX_CONSECUTIVE_MISSES = 5;
const PAGE_SIZE = 50;

const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage (full)",
  "CD": "Critical Damage",
  "HB0": "耐久回数ビーム",
  "HB1": "耐久回数物理",

  "HB2_F": "耐久回数特殊 (full)",
  "HB3_F": "耐久回数EX (full)",

};

/* skill icons map (user provided) */
const SKILL_ICONS = {
  "ENセーブ": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/a7/20/p/o0139014415681987764.png?caw=800",
  "ENチャージ": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/57/e6/p/o0142014615681987771.png?caw=800",
  "HPリペア": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/46/ad/p/o0139014015681987780.png?caw=800",
  "MPアップ": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/1b/b8/p/o0140014715681987760.png?caw=800",
  "MPアップ（範囲)": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/3c/74/p/o0140014115681994624.png?caw=800",
  "アタックバースト": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/74/c0/p/o0143014315681987747.png?caw=800",

  "アタックバースト (範囲)": "https://stat.ameba.jp/user_images/20251112/08/winterstory0820/14/df/j/o0145015715714714034.jpg",
  "フォースガード": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/f5/63/p/o0146014415681987781.png?caw=800",
  "レンジブースト": "https://stat.ameba.jp/user_images/20250925/05/winterstory0820/31/50/p/o0146016115682015322.png",
  "ロックオン": "https://stat.ameba.jp/user_images/20250925/05/winterstory0820/be/c7/p/o0142016115682015816.png",
  "命中率・回避率上昇": "https://stat.ameba.jp/user_images/20260124/17/winterstory0820/02/58/j/o0127013415744109737.jpg",
  "CS+1": "https://stat.ameba.jp/user_images/20251016/21/winterstory0820/45/e9/p/o0136013515697655665.png",
  "支援攻撃+1": "https://stat.ameba.jp/user_images/20251016/21/winterstory0820/75/01/p/o0137013815697655660.png",
  "支援防御+1": "https://stat.ameba.jp/user_images/20251016/21/winterstory0820/7f/e6/p/o0137013715697655662.png",
  "覚醒ブースト": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/3a/ed/p/o0139014315681987751.png",
  "射撃ブースト": "https://stat.ameba.jp/user_images/20251004/13/winterstory0820/66/97/j/o0145014515689195378.jpg?caw=800",
  "格闘ブースト": "https://stat.ameba.jp/user_images/20251001/19/winterstory0820/54/fd/p/o0149014615687591295.png",
  "EN弾数フリー": "https://stat.ameba.jp/user_images/20260207/08/winterstory0820/00/80/j/o0131013415748559744.jpg",
  "フォースガード (範囲)": "https://stat.ameba.jp/user_images/20260207/09/winterstory0820/a6/bf/j/o0127013715748575419.jpg"
};

/* ===== DOM ===== */
const unitThumb = document.getElementById("unit-thumb");
const unitName = document.getElementById("unit-name");
const unitRarity = document.getElementById("unit-rarity");
const unitMove = document.getElementById("unit-move");
const unitRange = document.getElementById("unit-range");
const unitObtain = document.getElementById("unit-obtain");
const unitShieldInline = document.getElementById("unit-shield-inline");
const unitFeature = document.getElementById("unit-feature");
const seriesTagsEl = document.getElementById("series-tags");
const weaponPower = document.getElementById("weapon-power");
const weaponRange = document.getElementById("weapon-range");
const weaponShape = document.getElementById("weapon-shape");
const weaponEffects = document.getElementById("weapon-effects");
const mapRow = document.getElementById("map-row");

const filterPilotRarity = document.getElementById("filter-pilot-rarity");
const filterPilotType = document.getElementById("filter-pilot-type");
const filterPilotObtain = document.getElementById("filter-pilot-obtain");
const filterPilotSeries = document.getElementById("filter-pilot-series");
const filterPilotTag = document.getElementById("filter-pilot-tag");

const toggleTwoAction = document.getElementById("toggle-twoaction");
const toggleAutoheal = document.getElementById("toggle-autoheal");
const toggleMoveup = document.getElementById("toggle-moveup");
const toggleCounterdef = document.getElementById("toggle-counterdef");
const toggleForcecs = document.getElementById("toggle-forcecs");
const togglePilotAbility = document.getElementById("toggle-pilot-ability");
const skillFilterRow = document.getElementById("skill-filter-row");

const pilotSort = document.getElementById("pilot-sort");
const sortDirBtn = document.getElementById("sort-dir");
const combiSummary = document.getElementById("combi-summary");

const pilotGrid = document.getElementById("pilot-grid");
const prevPageBtn = document.getElementById("prev-page");
const nextPageBtn = document.getElementById("next-page");
const pageInfo = document.getElementById("page-info");

const params = new URLSearchParams(location.search);
const uidParam = params.get("uid");

let units = [], pilots = [], combiRows = [], seriesTagOptions = {};
let currentUnit = null;
let sortKey = "D0";
let sortDesc = true;
let currentPage = 1;
let totalPages = 1;
let currentFiltered = [];

const selectedSkillFilters = new Set();

/* state storage key */
const DETAIL_STATE_KEY = "detail_state_v1";

/* ===== Helpers ===== */
async function fetchJson(url, opts){
  const res = await fetch(url, opts || {});
  if(!res.ok) throw new Error("Fetch failed: " + url + " (" + res.status + ")");
  return res.json();
}
function fmtDamage(v){
  if(v === null || v === undefined || v === "") return "-";
  const n = Number(v);
  if(isNaN(n)) return "-";
  return new Intl.NumberFormat('ja-JP').format(Math.round(n));
}
function rarityClassFromString(rare){
  if(!rare) return "";
  const s = String(rare).replace(/\s+/g,"").toUpperCase();
  if(s.indexOf("UR") !== -1 && s.indexOf("3") !== -1) return "rarity-ur3";
  if(s.indexOf("UR") !== -1 && (s.indexOf("0") !== -1 || s.indexOf("０") !== -1)) return "rarity-ur0";
  if(s.indexOf("SSR") !== -1 && s.indexOf("SSP") !== -1) return "rarity-ssr-ssp";
  if(s.indexOf("SSP") !== -1 || s.indexOf("SP") !== -1) return "rarity-ssr-sp";
  if(s.indexOf("SSR") !== -1) return "rarity-ssr-ssp";
  return "";
}

/* pidMap */
function buildPidMap(){
  const map = {};
  (pilots || []).forEach(p => {
    const candidates = [p.pid, p["pid"], p["Pilot.キャラ識別"], p["Pilot.キャラ"]];
    for(const c of candidates){
      if(c !== undefined && c !== null && c !== ""){
        map[Number(c)] = p;
        break;
      }
    }
  });
  return map;
}

/* detectCombiParts fallback (HEAD) */
async function detectCombiParts(){
  const parts = [];
  let consecutiveMisses = 0;
  for(let i=0;i<MAX_COMBI_PARTS_TO_CHECK;i++){
    const idx = String(i).padStart(2,"0");
    const url = `${COMBI_PART_PREFIX}${idx}.json`;
    try{
      const res = await fetch(url, { method: 'HEAD' });
      if(res.ok){
        parts.push(url);
        consecutiveMisses = 0;
      } else {
        consecutiveMisses++;
        if(consecutiveMisses >= MAX_CONSECUTIVE_MISSES) break;
      }
    }catch(e){
      consecutiveMisses++;
      if(consecutiveMisses >= MAX_CONSECUTIVE_MISSES) break;
    }
  }
  return parts;
}

/* combi_index handling (cached in sessionStorage) */
const COMBI_INDEX_CACHE_KEY = "combi_index_v1";
function loadCachedCombiIndex(){
  try{
    const raw = sessionStorage.getItem(COMBI_INDEX_CACHE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveCachedCombiIndex(idx){
  try{ sessionStorage.setItem(COMBI_INDEX_CACHE_KEY, JSON.stringify(idx)); }catch(e){}
}
async function fetchCombiIndexFromServer(){
  try{
    const idx = await fetchJson(COMBI_INDEX_JSON);
    saveCachedCombiIndex(idx);
    return idx;
  }catch(e){
    console.warn("Could not fetch combi_index.json:", e);
    return null;
  }
}

async function getPartsForUnit(uid){
  const uidStr = String(Number(uid));
  let idx = loadCachedCombiIndex();
  if(idx && idx[uidStr] && idx[uidStr].length > 0){
    return idx[uidStr].map(fn => `${JSON_BASE_URL}/${fn}`);
  }
  idx = await fetchCombiIndexFromServer();
  if(idx && idx[uidStr] && idx[uidStr].length > 0){
    return idx[uidStr].map(fn => `${JSON_BASE_URL}/${fn}`);
  }
  return [];
}

/* normalize combi row (C14 included) */
function normalizeCombiRow(r){
  const nr = Object.assign({}, r);
  nr.p = (nr.p !== undefined && nr.p !== null && nr.p !== "") ? Number(nr.p) : null;
  nr.pilot_name = nr.pilot_name || nr["Pilot.キャラ"] || "";
  nr.D0 = (nr.D0 !== undefined && nr.D0 !== null && nr.D0 !== "") ? Number(nr.D0) : null;
  nr.D4 = (nr.D4 !== undefined && nr.D4 !== null && nr.D4 !== "") ? Number(nr.D4) : null;
  nr.CD = (nr.CD !== undefined && nr.CD !== null && nr.CD !== "") ? Number(nr.CD) : null;
  nr.HB0 = (nr.HB0 !== undefined && nr.HB0 !== null && nr.HB0 !== "") ? Number(nr.HB0) : null;
  nr.HB1 = (nr.HB1 !== undefined && nr.HB1 !== null && nr.HB1 !== "") ? Number(nr.HB1) : null;
  nr.HB2 = (nr.HB2 !== undefined && nr.HB2 !== null && nr.HB2 !== "") ? Number(nr.HB2) : null;
  nr.HB3 = (nr.HB3 !== undefined && nr.HB3 !== null && nr.HB3 !== "") ? Number(nr.HB3) : null;
  nr.HB0_F = (nr.HB0_F !== undefined && nr.HB0_F !== null && nr.HB0_F !== "") ? Number(nr.HB0_F) : null;
  nr.HB1_F = (nr.HB1_F !== undefined && nr.HB1_F !== null && nr.HB1_F !== "") ? Number(nr.HB1_F) : null;
  nr.HB2_F = (nr.HB2_F !== undefined && nr.HB2_F !== null && nr.HB2_F !== "") ? Number(nr.HB2_F) : null;
  nr.HB3_F = (nr.HB3_F !== undefined && nr.HB3_F !== null && nr.HB3_F !== "") ? Number(nr.HB3_F) : null;
  for(const ck of ["C01","C02","C03","C06","C07","C08","C09","C10","C11","C12","C13"]){
    if(nr[ck] !== undefined && nr[ck] !== null && nr[ck] !== ""){
      nr[ck] = Number(nr[ck]);
    } else {
      nr[ck] = 0;
    }
  }
  // include C14 as-is (some parts use "Y")
  nr.C14_raw = (r["C14"] !== undefined && r["C14"] !== null) ? r["C14"] : (r.C14 !== undefined ? r.C14 : "");
  nr.C14_flag = (function(v){
    if(v === undefined || v === null) return false;
    const s = String(v).trim();
    if(s === "") return false;
    if(s.toUpperCase() === "Y") return true;
    if(s.toLowerCase() === "true") return true;
    if(!isNaN(Number(s)) && Number(s) === 1) return true;
    return false;
  })(nr.C14_raw);
  nr.t2 = (nr.t2 !== undefined && nr.t2 !== null) ? Number(nr.t2) : 0;

  // common display fields that may exist in combi JSON (P0,P4,PT0,PT4,DR0,DR4,DFB4,DFP4,DFT4,DFE4)
  nr.P0 = (r.P0 !== undefined) ? Number(r.P0) : (r["P0"] !== undefined ? Number(r["P0"]) : null);
  nr.P4 = (r.P4 !== undefined) ? Number(r.P4) : (r["P4"] !== undefined ? Number(r["P4"]) : null);
  nr.PT0 = (r.PT0 !== undefined) ? r.PT0 : (r["PT0"] !== undefined ? r["PT0"] : "");
  nr.PT4 = (r.PT4 !== undefined) ? r.PT4 : (r["PT4"] !== undefined ? r["PT4"] : "");
  nr.DR0 = (r.DR0 !== undefined) ? Number(r.DR0) : (r["DR0"] !== undefined ? Number(r["DR0"]) : null);
  nr.DR4 = (r.DR4 !== undefined) ? Number(r.DR4) : (r["DR4"] !== undefined ? Number(r["DR4"]) : null);
  nr.DFB4 = (r.DFB4 !== undefined) ? Number(r.DFB4) : (r["DFB4"] !== undefined ? Number(r["DFB4"]) : null);
  nr.DFP4 = (r.DFP4 !== undefined) ? Number(r.DFP4) : (r["DFP4"] !== undefined ? Number(r["DFP4"]) : null);
  nr.DFT4 = (r.DFT4 !== undefined) ? Number(r.DFT4) : (r["DFT4"] !== undefined ? Number(r["DFT4"]) : null);
  nr.DFE4 = (r.DFE4 !== undefined) ? Number(r.DFE4) : (r["DFE4"] !== undefined ? Number(r["DFE4"]) : null);

  return nr;
}

/* load combi rows for unit using index (pinpoint) */
async function loadCombiForUnit(uid){
  combiRows = [];
  combiSummary.textContent = "読み込み中";

  let partUrls = [];
  try{ partUrls = await getPartsForUnit(uid); }catch(e){ partUrls = []; }

  if(!partUrls || partUrls.length === 0){
    const allParts = await detectCombiParts();
    if(!allParts || allParts.length === 0){
      combiSummary.textContent = "データが見つかりません";
      return;
    }
    for(const url of allParts){
      try{
        const part = await fetchJson(url);
        for(const r of part){
          const ru = (r.u !== undefined && r.u !== null && r.u !== "") ? Number(r.u) : null;
          if(ru === uid){
            combiRows.push(normalizeCombiRow(r));
          }
        }
      }catch(e){
        console.warn("combi part load failed (fallback):", url, e);
      }
    }
    combiSummary.textContent = `該当 ${combiRows.length} 件 (fallback scan)`;
    return;
  }

  for(const url of partUrls){
    try{
      const part = await fetchJson(url);
      for(const r of part){
        const ru = (r.u !== undefined && r.u !== null && r.u !== "") ? Number(r.u) : null;
        if(ru === uid){
          combiRows.push(normalizeCombiRow(r));
        }
      }
    }catch(e){
      console.warn("combi part load failed:", url, e);
    }
  }

  combiSummary.textContent = `該当 ${combiRows.length} 件`;
}

/* ---------- series/tag rendering ---------- */
/* Normalize strings for comparison regardless of full-width/half-width differences.
   Uses Unicode NFKC to convert full-width ASCII and punctuation to compatibility form,
   trims and collapses spaces, and lowercases for case-insensitive compare.
*/
function normalizeForCompare(s){
  if(s === undefined || s === null) return "";
  try{
    let t = String(s).normalize('NFKC');
    t = t.replace(/・|･|·/g, ',');
    t = t.replace(/[：：]/g, ':');
    t = t.replace(/[、，]/g, ',');
    t = t.replace(/[（]/g, '(').replace(/[）]/g, ')');
    t = t.replace(/\s+/g, ' ').trim();
    return t.toLowerCase();
  }catch(e){
    return String(s).trim().toLowerCase();
  }
}

function normalizeArrayLike(v){
  if(v === undefined || v === null) return [];
  if(Array.isArray(v)) return v.map(x=>String(x).trim()).filter(Boolean);
  return String(v).split(",").map(s=>s.trim()).filter(Boolean);
}
function renderSeriesTagsForUnit(u){
  seriesTagsEl.innerHTML = "";
  if(!seriesTagOptions) return;

  const unitSeriesCandidates = ["シリーズ連結","シリーズ","Series","SeriesName","series","SeriesName"];
  const unitTagCandidates = ["タグ連結","タグ","Tag","TagName","tag","TagName"];

  let unitSeries = [];
  let unitTags = [];
  for(const k of unitSeriesCandidates){
    if(u[k] !== undefined && u[k] !== null && String(u[k]).trim() !== ""){
      unitSeries = normalizeArrayLike(u[k]);
      break;
    }
  }
  for(const k of unitTagCandidates){
    if(u[k] !== undefined && u[k] !== null && String(u[k]).trim() !== ""){
      unitTags = normalizeArrayLike(u[k]);
      break;
    }
  }
  if(unitSeries.length === 0){
    Object.keys(u).forEach(k=>{
      if(/シリーズ/i.test(k) && u[k]) unitSeries = normalizeArrayLike(u[k]);
    });
  }
  if(unitTags.length === 0){
    Object.keys(u).forEach(k=>{
      if(/タグ/i.test(k) && u[k]) unitTags = normalizeArrayLike(u[k]);
    });
  }

  const seriesList = Array.isArray(seriesTagOptions.series_unit) ? seriesTagOptions.series_unit : [];
  const tagList = Array.isArray(seriesTagOptions.tag_unit) ? seriesTagOptions.tag_unit : [];

  const normalizedUnitSeries = unitSeries.map(x => normalizeForCompare(x));
  const normalizedUnitTags = unitTags.map(x => normalizeForCompare(x));

  seriesList.forEach((label)=>{
    const nl = normalizeForCompare(label);
    if(normalizedUnitSeries.some(us => us === nl)){
      const d = document.createElement("div");
      d.className = "series-tag-icon series";
      d.textContent = label;
      seriesTagsEl.appendChild(d);
    } else {
      const parts = nl.split(',').map(p=>p.trim()).filter(Boolean);
      if(parts.length > 1 && parts.some(p => normalizedUnitSeries.includes(p))){
        const d = document.createElement("div");
        d.className = "series-tag-icon series";
        d.textContent = label;
        seriesTagsEl.appendChild(d);
      }
    }
  });

  tagList.forEach((label)=>{
    const nl = normalizeForCompare(label);
    if(normalizedUnitTags.some(ut => ut === nl)){
      const d = document.createElement("div");
      d.className = "series-tag-icon tag";
      d.textContent = label;
      seriesTagsEl.appendChild(d);
    } else {
      const parts = nl.split(',').map(p=>p.trim()).filter(Boolean);
      if(parts.length > 1 && parts.some(p => normalizedUnitTags.includes(p))){
        const d = document.createElement("div");
        d.className = "series-tag-icon tag";
        d.textContent = label;
        seriesTagsEl.appendChild(d);
      }
    }
  });
}

/* ---------- Skill utilities ---------- */
function extractPilotSkills(pilotObj){
  const skills = [];
  for(const k of Object.keys(pilotObj || {})){
    if(k.startsWith("Pilot.Sk.")){
      const val = pilotObj[k];
      if(val !== undefined && val !== null && String(val).trim() !== "" && Number(val) !== 0){
        const name = k.replace(/^Pilot\.Sk\.\s*/, "").trim();
        skills.push(name);
      }
    }
  }
  return skills;
}

  });

}

function getSelectValue(selectEl){
  return selectEl.value || "";
}

function applyFiltersAndRender(){
  const pidMap = buildPidMap();

  const rarity = getSelectValue(filterPilotRarity);
  const type = getSelectValue(filterPilotType);
  const obtain = getSelectValue(filterPilotObtain);
  const pSeries = getSelectValue(filterPilotSeries);
  const pTags = getSelectValue(filterPilotTag);

  const toggles = {
    twoAction: toggleTwoAction.classList.contains("active"),
    autoheal: toggleAutoheal.classList.contains("active"),
    moveup: toggleMoveup.classList.contains("active"),
    counterdef: toggleCounterdef.classList.contains("active"),
    forcecs: toggleForcecs.classList.contains("active"),
    pilotAbility: togglePilotAbility.classList.contains("active")
  };

  let list = combiRows.slice();

  list = list.filter(c => {
    const p = (c.p !== null && pidMap[c.p]) ? pidMap[c.p] : null;
    if(!p) return false;
    if(rarity && rarity !== "" && (p["Pilot.レア"]||"").toString() !== rarity) return false;
    if(type && type !== "" && (p["Pilot.タイプ"]||"").toString() !== type) return false;
    if(obtain && obtain !== "" && (p["Pilot.入手"]||"").toString() !== obtain) return false;

    if(pSeries && pSeries !== ""){
      const ps = (p["Pilot.シリーズ連結"]||p["Pilot.シリーズ"]||p["Pilot.Series"]||"").toString();
      if(!ps.split(",").map(x=>x.trim()).includes(pSeries)) return false;
    }
    if(pTags && pTags !== ""){
      const pt = (p["Pilot.タグ連結"]||p["Pilot.タグ"]||p["Pilot.Tag"]||"").toString();
      if(!pt.split(",").map(x=>x.trim()).includes(pTags)) return false;
    }

    if(toggles.autoheal && Number(p["Pilot.自動回復"]||0) === 0) return false;
    if(toggles.moveup && Number(p["Pilot.移動力UP"]||0) === 0) return false;
    if(toggles.counterdef && Number(p["Pilot.反撃支援防御"]||0) === 0) return false;
    if(toggles.forcecs && Number(p["Pilot.強制CS"]||0) === 0) return false;

    if(toggles.pilotAbility){
      const case1 = (c.C01 === 1 || c.C02 === 1 || c.C03 === 1 || c.C08 === 1);
      const case2 = (c.C06 === 1 && c.C07 === 1);
      if(!(case1 || case2)) return false;
    }

    // New: two-action filter (combi.C14_flag must be true)
    if(toggles.twoAction){
      if(!c.C14_flag) return false;
    }

    if(selectedSkillFilters.size > 0){
      const pilotSkills = extractPilotSkills(p);
      for(const sk of selectedSkillFilters){
        if(!pilotSkills.includes(sk)) return false;
      }
    }

    return true;
  });

  const key = pilotSort.value || "D0";
  sortKey = key;
  if(key === "name"){
    list.sort((a,b)=>{
      const sa = ((pidMap[a.p] && pidMap[a.p]["Pilot.キャラ"]) || a.pilot_name || "").toString();
      const sb = ((pidMap[b.p] && pidMap[b.p]["Pilot.キャラ"]) || b.pilot_name || "").toString();
      return sortDesc ? sb.localeCompare(sa,'ja') : sa.localeCompare(sb,'ja');
    });
  } else {
    list.sort((a,b)=>{
      const va = (a[key] !== undefined && a[key] !== null) ? Number(a[key]) : null;
      const vb = (b[key] !== undefined && b[key] !== null) ? Number(b[key]) : null;
      const na = (va === null || isNaN(va)) ? -Infinity : va;
      const nb = (vb === null || isNaN(vb)) ? -Infinity : vb;
      return sortDesc ? nb - na : na - nb;
    });
  }

  currentFiltered = list;
  totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  renderPage();
}

/* ---------- State save/restore for back navigation ---------- */
function saveDetailState(){
  try{
    const state = {
      uid: currentUnit ? currentUnit.uid : null,
      currentPage,
      sortKey,
      sortDesc,
      selectedSkills: Array.from(selectedSkillFilters),
      filters: {
        rarity: filterPilotRarity.value || "",
        type: filterPilotType.value || "",
        obtain: filterPilotObtain.value || "",
        series: filterPilotSeries.value || "",
        tag: filterPilotTag.value || ""
      },
      toggles: {
        twoAction: toggleTwoAction.classList.contains("active"),
        autoheal: toggleAutoheal.classList.contains("active"),
        moveup: toggleMoveup.classList.contains("active"),
        counterdef: toggleCounterdef.classList.contains("active"),
        forcecs: toggleForcecs.classList.contains("active"),
        pilotAbility: togglePilotAbility.classList.contains("active")
      },
      scrollY: window.scrollY || 0
    };
    sessionStorage.setItem(DETAIL_STATE_KEY, JSON.stringify(state));
  }catch(e){
    // ignore
  }
}

function restoreDetailState(){
  try{
    const raw = sessionStorage.getItem(DETAIL_STATE_KEY);
    if(!raw) return false;
    const state = JSON.parse(raw);
    if(!state) return false;
    if(state.uid !== null && currentUnit && String(state.uid) !== String(currentUnit.uid)) return false;

    currentPage = state.currentPage || 1;
    sortKey = state.sortKey || sortKey;
    sortDesc = (typeof state.sortDesc === "boolean") ? state.sortDesc : sortDesc;

    selectedSkillFilters.clear();
    if(Array.isArray(state.selectedSkills)){
      state.selectedSkills.forEach(s => selectedSkillFilters.add(s));
    }

    if(state.filters){
      filterPilotRarity.value = state.filters.rarity || "";
      filterPilotType.value = state.filters.type || "";
      filterPilotObtain.value = state.filters.obtain || "";
      filterPilotSeries.value = state.filters.series || "";
      filterPilotTag.value = state.filters.tag || "";
    }

    const setToggle = (btn, val) => {
      if(val) btn.classList.add("active"); else btn.classList.remove("active");
    };
    if(state.toggles){
      setToggle(toggleTwoAction, !!state.toggles.twoAction);
      setToggle(toggleAutoheal, !!state.toggles.autoheal);
      setToggle(toggleMoveup, !!state.toggles.moveup);
      setToggle(toggleCounterdef, !!state.toggles.counterdef);
      setToggle(toggleForcecs, !!state.toggles.forcecs);
      setToggle(togglePilotAbility, !!state.toggles.pilotAbility);
    }

    Array.from(skillFilterRow.children).forEach(img=>{
      const s = img.dataset.skill;
      if(selectedSkillFilters.has(s)) img.classList.add("selected"); else img.classList.remove("selected");
    });

    pilotSort.value = sortKey;
    sortDirBtn.textContent = sortDesc ? "降順" : "昇順";

    // apply filters and render (combiRows must be loaded before calling this)
    applyFiltersAndRender();

    const scrollY = state.scrollY || 0;
    setTimeout(()=>{ window.scrollTo({ top: scrollY, behavior: 'auto' }); }, 50);

    return true;
  }catch(e){
    return false;
  }
}

/* ---------- Initialization ---------- */
async function init(){
  try{
    const unitsData = await fetchJson(UNITS_JSON);
    units = unitsData || [];
    const pilotsData = await fetchJson(PILOTS_JSON);
    pilots = pilotsData || [];

    try{
      const sto = await fetchJson(SERIES_TAG_JSON);
      seriesTagOptions = sto || {};
    }catch(e){
      seriesTagOptions = {};
    }

    const uid = Number(uidParam);
    currentUnit = units.find(u => Number(u.uid) === uid);
    if(!currentUnit){
      // try to restore from sessionStorage if uidParam missing or unit not found
      const raw = sessionStorage.getItem(DETAIL_STATE_KEY);
      if(raw){
        try{
          const st = JSON.parse(raw);
          if(st && st.uid){
            const restored = units.find(u => Number(u.uid) === Number(st.uid));
            if(restored) currentUnit = restored;
          }
        }catch(e){}
      }
    }

    if(!currentUnit){
      unitName.textContent = "ユニットが見つかりません";
      combiSummary.textContent = "";
      return;
    }

    renderUnitInfo(currentUnit);
    renderSeriesTagsForUnit(currentUnit);

    populatePilotFilterOptions();
    populateSortOptions();
    renderSkillFilterIcons();

    // load combi rows first, then restore UI state (so filters have data to operate on)
    await loadCombiForUnit(currentUnit.uid);

    const restored = restoreDetailState();
    if(!restored){
      // defaults
      pilotSort.value = sortKey;
      sortDirBtn.textContent = sortDesc ? "降順" : "昇順";
      currentPage = 1;
      applyFiltersAndRender();
    }
  }catch(err){
    console.error(err);
    combiSummary.textContent = "読み込みエラー";
  }
}

/* ---------- render unit info ---------- */
function renderUnitInfo(u){
  unitThumb.src = u["画像リンク"] || "";
  unitName.textContent = u["ユニット"] || ("ID:" + u.uid);

  const rareText = u["レア"] || "";
  unitRarity.textContent = rareText;
  const rc = rarityClassFromString(rareText);
  unitRarity.className = "rarity-badge " + (rc || "");

  unitMove.textContent = `移動: ${u["移動力"] || "-"}`;
  unitRange.textContent = `最大射程: ${u["最大射程"] || "-"}`;
  unitObtain.textContent = `入手: ${u["入手"] || "-"}`;

  const shield = u["シールド防御"] || u["Shield"] || u["ShieldDef"];
  if(shield !== undefined && shield !== null && shield !== ""){
    const n = Number(shield);
    if(!isNaN(n)){
      unitShieldInline.textContent = `シールド防御: ${Math.round(n * 100)}%`;
    } else {
      unitShieldInline.textContent = "";
    }
  } else {
    unitShieldInline.textContent = "";
  }

  unitFeature.textContent = u["特徴"] || u["Feature"] || "";

  weaponPower.textContent = u["武装 Power"] !== undefined && u["武装 Power"] !== null && u["武装 Power"] !== "" ? `武装 Power: ${u["武装 Power"]}` : "";
  weaponRange.textContent = u["武装 Range"] !== undefined && u["武装 Range"] !== null && u["武装 Range"] !== "" ? `武装 Range: ${u["武装 Range"]}` : "";
  weaponShape.textContent = u["武装 Shape"] ? `Shape: ${u["武装 Shape"]}` : (u["武装Shape"] ? `Shape: ${u["武装Shape"]}` : "");

  const effectKeys = [
    ["武装 敵防御力減少","敵防御力減少"],
    ["武装 防御力減","敵防御力減少"],
    ["武装 ビーム被ダメ減","敵ビーム被ダメ減少"],
    ["武装 物理被ダメ減","敵物理被ダメ減少"],
    ["武装 特殊被ダメ減","敵特殊被ダメ減少"],
    ["武装 攻撃力減","敵攻撃力減少"],
    ["武装 物理Power減","敵物理Power減少"],
    ["武装 ビームPower減","敵ビームPower減少"],
    ["武装 特殊Power減","敵特殊Power減少"]
  ];
  weaponEffects.innerHTML = "";
  for(const [k,label] of effectKeys){
    const v = u[k];
    if(v !== undefined && v !== null && v !== "" && Number(v) !== 0){
      const li = document.createElement("li");
      li.textContent = `${label}: ${v}`;
      weaponEffects.appendChild(li);
    }
  }

  mapRow.innerHTML = "";
  const mapA = u["MAP兵器"] || u["Map兵器"] || u["MAP兵器"];
  const mapPower = u["MAP兵器　Power"] || u["MAP兵器 Power"] || u["MAP兵器Power"] || u["MAP兵器 Power"];
  const mapShape = u["MAP兵器Shape"] || u["MAP兵器 Shape"] || u["MAP兵器Shape"];
  const mapAVal = (mapA === undefined || mapA === null) ? "" : String(mapA).trim();
  if(mapAVal === "" || mapAVal === "0" || mapAVal === "false"){
    mapRow.style.display = "none";
  } else {
    mapRow.style.display = "flex";
    const m1 = document.createElement("div"); m1.textContent = `MAP兵器: ${mapA || "-"}`; mapRow.appendChild(m1);
    const m2 = document.createElement("div"); m2.textContent = `Power: ${mapPower || "-"}`; mapRow.appendChild(m2);
    const m3 = document.createElement("div"); m3.className = "map-shape"; m3.textContent = `${mapShape || "-"}`; mapRow.appendChild(m3);
  }
}

/* ---------- Events ---------- */
pilotSort.addEventListener("change", ()=>{
  sortKey = pilotSort.value || "D0";
  applyFiltersAndRender();
});
sortDirBtn.addEventListener("click", ()=>{
  sortDesc = !sortDesc;
  sortDirBtn.textContent = sortDesc ? "降順" : "昇順";
  applyFiltersAndRender();
});

[ toggleTwoAction, togglePilotAbility, toggleAutoheal, toggleMoveup, toggleCounterdef, toggleForcecs ].forEach(btn=>{
  btn.addEventListener("click", ()=>{
    btn.classList.toggle("active");
    currentPage = 1;
    applyFiltersAndRender();
  });
});

[ filterPilotRarity, filterPilotType, filterPilotObtain, filterPilotSeries, filterPilotTag ].forEach(sel=>{
  sel.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
});

prevPageBtn.addEventListener("click", ()=>{
  if(currentPage > 1){ currentPage--; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
});
nextPageBtn.addEventListener("click", ()=>{
  if(currentPage < totalPages){ currentPage++; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
});

/* Save state before unload/navigation */
window.addEventListener("beforeunload", ()=>{
  saveDetailState();
});

/* Restore state when page is shown (bfcache/back) or history navigation */
window.addEventListener("pageshow", (e) => {
  try {
    const raw = sessionStorage.getItem(DETAIL_STATE_KEY);
    if(raw && currentUnit){
      restoreDetailState();
    }
  } catch (err) {}
});
window.addEventListener("popstate", (e) => {
  try { restoreDetailState(); } catch(e){}
});

/* keyboard shortcut: toggle sort direction (S) */
window.addEventListener("keydown", (ev)=>{
  if(ev.key === "s" || ev.key === "S"){
    sortDesc = !sortDesc;
    applyFiltersAndRender();
  }
});

/* Save state before navigating away via pilot image click */
pilotGrid.addEventListener("click", function(e){
  let el = e.target;
  while(el && el !== pilotGrid) {
    if(el.tagName && el.tagName.toLowerCase() === "img" && el.classList.contains("p-thumb")) {
      saveDetailState();
      return;
    }
    el = el.parentElement;
  }
});

/* initial load */
init();
</script>
