<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ユニット詳細</title>
<style>
  :root{
    --gap:10px;
    --thumb-large:120px;
    --pilot-thumb:56px;
    --muted:#666;
    --accent:#2b6cb0;
    --accent-strong:#1f6fb8;
    --navy:#0b3b66;
    --orange:#d97706;
    font-family: system-ui, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Segoe UI", Arial;
  }

  body{margin:16px;color:#111;background:#fff}
  .back{display:inline-block;margin-bottom:12px;color:var(--accent);text-decoration:none}

  /* unit-area: two-row layout */
  #unit-area{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
  /* top row: keep left and right side-by-side even on small screens */
  .unit-top{
    display:flex;
    gap:12px;
    align-items:flex-start;
    flex-wrap:nowrap;            /* prevent wrapping */
    overflow-x:auto;             /* allow horizontal scroll if needed */
  }
  .unit-top-left{
    flex:0 0 35%;                /* left column fixed ratio */
    min-width:160px;             /* ensure image doesn't shrink too small */
  }
  .unit-top-right{
    flex:1 1 65%;
    min-width:220px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .thumb{width:100%;height:auto;max-width:var(--thumb-large);object-fit:cover;border:1px solid #ddd;border-radius:6px}

  .unit-name{font-size:20px;font-weight:700}

  .unit-stats-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .rarity-badge{display:inline-block;padding:6px 10px;border-radius:10px;font-weight:700;font-size:12px;color:#fff}
  .stat-item{font-size:14px;color:#333}

  .feature-line{color:var(--orange);font-weight:800;font-size:15px}

  /* bottom row: weapons and map info */
  .unit-bottom{display:flex;flex-direction:column;gap:8px;border-top:1px solid #f0f0f0;padding-top:10px}
  .weapons-row{
    display:grid;
    grid-template-columns: auto auto 1fr; /* left: icons, middle: power/range/shape, right: effects */
    gap:12px;
    align-items:start;
  }
  .weapon-icons{display:flex;gap:8px;align-items:center}
  .weapon-icon{width:28px;height:28px;border-radius:4px;background:#eee;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .weapon-icon.hidden{display:none}
  .weapon-power{font-size:13px;color:#333}
  .weapon-list{margin:0;padding-left:0;list-style:none}
  .weapon-list li{font-size:13px;margin-bottom:4px}

  /* map row: navy color, single-line layout */
  .map-row{
    display:flex;
    gap:12px;
    align-items:center;
    color:var(--navy);
    font-weight:700;
    white-space:nowrap;
    overflow-x:auto;
  }
  .map-row .map-shape{font-size:18px;font-weight:800} /* larger for Shape */

  /* filters area */
  .filters-area{margin-top:8px;border:1px solid #f0f0f0;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:10px}
  .filters-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .filter-block{display:flex;flex-direction:column;gap:6px}
  .filter-block label{font-size:12px;color:#666;font-weight:700}
  .filter-block select{
    min-width:40px;
    max-width:80px;   /* user requested max width 80 */
    padding:6px;border-radius:6px;border:1px solid #ccc;background:#fff;
  }

  /* toggles and skill icons */
  .toggles{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
  .btn.toggle{background:#fff}
  .btn.toggle.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .skill-icons{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .skill-icon{width:20px;height:20px;border-radius:4px;border:1px solid #ccc;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:0.6}
  .skill-icon.selected{outline:2px solid var(--accent);opacity:1}

  /* sort emphasized and left aligned */
  .sort-area{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--accent-strong)}
  .sort-area select{padding:6px;border-radius:6px;border:1px solid #ccc;background:#fff}

  /* pilot list: vertical single column */
  #pilot-grid{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .pilot-card{border:1px solid #eee;padding:10px;border-radius:8px;display:flex;gap:12px;align-items:flex-start;background:#fff}
  .p-thumb{width:var(--pilot-thumb);height:var(--pilot-thumb);object-fit:cover;border-radius:6px;border:1px solid #ddd}
  .p-info{font-size:13px;flex:1;display:flex;flex-direction:column}
  .p-top{display:flex;gap:8px;align-items:flex-start}
  /* enforce 3:1:6 ratio for left/center/right columns */
  .p-top > .col-left{flex:3 1 30%}
  .p-top > .col-center{flex:1 1 10%;display:flex;flex-direction:column;gap:6px;align-items:center}
  .p-top > .col-right{flex:6 1 60%; text-align:right}
  .p-name{font-weight:700}
  .p-dmg{color:#b33;font-weight:700;font-size:15px}
  .p-hb{color:#111;font-weight:600;font-size:13px;margin-top:4px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{background:#eee;padding:3px 6px;border-radius:8px;font-size:12px;color:#222;font-weight:700}
  .badge.pa{background:#2b6cb0;color:#fff}
  .two-action{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
  .two-action .icon{width:18px;height:18px;border-radius:50%;background:green;display:inline-block}

  .diag{font-size:12px;color:#999;margin-top:6px}

  /* pagination */
  .pager{display:flex;gap:8px;align-items:center;margin-top:10px}
  .page-info{font-size:13px;color:var(--muted)}

  /* rarity classes (visuals) */
  .rarity-ur3 { background: linear-gradient(90deg,#e6d9ff 0%,#ffd9e6 18%,#e9dbff 36%,#e8f7d9 56%,#d9f7fb 76%,#cfeaff 100%); color:#1a1a1a; font-weight:450; border-radius:6px; padding:3px 6px; display:inline-block; font-size:11px; }
  .rarity-ur0 { background: linear-gradient(90deg,#f3efff 0%,#fff3f6 18%,#f6efff 36%,#f6fbef 56%,#eefbfd 76%,#eef7ff 100%); color:#000000; font-weight:100; border-radius:6px; padding:3px 6px; display:inline-block; font-size:11px; }
  .rarity-ssr-ssp { background: linear-gradient(90deg,#ff8a33 0%,#ff9f4d 25%,#ffc24f 55%,#ffe27a 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:450; display:inline-block; font-size:11px; }
  .rarity-ssr-sp { background: linear-gradient(90deg,#ffd8b4 0%,#ffe0c2 25%,#ffecb3 55%,#fff7d5 85%); color:#1a1a1a; border-radius:6px; padding:3px 6px; font-weight:100; display:inline-block; font-size:11px; }

  /* ensure unit-top stays side-by-side on small screens */
  @media (max-width:520px){
    .unit-top{flex-wrap:nowrap}
    .unit-top-left{flex:0 0 35%;min-width:140px}
    .unit-top-right{flex:1 1 65%;min-width:200px}
    .map-row{flex-wrap:nowrap}
    .p-top > .col-left{flex:3 1 30%}
    .p-top > .col-center{flex:1 1 10%}
    .p-top > .col-right{flex:6 1 60%}
    .weapons-row{grid-template-columns: auto auto 1fr}
  }
</style>
</head>
<body>
<a class="back" href="index.html">← Unit List</a>

<main>
  <!-- unit area: top (two columns) and bottom (weapons) -->
  <div id="unit-area">
    <div class="unit-top">
      <div class="unit-top-left">
        <img id="unit-thumb" class="thumb" src="" alt="" />
      </div>

          <div id="unit-rarity" class="rarity-badge"></div>
          <div id="unit-move" class="stat-item"></div>
          <div id="unit-range" class="stat-item"></div>
          <div id="unit-obtain" class="stat-item"></div>
        </div>

      </div>
    </div>

    <div class="unit-bottom">
      <!-- unit-feature moved here (above weapons) -->
      <div id="unit-feature" class="feature-line"></div>

      <div style="font-weight:800">武装</div>

      <div class="weapons-row">
        <!-- left: icons -->
        <div class="weapon-icons" aria-hidden="true">
          <div id="icon-physical" class="weapon-icon">物</div>
          <div id="icon-beam" class="weapon-icon">ビ</div>

        <div>
          <div id="weapon-power" class="weapon-power"></div>
          <div id="weapon-range" class="weapon-power"></div>
          <div id="weapon-shape" class="weapon-power"></div>
        </div>

        <!-- right: weapon effects (3rd column) -->
        <div>

        </div>
      </div>

      <div id="map-row" class="map-row" style="display:none"></div>
    </div>
  </div>

  <!-- FILTER area -->
  <div class="filters-area" aria-label="Pilot Filters">
    <div style="font-weight:800">FILTER</div>

    <div class="filters-row">
      <div class="filter-block">
        <label for="filter-pilot-rarity">Rarity</label>
        <select id="filter-pilot-rarity" multiple></select>
      </div>

      <div class="filter-block">
        <label for="filter-pilot-type">Type</label>
        <select id="filter-pilot-type" multiple></select>
      </div>

      <div class="filter-block">
        <label for="filter-pilot-obtain">Obtain</label>
        <select id="filter-pilot-obtain" multiple></select>
      </div>

      <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <div class="sort-area">
          <div style="font-weight:900;color:var(--accent-strong);margin-right:6px">並べ替え</div>
          <select id="pilot-sort" class="select"></select>
        </div>
        <button id="sort-dir" class="btn">降順</button>
      </div>
    </div>

    <div class="filters-row">
      <div style="font-weight:700">Toggles (show only pilots with)</div>
      <div class="toggles">
        <button id="toggle-autoheal" class="btn toggle">自動回復</button>
        <button id="toggle-moveup" class="btn toggle">移動力UP</button>
        <button id="toggle-counterdef" class="btn toggle">反撃支援防御</button>
        <button id="toggle-forcecs" class="btn toggle">強制CS</button>
      </div>
    </div>

    <div class="filters-row">
      <div style="font-weight:700">Skill Filters</div>
      <div id="skill-filter-row" class="skill-icons" aria-hidden="false"></div>
    </div>
  </div>

  <div id="combi-summary" class="diag" aria-live="polite" style="margin-top:10px"></div>

  <!-- pilot list (vertical) -->
  <div id="pilot-list-area">
    <div id="pilot-grid"></div>

    <div class="pager">
      <button id="prev-page" class="btn">Prev</button>
      <div class="page-info" id="page-info">Page 1</div>
      <button id="next-page" class="btn">Next</button>
    </div>
  </div>
</main>

<script>
/* ===== Settings ===== */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = JSON_BASE_URL + "/units.json";
const PILOTS_JSON = JSON_BASE_URL + "/pilots.json";
const COMBI_PART_PREFIX = JSON_BASE_URL + "/combi_part_";
const COMBI_INDEX_JSON = JSON_BASE_URL + "/combi_index.json";
const MAX_COMBI_PARTS_TO_CHECK = 200;
const MAX_CONSECUTIVE_MISSES = 5;
const PAGE_SIZE = 50;

const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage (full)",
  "CD": "Critical Damage",
  "HB0": "耐久回数ビーム",
  "HB1": "耐久回数物理",
  "HB2": "耐久回数特殊",
  "HB3": "耐久回数EX",
  "HB0_F": "耐久回数ビーム (full)",
  "HB1_F": "耐久回数物理 (full)",
  "HB2_F": "耐久回数特殊 (full)",
  "HB3_F": "耐久回数EX (full)",
  "name": "名前"
};

/* skill icons map (user provided) */
const SKILL_ICONS = {
  "ENセーブ": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/a7/20/p/o0139014415681987764.png?caw=800",
  "ENチャージ": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/57/e6/p/o0142014615681987771.png?caw=800",
  "HPリペア": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/46/ad/p/o0139014015681987780.png?caw=800",
  "MPアップ": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/1b/b8/p/o0140014715681987760.png?caw=800",
  "MPアップ（範囲)": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/3c/74/p/o0140014115681994624.png?caw=800",
  "アタックバースト": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/74/c0/p/o0143014315681987747.png?caw=800",
  "クリブースト （率UP)": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/4e/9b/p/o0139014715681987758.png?caw=800",
  "スウェー(SP)": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/5d/10/p/o0143014315681987768.png?caw=800",
  "ハイスピード": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/10/f3/p/o0144014315681994621.png?caw=800",
  "アタックバースト (範囲)": "https://stat.ameba.jp/user_images/20251112/08/winterstory0820/14/df/j/o0145015715714714034.jpg",
  "フォースガード": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/f5/63/p/o0146014415681987781.png?caw=800",
  "レンジブースト": "https://stat.ameba.jp/user_images/20250925/05/winterstory0820/31/50/p/o0146016115682015322.png",
  "ロックオン": "https://stat.ameba.jp/user_images/20250925/05/winterstory0820/be/c7/p/o0142016115682015816.png",
  "命中率・回避率上昇": "https://stat.ameba.jp/user_images/20260124/17/winterstory0820/02/58/j/o0127013415744109737.jpg",
  "CS+1": "https://stat.ameba.jp/user_images/20251016/21/winterstory0820/45/e9/p/o0136013515697655665.png",
  "支援攻撃+1": "https://stat.ameba.jp/user_images/20251016/21/winterstory0820/75/01/p/o0137013815697655660.png",
  "支援防御+1": "https://stat.ameba.jp/user_images/20251016/21/winterstory0820/7f/e6/p/o0137013715697655662.png",
  "覚醒ブースト": "https://stat.ameba.jp/user_images/20250925/04/winterstory0820/3a/ed/p/o0139014315681987751.png",
  "射撃ブースト": "https://stat.ameba.jp/user_images/20251004/13/winterstory0820/66/97/j/o0145014515689195378.jpg?caw=800",
  "格闘ブースト": "https://stat.ameba.jp/user_images/20251001/19/winterstory0820/54/fd/p/o0149014615687591295.png",
  "EN弾数フリー": "https://stat.ameba.jp/user_images/20260207/08/winterstory0820/00/80/j/o0131013415748559744.jpg",
  "フォースガード (範囲)": "https://stat.ameba.jp/user_images/20260207/09/winterstory0820/a6/bf/j/o0127013715748575419.jpg"
};

/* ===== DOM ===== */
const unitThumb = document.getElementById("unit-thumb");
const unitName = document.getElementById("unit-name");
const unitRarity = document.getElementById("unit-rarity");
const unitMove = document.getElementById("unit-move");
const unitRange = document.getElementById("unit-range");
const unitObtain = document.getElementById("unit-obtain");
const unitFeature = document.getElementById("unit-feature");
const unitShield = document.getElementById("unit-shield");
const iconPhysical = document.getElementById("icon-physical");
const iconBeam = document.getElementById("icon-beam");
const iconSpecial = document.getElementById("icon-special");
const weaponPower = document.getElementById("weapon-power");
const weaponRange = document.getElementById("weapon-range");
const weaponShape = document.getElementById("weapon-shape");
const weaponEffects = document.getElementById("weapon-effects");
const mapRow = document.getElementById("map-row");

const filterPilotRarity = document.getElementById("filter-pilot-rarity");
const filterPilotType = document.getElementById("filter-pilot-type");
const filterPilotObtain = document.getElementById("filter-pilot-obtain");
const toggleAutoheal = document.getElementById("toggle-autoheal");
const toggleMoveup = document.getElementById("toggle-moveup");
const toggleCounterdef = document.getElementById("toggle-counterdef");
const toggleForcecs = document.getElementById("toggle-forcecs");
const skillFilterRow = document.getElementById("skill-filter-row");

const pilotSort = document.getElementById("pilot-sort");
const sortDirBtn = document.getElementById("sort-dir");
const combiSummary = document.getElementById("combi-summary");

const pilotGrid = document.getElementById("pilot-grid");
const prevPageBtn = document.getElementById("prev-page");
const nextPageBtn = document.getElementById("next-page");
const pageInfo = document.getElementById("page-info");

const params = new URLSearchParams(location.search);
const uidParam = params.get("uid");

let units = [], pilots = [], combiRows = [];
let currentUnit = null;
let sortKey = "D0";
let sortDesc = true;
let currentPage = 1;
let totalPages = 1;
let currentFiltered = [];

/* skill filter state (set of skill names) */
const selectedSkillFilters = new Set();

/* ===== Helpers ===== */
async function fetchJson(url, opts){
  const res = await fetch(url, opts || {});
  if(!res.ok) throw new Error("Fetch failed: " + url + " (" + res.status + ")");
  return res.json();
}
function fmtDamage(v){
  if(v === null || v === undefined || v === "") return "-";
  const n = Number(v);
  if(isNaN(n)) return "-";
  return new Intl.NumberFormat('ja-JP').format(Math.round(n));
}
function fmtHB(v){
  if(v === null || v === undefined || v === "") return "-";
  const n = Number(v);
  if(isNaN(n)) return "-";
  return n.toFixed(2);
}
function rarityClassFromString(rare){
  if(!rare) return "";
  const s = String(rare).replace(/\s+/g,"").toUpperCase();
  if(s.indexOf("UR") !== -1 && s.indexOf("3") !== -1) return "rarity-ur3";
  if(s.indexOf("UR") !== -1 && (s.indexOf("0") !== -1 || s.indexOf("０") !== -1)) return "rarity-ur0";
  if(s.indexOf("SSR") !== -1 && s.indexOf("SSP") !== -1) return "rarity-ssr-ssp";
  if(s.indexOf("SSP") !== -1 || s.indexOf("SP") !== -1) return "rarity-ssr-sp";
  if(s.indexOf("SSR") !== -1) return "rarity-ssr-ssp";
  return "";
}

/* pidMap */
function buildPidMap(){
  const map = {};
  (pilots || []).forEach(p => {
    const candidates = [p.pid, p["pid"], p["Pilot.キャラ識別"], p["Pilot.キャラ"]];
    for(const c of candidates){
      if(c !== undefined && c !== null && c !== ""){
        map[Number(c)] = p;
        break;
      }
    }
  });
  return map;
}

/* detectCombiParts fallback (HEAD) */
async function detectCombiParts(){
  const parts = [];
  let consecutiveMisses = 0;
  for(let i=0;i<MAX_COMBI_PARTS_TO_CHECK;i++){
    const idx = String(i).padStart(2,"0");
    const url = `${COMBI_PART_PREFIX}${idx}.json`;
    try{
      const res = await fetch(url, { method: 'HEAD' });
      if(res.ok){
        parts.push(url);
        consecutiveMisses = 0;
      } else {
        consecutiveMisses++;
        if(consecutiveMisses >= MAX_CONSECUTIVE_MISSES) break;
      }
    }catch(e){
      consecutiveMisses++;
      if(consecutiveMisses >= MAX_CONSECUTIVE_MISSES) break;
    }
  }
  return parts;
}

/* combi_index handling (cached in sessionStorage) */
const COMBI_INDEX_CACHE_KEY = "combi_index_v1";
function loadCachedCombiIndex(){
  try{
    const raw = sessionStorage.getItem(COMBI_INDEX_CACHE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveCachedCombiIndex(idx){
  try{ sessionStorage.setItem(COMBI_INDEX_CACHE_KEY, JSON.stringify(idx)); }catch(e){}
}
async function fetchCombiIndexFromServer(){
  try{
    const idx = await fetchJson(COMBI_INDEX_JSON);
    saveCachedCombiIndex(idx);
    return idx;
  }catch(e){
    console.warn("Could not fetch combi_index.json:", e);
    return null;
  }
}
async function getPartsForUnit(uid){
  const uidStr = String(Number(uid));
  let idx = loadCachedCombiIndex();
  if(idx && idx[uidStr] && idx[uidStr].length > 0){
    return idx[uidStr].map(fn => `${JSON_BASE_URL}/${fn}`);
  }
  idx = await fetchCombiIndexFromServer();
  if(idx && idx[uidStr] && idx[uidStr].length > 0){
    return idx[uidStr].map(fn => `${JSON_BASE_URL}/${fn}`);
  }
  return [];
}

/* normalize combi row */
function normalizeCombiRow(r){
  const nr = Object.assign({}, r);
  nr.p = (nr.p !== undefined && nr.p !== null && nr.p !== "") ? Number(nr.p) : null;
  nr.pilot_name = nr.pilot_name || nr["Pilot.キャラ"] || "";
  nr.D0 = (nr.D0 !== undefined && nr.D0 !== null && nr.D0 !== "") ? Number(nr.D0) : null;
  nr.D4 = (nr.D4 !== undefined && nr.D4 !== null && nr.D4 !== "") ? Number(nr.D4) : null;
  nr.CD = (nr.CD !== undefined && nr.CD !== null && nr.CD !== "") ? Number(nr.CD) : null;
  nr.HB0 = (nr.HB0 !== undefined && nr.HB0 !== null && nr.HB0 !== "") ? Number(nr.HB0) : null;
  nr.HB1 = (nr.HB1 !== undefined && nr.HB1 !== null && nr.HB1 !== "") ? Number(nr.HB1) : null;
  nr.HB2 = (nr.HB2 !== undefined && nr.HB2 !== null && nr.HB2 !== "") ? Number(nr.HB2) : null;
  nr.HB3 = (nr.HB3 !== undefined && nr.HB3 !== null && nr.HB3 !== "") ? Number(nr.HB3) : null;
  nr.HB0_F = (nr.HB0_F !== undefined && nr.HB0_F !== null && nr.HB0_F !== "") ? Number(nr.HB0_F) : null;
  nr.HB1_F = (nr.HB1_F !== undefined && nr.HB1_F !== null && nr.HB1_F !== "") ? Number(nr.HB1_F) : null;
  nr.HB2_F = (nr.HB2_F !== undefined && nr.HB2_F !== null && nr.HB2_F !== "") ? Number(nr.HB2_F) : null;
  nr.HB3_F = (nr.HB3_F !== undefined && nr.HB3_F !== null && nr.HB3_F !== "") ? Number(nr.HB3_F) : null;
  for(const ck of ["C01","C02","C03","C06","C07","C08","C09","C10","C11","C12"]){
    if(nr[ck] !== undefined && nr[ck] !== null && nr[ck] !== ""){
      nr[ck] = Number(nr[ck]);
    } else {
      nr[ck] = 0;
    }
  }
  nr.t2 = (nr.t2 !== undefined && nr.t2 !== null) ? Number(nr.t2) : 0;
  return nr;
}

/* load combi rows for unit using index (pinpoint) */
async function loadCombiForUnit(uid){
  combiRows = [];
  combiSummary.textContent = "読み込み中";

  let partUrls = [];
  try{ partUrls = await getPartsForUnit(uid); }catch(e){ partUrls = []; }

  if(!partUrls || partUrls.length === 0){
    const allParts = await detectCombiParts();
    if(!allParts || allParts.length === 0){
      combiSummary.textContent = "データが見つかりません";
      return;
    }
    for(const url of allParts){
      try{
        const part = await fetchJson(url);
        for(const r of part){
          const ru = (r.u !== undefined && r.u !== null && r.u !== "") ? Number(r.u) : null;
          if(ru === uid){
            combiRows.push(normalizeCombiRow(r));
          }
        }
      }catch(e){
        console.warn("combi part load failed (fallback):", url, e);
      }
    }
    combiSummary.textContent = `該当 ${combiRows.length} 件 (fallback scan)`;
    applyFiltersAndRender();
    return;
  }

  for(const url of partUrls){
    try{
      const part = await fetchJson(url);
      for(const r of part){
        const ru = (r.u !== undefined && r.u !== null && r.u !== "") ? Number(r.u) : null;
        if(ru === uid){
          combiRows.push(normalizeCombiRow(r));
        }
      }
    }catch(e){
      console.warn("combi part load failed:", url, e);
    }
  }

  combiSummary.textContent = `該当 ${combiRows.length} 件`;
  applyFiltersAndRender();
}

/* ---------- Skill utilities ---------- */
/* Extract skill keys from a pilot object: keys starting with "Pilot.Sk." */
function extractPilotSkills(pilotObj){
  const skills = [];
  for(const k of Object.keys(pilotObj || {})){
    if(k.startsWith("Pilot.Sk.")){
      const val = pilotObj[k];
      if(val !== undefined && val !== null && String(val).trim() !== "" && Number(val) !== 0){
        // skill name is the suffix after "Pilot.Sk. "
        const name = k.replace(/^Pilot\.Sk\.\s*/, "").trim();
        skills.push(name);
      }
    }
  }
  return skills;
}

/* Build global skill icon list from SKILL_ICONS keys (sorted) */
const ALL_SKILLS = Object.keys(SKILL_ICONS).sort((a,b)=> a.localeCompare(b,'ja'));

/* Render skill filter icons (top of filters) */
function renderSkillFilterIcons(){
  skillFilterRow.innerHTML = "";
  ALL_SKILLS.forEach(skillName=>{
    const imgUrl = SKILL_ICONS[skillName];
    const el = document.createElement("img");
    el.src = imgUrl;
    el.alt = skillName;
    el.title = skillName;
    el.className = "skill-icon";
    el.style.width = "20px";
    el.style.height = "20px";
    el.style.objectFit = "cover";
    el.dataset.skill = skillName;
    el.addEventListener("click", ()=>{
      const s = el.dataset.skill;
      if(selectedSkillFilters.has(s)){
        selectedSkillFilters.delete(s);
        el.classList.remove("selected");
      } else {
        selectedSkillFilters.add(s);
        el.classList.add("selected");
      }
      currentPage = 1;
      applyFiltersAndRender();
    });
    skillFilterRow.appendChild(el);
  });
}

/* ---------- Pilot card rendering ---------- */
function renderPilotCard(pilotObj, combi){
  const div = document.createElement("div");
  div.className = "pilot-card";

  const img = document.createElement("img");
  img.className = "p-thumb";
  img.src = pilotObj["Pilot.画像リンク"] || "";
  img.alt = pilotObj["Pilot.キャラ"] || "";
  div.appendChild(img);

  const info = document.createElement("div");
  info.className = "p-info";

  const top = document.createElement("div");
  top.className = "p-top";

  // left column (3)
  const leftCol = document.createElement("div");
  leftCol.className = "col-left";
  const name = document.createElement("div");
  name.className = "p-name";
  name.textContent = pilotObj["Pilot.キャラ"] || combi.pilot_name || "不明";
  leftCol.appendChild(name);

  const dmg = document.createElement("div");
  dmg.className = "p-dmg";
  let dmgText = "-";
  if(sortKey && sortKey !== "name"){
    const v = combi[sortKey];
    if(v !== undefined && v !== null && !isNaN(Number(v))){
      if(String(sortKey).startsWith("HB")){
        dmgText = fmtHB(v);
      } else {
        dmgText = fmtDamage(v);
      }
    }
  } else {
    dmgText = fmtDamage(combi.D0);
  }
  dmg.textContent = dmgText;
  leftCol.appendChild(dmg);

  top.appendChild(leftCol);

  // center column (1) - skill icons vertical up to 3
  const centerCol = document.createElement("div");
  centerCol.className = "col-center";
  const pilotSkills = extractPilotSkills(pilotObj);
  // show up to 3 icons (if more, show first 3)
  const showSkills = pilotSkills.slice(0,3);
  showSkills.forEach(sname=>{
    const imgEl = document.createElement("img");
    imgEl.src = SKILL_ICONS[sname] || "";
    imgEl.alt = sname;
    imgEl.title = sname;
    imgEl.style.width = "20px";
    imgEl.style.height = "20px";
    imgEl.style.objectFit = "cover";
    centerCol.appendChild(imgEl);
  });
  top.appendChild(centerCol);

  // right column (6)
  const rightCol = document.createElement("div");
  rightCol.className = "col-right";
  rightCol.style.fontSize = "13px";
  rightCol.style.color = "#333";

  // show Pilot.特徴のタイプ, Pilot.特徴, Pilot.条件 if non-empty (values only)
  const ftype = pilotObj["Pilot.特徴のタイプ"];
  const ftext = pilotObj["Pilot.特徴"];
  const fcond = pilotObj["Pilot.条件"];

  if(ftype !== undefined && ftype !== null && String(ftype).trim() !== "" && String(ftype).trim() !== "0"){
    const el = document.createElement("div");
    el.textContent = String(ftype);
    rightCol.appendChild(el);
  }
  if(ftext !== undefined && ftext !== null && String(ftext).trim() !== "" && String(ftext).trim() !== "0"){
    const el = document.createElement("div");
    el.textContent = String(ftext);
    rightCol.appendChild(el);
  }
  if(fcond !== undefined && fcond !== null && String(fcond).trim() !== "" && String(fcond).trim() !== "0"){
    const el = document.createElement("div");
    el.textContent = String(fcond);
    rightCol.appendChild(el);
  }

  top.appendChild(rightCol);
  info.appendChild(top);

  // badges
  const badges = document.createElement("div");
  badges.className = "badges";
  if((combi.C06 === 1) && (combi.C07 === 1)){
    const b = document.createElement("div"); b.className = "badge pa"; b.textContent = "PAシリーズ＆タグ"; badges.appendChild(b);
  } else {
    if(combi.C01 === 1){ const b=document.createElement("div"); b.className="badge pa"; b.textContent="PA相性"; badges.appendChild(b); }
    if(combi.C02 === 1){ const b=document.createElement("div"); b.className="badge pa"; b.textContent="PAタグ"; badges.appendChild(b); }
    if(combi.C03 === 1){ const b=document.createElement("div"); b.className="badge pa"; b.textContent="PAシリーズ"; badges.appendChild(b); }
    if(combi.C06 === 1 && combi.C07 !== 1){ const b=document.createElement("div"); b.className="badge pa"; b.textContent="PAシリーズ"; badges.appendChild(b); }
    if(combi.C07 === 1 && combi.C06 !== 1){ const b=document.createElement("div"); b.className="badge pa"; b.textContent="PAタグ"; badges.appendChild(b); }
    if(combi.C08 === 1){ const b=document.createElement("div"); b.className="badge pa"; b.textContent="PAユニット"; badges.appendChild(b); }
  }
  info.appendChild(badges);

  if(combi.t2 === 1){
    const two = document.createElement("div");
    two.className = "two-action";
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.title = "2回行動";
    two.appendChild(icon);
    const txt = document.createElement("span");
    txt.textContent = "2回行動";
    txt.style.fontSize = "13px";
    txt.style.fontWeight = "700";
    two.appendChild(txt);
    info.appendChild(two);
  }

  div.appendChild(info);
  return div;
}

/* ---------- Filtering, sorting, pagination ---------- */
function populateSortOptions(){
  pilotSort.innerHTML = "";
  const optName = document.createElement("option");
  optName.value = "name";
  optName.textContent = "名前";
  pilotSort.appendChild(optName);
  Object.keys(FIELD_LABELS).forEach(k => {
    if(k === "name") return;
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = FIELD_LABELS[k] + " (" + k + ")";
    pilotSort.appendChild(opt);
  });
  pilotSort.value = sortKey;
}

function uniqueValuesFromPilots(key){
  const s = new Set();
  (pilots || []).forEach(p => {
    const v = (p[key] || "").toString().trim();
    if(v !== "") s.add(v);
  });
  return Array.from(s).sort((a,b)=> a.localeCompare(b,'ja'));
}

function populatePilotFilterOptions(){
  populateSelect(filterPilotRarity, uniqueValuesFromPilots("Pilot.レア"));
  populateSelect(filterPilotType, uniqueValuesFromPilots("Pilot.タイプ"));
  populateSelect(filterPilotObtain, uniqueValuesFromPilots("Pilot.入手"));
}

function populateSelect(el, values){
  el.innerHTML = "";
  values.forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    el.appendChild(opt);
  });
  // make click/tap toggle selection (helpful on mobile)
  el.addEventListener('mousedown', function(e){
    // prevent default to allow toggling on single tap
    e.preventDefault();
    const option = document.elementFromPoint(e.clientX, e.clientY);
    if(option && option.tagName === 'OPTION'){
      option.selected = !option.selected;
      // trigger change
      const ev = new Event('change', { bubbles: true });
      el.dispatchEvent(ev);
    }
  });
}

function getMultiSelectValues(selectEl){
  return Array.from(selectEl.selectedOptions).map(o=>o.value).filter(v=>v!=="");
}

function applyFiltersAndRender(){
  const pidMap = buildPidMap();

  const rarities = getMultiSelectValues(filterPilotRarity);
  const types = getMultiSelectValues(filterPilotType);
  const obtains = getMultiSelectValues(filterPilotObtain);

  const toggles = {
    autoheal: toggleAutoheal.classList.contains("active"),
    moveup: toggleMoveup.classList.contains("active"),
    counterdef: toggleCounterdef.classList.contains("active"),
    forcecs: toggleForcecs.classList.contains("active")
  };

  let list = combiRows.slice();

  list = list.filter(c => {
    const p = (c.p !== null && pidMap[c.p]) ? pidMap[c.p] : null;
    if(!p) return false;
    if(rarities.length && !rarities.includes((p["Pilot.レア"]||"").toString())) return false;
    if(types.length && !types.includes((p["Pilot.タイプ"]||"").toString())) return false;
    if(obtains.length && !obtains.includes((p["Pilot.入手"]||"").toString())) return false;
    if(toggles.autoheal && Number(p["Pilot.自動回復"]||0) === 0) return false;
    if(toggles.moveup && Number(p["Pilot.移動力UP"]||0) === 0) return false;
    if(toggles.counterdef && Number(p["Pilot.反撃支援防御"]||0) === 0) return false;
    if(toggles.forcecs && Number(p["Pilot.強制CS"]||0) === 0) return false;

    // skill filters: AND condition for all selected skills
    if(selectedSkillFilters.size > 0){
      const pilotSkills = extractPilotSkills(p);
      for(const sk of selectedSkillFilters){
        if(!pilotSkills.includes(sk)) return false;
      }
    }

    return true;
  });

  const key = pilotSort.value || "D0";
  if(key === "name"){
    list.sort((a,b)=>{
      const sa = ((pidMap[a.p] && pidMap[a.p]["Pilot.キャラ"]) || a.pilot_name || "").toString();
      const sb = ((pidMap[b.p] && pidMap[b.p]["Pilot.キャラ"]) || b.pilot_name || "").toString();
      return sortDesc ? sb.localeCompare(sa,'ja') : sa.localeCompare(sb,'ja');
    });
  } else {
    list.sort((a,b)=>{
      const va = (a[key] !== undefined && a[key] !== null) ? Number(a[key]) : null;
      const vb = (b[key] !== undefined && b[key] !== null) ? Number(b[key]) : null;
      const na = (va === null || isNaN(va)) ? -Infinity : va;
      const nb = (vb === null || isNaN(vb)) ? -Infinity : vb;
      return sortDesc ? nb - na : na - nb;
    });
  }

  currentFiltered = list;
  totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  renderPage();
}

function renderPage(){
  pilotGrid.innerHTML = "";
  const total = currentFiltered.length;
  if(total === 0){
    combiSummary.textContent = "該当 0 件";
    pageInfo.textContent = `Page 0 / 0`;
    prevPageBtn.disabled = true;
    nextPageBtn.disabled = true;
    return;
  }
  combiSummary.textContent = `該当 ${total} 件`;
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const pageItems = currentFiltered.slice(start, end);

  const pidMap = buildPidMap();
  for(const combi of pageItems){
    const p = (combi.p !== null && pidMap[combi.p]) ? pidMap[combi.p] : null;
    const pilotObj = p || { "Pilot.キャラ": combi.pilot_name || "不明", "Pilot.画像リンク": "" };
    pilotGrid.appendChild(renderPilotCard(pilotObj, combi));
  }

  pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
  prevPageBtn.disabled = (currentPage <= 1);
  nextPageBtn.disabled = (currentPage >= totalPages);
}

/* ---------- Initialization ---------- */
async function init(){
  try{
    const unitsData = await fetchJson(UNITS_JSON);
    units = unitsData || [];
    const pilotsData = await fetchJson(PILOTS_JSON);
    pilots = pilotsData || [];

    const uid = Number(uidParam);
    currentUnit = units.find(u => Number(u.uid) === uid);
    if(!currentUnit){
      unitName.textContent = "ユニットが見つかりません";
      combiSummary.textContent = "";
      return;
    }

    renderUnitInfo(currentUnit);

    populatePilotFilterOptions();
    populateSortOptions();
    renderSkillFilterIcons();

    await loadCombiForUnit(currentUnit.uid);
  }catch(err){
    console.error(err);
    combiSummary.textContent = "読み込みエラー";
  }
}

/* ---------- Events ---------- */
pilotSort.addEventListener("change", ()=>{
  sortKey = pilotSort.value || "D0";
  applyFiltersAndRender();
});
sortDirBtn.addEventListener("click", ()=>{
  sortDesc = !sortDesc;
  sortDirBtn.textContent = sortDesc ? "降順" : "昇順";
  applyFiltersAndRender();
});

[ toggleAutoheal, toggleMoveup, toggleCounterdef, toggleForcecs ].forEach(btn=>{
  btn.addEventListener("click", ()=>{
    btn.classList.toggle("active");
    currentPage = 1;
    applyFiltersAndRender();
  });
});

[ filterPilotRarity, filterPilotType, filterPilotObtain ].forEach(sel=>{
  sel.addEventListener("change", ()=>{ currentPage = 1; applyFiltersAndRender(); });
});

/* pagination */
prevPageBtn.addEventListener("click", ()=>{
  if(currentPage > 1){ currentPage--; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
});
nextPageBtn.addEventListener("click", ()=>{
  if(currentPage < totalPages){ currentPage++; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); }
});

/* ---------- Start ---------- */
init();
</script>
