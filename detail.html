<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ユニット詳細</title>
<style>
  :root{
    --gap:10px;
    --thumb-large:120px;
    --pilot-thumb:56px;
    --muted:#666;
    --accent:#2b6cb0;
    font-family: system-ui, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Segoe UI", Arial;
  }
  body{margin:16px;color:#111;background:#fff}
  .back{display:inline-block;margin-bottom:12px;color:var(--accent);text-decoration:none}
  .top{display:flex;gap:12px;align-items:center}
  .thumb{width:var(--thumb-large);height:var(--thumb-large);object-fit:cover;border:1px solid #ddd;border-radius:6px}
  .info{flex:1}
  .label{font-size:13px;color:#666}
  .value{font-size:16px;margin-bottom:6px}
  .controls{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer}
  .select{padding:6px;border-radius:6px;border:1px solid #ccc;background:#fff}
  .grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .pilot-card{border:1px solid #eee;padding:8px;border-radius:8px;display:flex;gap:8px;align-items:flex-start;background:#fff}
  .p-thumb{width:var(--pilot-thumb);height:var(--pilot-thumb);object-fit:cover;border-radius:6px;border:1px solid #ddd}
  .p-info{font-size:13px;flex:1}
  .p-name{font-weight:700;margin-bottom:6px}
  .p-dmg{color:#b33;font-weight:700;font-size:15px}
  .p-hb{color:#111;font-weight:600;font-size:13px;margin-top:4px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{background:#eee;padding:3px 6px;border-radius:8px;font-size:12px;color:#222;font-weight:700}
  .badge.pa{background:#2b6cb0;color:#fff} /* Pilot Ability 系バッジ色 */
  .two-action{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
  .two-action .icon{width:18px;height:18px;border-radius:50%;background:green;display:inline-block}
  .loading{color:#666}
  .note{font-size:13px;color:#666;margin-top:8px}
  .diag{font-size:12px;color:#999;margin-top:6px}
  @media (max-width:720px){
    .top{flex-direction:column;align-items:flex-start}
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  }
</style>
</head>
<body>
<a class="back" href="index.html">← ユニット一覧へ戻る</a>

<main>
  <div id="unit-area" class="top">
    <img id="unit-thumb" class="thumb" src="" alt="" />
    <div class="info">
      <div id="unit-name" style="font-size:20px;font-weight:700"></div>
      <div class="label">レア / タイプ / 移動力 / 最大射程 / 入手</div>
      <div id="unit-meta" class="value"></div>
      <div class="controls">
        <label style="display:flex;flex-direction:column">
          <span style="font-size:12px;color:#666">並べ替え</span>
          <select id="pilot-sort" class="select"></select>
        </label>
        <button id="sort-dir" class="btn">降順</button>
        <div id="loading-note" class="note">読み込み中</div>
      </div>
    </div>
  </div>

  <section>
    <h3 style="margin-top:18px">該当パイロット</h3>
    <div id="combi-summary" class="diag" aria-live="polite"></div>
    <div id="pilot-grid" class="grid"></div>
  </section>
</main>

<script>
/* ===== 設定 ===== */
const JSON_BASE_URL = "./json-file";
const UNITS_JSON = JSON_BASE_URL + "/units.json";
const PILOTS_JSON = JSON_BASE_URL + "/pilots.json";
const COMBI_PART_PREFIX = JSON_BASE_URL + "/combi_part_";
const COMBI_INDEX_JSON = JSON_BASE_URL + "/combi_index.json";
const MAX_COMBI_PARTS_TO_CHECK = 200;
const MAX_CONSECUTIVE_MISSES = 5;

/* 並べ替えラベル（index.html と同じキーを使う） */
const FIELD_LABELS = {
  "D0": "Damage",
  "D4": "Damage (full)",
  "CD": "Critical Damage",
  "HB0": "耐久回数ビーム",
  "HB1": "耐久回数物理",
  "HB2": "耐久回数特殊",
  "HB3": "耐久回数EX",
  "HB0_F": "耐久回数ビーム (full)",
  "HB1_F": "耐久回数物理 (full)",
  "HB2_F": "耐久回数特殊 (full)",
  "HB3_F": "耐久回数EX (full)",
  "name": "名前"
};

/* ===== DOM ===== */
const unitThumb = document.getElementById("unit-thumb");
const unitName = document.getElementById("unit-name");
const unitMeta = document.getElementById("unit-meta");
const combiSummary = document.getElementById("combi-summary");
const pilotGrid = document.getElementById("pilot-grid");
const pilotSort = document.getElementById("pilot-sort");
const sortDirBtn = document.getElementById("sort-dir");
const loadingNote = document.getElementById("loading-note");

const params = new URLSearchParams(location.search);
const uidParam = params.get("uid");

let units = [], pilots = [], combiRows = [];
let currentUnit = null;
let sortKey = "D0";
let sortDesc = true;

/* ===== ヘルパー ===== */
async function fetchJson(url, opts){
  const res = await fetch(url, opts || {});
  if(!res.ok) throw new Error("Fetch failed: " + url + " (" + res.status + ")");
  return res.json();
}
function fmtDamage(v){
  if(v === null || v === undefined || v === "") return "-";
  const n = Number(v);
  if(isNaN(n)) return "-";
  return new Intl.NumberFormat('ja-JP').format(Math.round(n));
}
function fmtHB(v){
  if(v === null || v === undefined || v === "") return "-";
  const n = Number(v);
  if(isNaN(n)) return "-";
  return n.toFixed(2);
}
function makeBadge(text, cls){
  const d = document.createElement("div");
  d.className = "badge " + (cls || "");
  d.textContent = text;
  return d;
}

/* pidMap 作成（柔軟にキーを探す） */
function buildPidMap(){
  const map = {};
  (pilots || []).forEach(p => {
    const candidates = [p.pid, p["pid"], p["Pilot.キャラ識別"], p["Pilot.キャラ"]];
    for(const c of candidates){
      if(c !== undefined && c !== null && c !== ""){
        map[Number(c)] = p;
        break;
      }
    }
  });
  return map;
}

/* 既存の detectCombiParts（フォールバック用） */
async function detectCombiParts(){
  const parts = [];
  let consecutiveMisses = 0;
  for(let i=0;i<MAX_COMBI_PARTS_TO_CHECK;i++){
    const idx = String(i).padStart(2,"0");
    const url = `${COMBI_PART_PREFIX}${idx}.json`;
    try{
      const res = await fetch(url, { method: 'HEAD' });
      if(res.ok){
        parts.push(url);
        consecutiveMisses = 0;
      } else {
        consecutiveMisses++;
        if(consecutiveMisses >= MAX_CONSECUTIVE_MISSES) break;
      }
    }catch(e){
      consecutiveMisses++;
      if(consecutiveMisses >= MAX_CONSECUTIVE_MISSES) break;
    }
  }
  return parts;
}

/* ---------- 新: combi_index を読み、uid に紐づくパートだけ返す ---------- */
/* キャッシュキー */
const COMBI_INDEX_CACHE_KEY = "combi_index_v1";

/* try to load cached index from sessionStorage */
function loadCachedCombiIndex(){
  try{
    const raw = sessionStorage.getItem(COMBI_INDEX_CACHE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}

/* save index to sessionStorage */
function saveCachedCombiIndex(idx){
  try{
    sessionStorage.setItem(COMBI_INDEX_CACHE_KEY, JSON.stringify(idx));
  }catch(e){
    // ignore
  }
}

/* fetch combi_index.json from server and cache it */
async function fetchCombiIndexFromServer(){
  try{
    const idx = await fetchJson(COMBI_INDEX_JSON);
    saveCachedCombiIndex(idx);
    return idx;
  }catch(e){
    console.warn("Could not fetch combi_index.json:", e);
    return null;
  }
}

/* get part URLs for a given uid using index (cached or fetched).
   Returns array of full URLs (e.g., "./json-file/combi_part_03.json") or [] if none. */
async function getPartsForUnit(uid){
  const uidStr = String(Number(uid));
  // 1) try cached index
  let idx = loadCachedCombiIndex();
  if(idx && idx[uidStr] && idx[uidStr].length > 0){
    return idx[uidStr].map(fn => `${JSON_BASE_URL}/${fn}`);
  }
  // 2) try fetch index from server
  idx = await fetchCombiIndexFromServer();
  if(idx && idx[uidStr] && idx[uidStr].length > 0){
    return idx[uidStr].map(fn => `${JSON_BASE_URL}/${fn}`);
  }
  // 3) not found in index: return empty array (caller may fallback to full scan)
  return [];
}

/* combi 行の正規化（元の loadCombiForUnit と同じ処理を関数化） */
function normalizeCombiRow(r){
  const nr = Object.assign({}, r);
  nr.p = (nr.p !== undefined && nr.p !== null && nr.p !== "") ? Number(nr.p) : null;
  nr.pilot_name = nr.pilot_name || nr["Pilot.キャラ"] || "";
  nr.D0 = (nr.D0 !== undefined && nr.D0 !== null && nr.D0 !== "") ? Number(nr.D0) : null;
  nr.D4 = (nr.D4 !== undefined && nr.D4 !== null && nr.D4 !== "") ? Number(nr.D4) : null;
  nr.CD = (nr.CD !== undefined && nr.CD !== null && nr.CD !== "") ? Number(nr.CD) : null;
  nr.HB0 = (nr.HB0 !== undefined && nr.HB0 !== null && nr.HB0 !== "") ? Number(nr.HB0) : null;
  nr.HB1 = (nr.HB1 !== undefined && nr.HB1 !== null && nr.HB1 !== "") ? Number(nr.HB1) : null;
  nr.HB2 = (nr.HB2 !== undefined && nr.HB2 !== null && nr.HB2 !== "") ? Number(nr.HB2) : null;
  nr.HB3 = (nr.HB3 !== undefined && nr.HB3 !== null && nr.HB3 !== "") ? Number(nr.HB3) : null;
  nr.HB0_F = (nr.HB0_F !== undefined && nr.HB0_F !== null && nr.HB0_F !== "") ? Number(nr.HB0_F) : null;
  nr.HB1_F = (nr.HB1_F !== undefined && nr.HB1_F !== null && nr.HB1_F !== "") ? Number(nr.HB1_F) : null;
  nr.HB2_F = (nr.HB2_F !== undefined && nr.HB2_F !== null && nr.HB2_F !== "") ? Number(nr.HB2_F) : null;
  nr.HB3_F = (nr.HB3_F !== undefined && nr.HB3_F !== null && nr.HB3_F !== "") ? Number(nr.HB3_F) : null;
  for(const ck of ["C01","C02","C03","C06","C07","C08","C09","C10","C11","C12"]){
    if(nr[ck] !== undefined && nr[ck] !== null && nr[ck] !== ""){
      nr[ck] = Number(nr[ck]);
    } else {
      nr[ck] = 0;
    }
  }
  nr.t2 = (nr.t2 !== undefined && nr.t2 !== null) ? Number(nr.t2) : 0;
  return nr;
}

/* ---------- 改良版 loadCombiForUnit: index を使ってピンポイント取得 ---------- */
async function loadCombiForUnit(uid){
  combiRows = [];
  loadingNote.textContent = "読み込み中";
  combiSummary.textContent = "";

  // 1) try to get part URLs from combi_index.json
  let partUrls = [];
  try{
    partUrls = await getPartsForUnit(uid);
  }catch(e){
    console.warn("getPartsForUnit failed:", e);
    partUrls = [];
  }

  // 2) If index returned nothing, fallback to detectCombiParts() (full scan)
  if(!partUrls || partUrls.length === 0){
    // attempt to detect parts (HEAD) and then scan them sequentially
    const allParts = await detectCombiParts();
    if(!allParts || allParts.length === 0){
      combiSummary.textContent = "データが見つかりません";
      loadingNote.textContent = "";
      return;
    }
    // scan all parts but stop early if desired (we will scan all to be safe)
    for(const url of allParts){
      try{
        const part = await fetchJson(url);
        for(const r of part){
          const ru = (r.u !== undefined && r.u !== null && r.u !== "") ? Number(r.u) : null;
          if(ru === uid){
            const nr = normalizeCombiRow(r);
            combiRows.push(nr);
          }
        }
      }catch(e){
        console.warn("combi part load failed (fallback):", url, e);
      }
    }
    loadingNote.textContent = "";
    combiSummary.textContent = `該当 ${combiRows.length} 件 (fallback scan)`;
    applyPilotSortAndRender();
    return;
  }

  // 3) If we have pinpointed partUrls, fetch only those
  for(const url of partUrls){
    try{
      const part = await fetchJson(url);
      for(const r of part){
        const ru = (r.u !== undefined && r.u !== null && r.u !== "") ? Number(r.u) : null;
        if(ru === uid){
          const nr = normalizeCombiRow(r);
          combiRows.push(nr);
        }
      }
    }catch(e){
      console.warn("combi part load failed:", url, e);
    }
  }

  loadingNote.textContent = "";
  combiSummary.textContent = `該当 ${combiRows.length} 件`;
  applyPilotSortAndRender();
}

/* ---------- パイロットカードを作る ---------- */
function renderPilotCard(pilotObj, combi){
  const div = document.createElement("div");
  div.className = "pilot-card";

  const img = document.createElement("img");
  img.className = "p-thumb";
  img.src = pilotObj["Pilot.画像リンク"] || "";
  img.alt = pilotObj["Pilot.キャラ"] || "";
  div.appendChild(img);

  const info = document.createElement("div");
  info.className = "p-info";

  const name = document.createElement("div");
  name.className = "p-name";
  name.textContent = pilotObj["Pilot.キャラ"] || combi.pilot_name || "不明";
  info.appendChild(name);

  // ダメージ（千区切り）
  const dmg = document.createElement("div");
  dmg.className = "p-dmg";
  const dval = combi[sortKey] !== undefined && combi[sortKey] !== null ? combi[sortKey] : (combi.D0 || null);
  let dmgText = "-";
  if(sortKey && sortKey !== "name"){
    const v = combi[sortKey];
    if(v !== undefined && v !== null && !isNaN(Number(v))){
      if(String(sortKey).startsWith("HB")){
        dmgText = fmtHB(v);
      } else {
        dmgText = fmtDamage(v);
      }
    }
  } else {
    dmgText = fmtDamage(combi.D0);
  }
  dmg.textContent = dmgText;
  info.appendChild(dmg);

  // 耐久回数（HB1 を優先して表示 if available; else HB0）
  const hbKeyCandidates = ["HB1","HB0","HB2","HB3"];
  let hbVal = null;
  for(const k of hbKeyCandidates){
    if(combi[k] !== undefined && combi[k] !== null){
      hbVal = combi[k];
      break;
    }
  }
  const hbEl = document.createElement("div");
  hbEl.className = "p-hb";
  hbEl.textContent = hbVal !== null ? `耐久: ${fmtHB(hbVal)}` : `耐久: -`;
  info.appendChild(hbEl);

  // 条件バッジ（C01..C08 の条件に応じて表示）
  const badges = document.createElement("div");
  badges.className = "badges";
  if((combi.C06 === 1) && (combi.C07 === 1)){
    badges.appendChild(makeBadge("PAシリーズ＆タグ","pa"));
  } else {
    if(combi.C01 === 1) badges.appendChild(makeBadge("PA相性","pa"));
    if(combi.C02 === 1) badges.appendChild(makeBadge("PAタグ","pa"));
    if(combi.C03 === 1) badges.appendChild(makeBadge("PAシリーズ","pa"));
    if(combi.C06 === 1 && combi.C07 !== 1) badges.appendChild(makeBadge("PAシリーズ","pa"));
    if(combi.C07 === 1 && combi.C06 !== 1) badges.appendChild(makeBadge("PAタグ","pa"));
    if(combi.C08 === 1) badges.appendChild(makeBadge("PAユニット","pa"));
  }
  info.appendChild(badges);

  // 2回行動アイコン（t2）
  if(combi.t2 === 1){
    const two = document.createElement("div");
    two.className = "two-action";
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.title = "2回行動";
    two.appendChild(icon);
    const txt = document.createElement("span");
    txt.textContent = "2回行動";
    txt.style.fontSize = "13px";
    txt.style.fontWeight = "700";
    two.appendChild(txt);
    info.appendChild(two);
  }

  div.appendChild(info);
  return div;
}

/* 並べ替えと描画 */
function applyPilotSortAndRender(){
  const pidMap = buildPidMap();
  let list = combiRows.slice();

  if(sortKey === "name"){
    list.sort((a,b)=>{
      const sa = ((pidMap[a.p] && pidMap[a.p]["Pilot.キャラ"]) || a.pilot_name || "").toString();
      const sb = ((pidMap[b.p] && pidMap[b.p]["Pilot.キャラ"]) || b.pilot_name || "").toString();
      return sortDesc ? sb.localeCompare(sa, 'ja') : sa.localeCompare(sb, 'ja');
    });
  } else {
    list.sort((a,b)=>{
      const va = (a[sortKey] !== undefined && a[sortKey] !== null) ? Number(a[sortKey]) : null;
      const vb = (b[sortKey] !== undefined && b[sortKey] !== null) ? Number(b[sortKey]) : null;
      const na = (va === null || isNaN(va)) ? -Infinity : va;
      const nb = (vb === null || isNaN(vb)) ? -Infinity : vb;
      return sortDesc ? nb - na : na - nb;
    });
  }

  pilotGrid.innerHTML = "";
  if(list.length === 0){
    combiSummary.textContent = "該当 0 件";
    return;
  }
  combiSummary.textContent = `該当 ${list.length} 件`;
  const pidCache = buildPidMap(); // small optimization
  for(const combi of list){
    const p = (combi.p !== null && pidCache[combi.p]) ? pidCache[combi.p] : null;
    const pilotObj = p || { "Pilot.キャラ": combi.pilot_name || "不明", "Pilot.画像リンク": "" };
    pilotGrid.appendChild(renderPilotCard(pilotObj, combi));
  }
}

/* 並べ替えドロップダウンを作る */
function populateSortOptions(){
  pilotSort.innerHTML = "";
  const optName = document.createElement("option");
  optName.value = "name";
  optName.textContent = "名前";
  pilotSort.appendChild(optName);
  Object.keys(FIELD_LABELS).forEach(k => {
    if(k === "name") return;
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = FIELD_LABELS[k] + " (" + k + ")";
    pilotSort.appendChild(opt);
  });
  pilotSort.value = sortKey;
}

/* 初期化 */
async function init(){
  try{
    const unitsData = await fetchJson(UNITS_JSON);
    units = unitsData || [];
    const pilotsData = await fetchJson(PILOTS_JSON);
    pilots = pilotsData || [];

    const uid = Number(uidParam);
    currentUnit = units.find(u => Number(u.uid) === uid);
    if(!currentUnit){
      document.getElementById("unit-name").textContent = "ユニットが見つかりません";
      combiSummary.textContent = "ユニット ID を確認してください";
      loadingNote.textContent = "";
      return;
    }

    unitThumb.src = currentUnit["画像リンク"] || "";
    unitName.textContent = currentUnit["ユニット"] || ("ID:" + currentUnit.uid);
    unitMeta.textContent = `${currentUnit["レア"] || ""} / ${currentUnit["タイプ"] || ""} / 移動:${currentUnit["移動力"] || ""} / 射程:${currentUnit["最大射程"] || ""} / 入手:${currentUnit["入手"] || ""}`;

    populateSortOptions();

    // load combi rows for this unit (uses combi_index.json if available)
    await loadCombiForUnit(currentUnit.uid);
  }catch(err){
    console.error(err);
    combiSummary.textContent = "読み込みエラー";
    loadingNote.textContent = "";
  }
}

/* イベント */
pilotSort.addEventListener("change", ()=>{
  sortKey = pilotSort.value || "D0";
  applyPilotSortAndRender();
});
sortDirBtn.addEventListener("click", ()=>{
  sortDesc = !sortDesc;
  sortDirBtn.textContent = sortDesc ? "降順" : "昇順";
  applyPilotSortAndRender();
});

/* 起動 */
init();
</script>
</body>
</html>
